<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <text y='.9em' font-size='90'>📜</text></svg>">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Naskah Dikili Gorontalo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1117;
      --surface: #161b22;
      --surface-card: #1c2129;
      --surface-hover: #21272e;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-dim: #484f58;
      --primary: #10b981;
      --primary-light: #34d399;
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --blue: #3b82f6;
      --font-arabic: 'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --arabic-size: 28px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-header {
      background: linear-gradient(135deg, #064e3b 0%, #0c1117 100%);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-title { font-size: 18px; font-weight: 900; color: var(--primary-light); }
    .app-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    
    .nav-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-item {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-item.active {
      color: var(--primary-light);
      border-bottom-color: var(--primary);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tool-btn {
      padding: 4px 12px;
      background: var(--surface-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .tool-btn:hover { background: var(--surface-hover); }

    .view-section { display: none; padding: 16px; max-width: 800px; margin: 0 auto; }
    .view-section.active { display: block; }
    
    .section-title { font-size: 18px; font-weight: 900; margin-bottom: 8px; color: var(--text); }
    .section-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

    /* Manuscript display styles */
    .sair-selector {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      background: var(--surface-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .content-block {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--surface-card);
      border: 1px solid var(--border);
    }
    
    .block-arabic {
      font-family: var(--font-arabic);
      font-size: var(--arabic-size);
      line-height: 2.2;
      color: var(--gold-light);
      text-align: right;
      direction: rtl;
      padding: 16px;
      background: rgba(245,158,11,0.05);
      border-left: 3px solid var(--gold);
    }
    
    .block-transliteration {
      font-size: 13px;
      font-style: italic;
      color: var(--primary-light);
      border-left: 3px solid var(--primary);
    }
    
    .block-translation {
      font-size: 13px;
      color: var(--text);
      border-left: 3px solid var(--blue);
      background: rgba(59,130,246,0.05);
    }
    
    .block-text {
      font-size: 13px;
      color: var(--text);
    }
    
    .block-footnote {
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 8px;
      background: transparent;
      border: none;
      border-top: 1px dashed var(--border);
      border-radius: 0;
    }

    /* Cards */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary-light);
      margin-bottom: 8px;
    }
    .card-content {
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
    }

    /* Light Theme */
    body.light {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-card: #ffffff;
      --surface-hover: #f0f2f5;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #656d76;
      --gold-light: #b45309;
    }
  
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }
        .nav-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 48%;
        }
        .nav-btn:hover {
            background-color: var(--border-color);
        }
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .nav-btn-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            display: block;
            margin-bottom: 2px;
        }
        .nav-btn-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-btn-content {
            display: flex;
            flex-direction: column;
            text-align: left;
            overflow: hidden;
        }
        .nav-btn.next .nav-btn-content {
            text-align: right;
        }

    </style>
</head>

  <script>
    const DATA = {"info": {"title": "Naskah Dikili Gorontalo", "subtitle": "Edisi Kritis berdasarkan Naskah D (Mustapa Taha)", "authors": "Dr. Ayuba Pantu, M.Pd & Dr. H. Muh. Arif, M.Ag", "institution": "IAIN Sultan Amai Gorontalo", "year": 2015, "manuscript_base": "Naskah D milik Mustapa Taha (188 halaman, disalin ±1999 M)", "method": "Metode Landasan/Induk (Edisi Kritis)", "content_summary": "17 sair dikili dengan 62 sisipan jābu, hikayat Nabi Muhammad SAW, ayat Al-Quran, hadits, terjemahan bahasa Indonesia dan Gorontalo, serta doa khatmul dikili"}, "sairs": [{"id": 1, "name": "Sair Pertama", "blocks": [{"type": "text", "text": "a. Sair pertama;"}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nالسﻼم عليك  ٭    اتقى اﻻتقياء\nالسﻼم عليك٭   ازكى اﻻزكياء\nالسﻼم عليك  ٭    زين اﻻنبياء\nالسﻼم عليك٭ اصفى اﻻصفياء"}, {"type": "footnote", "text": "1Penghitungan jumlah ini berdasarkan penuturan orang-orang tua yang tergolong ahli dikili atau yang sudah biasa membacakan/melafazkan dikili.;"}, {"type": "arabic", "text": "السﻼم عليك٭دائما بﻼ انقضاء السﻼم عليك ٭من رب السماء"}, {"type": "transliteration", "text": "assalāmu ' alaika zainal anbiyā'i; assalāmu 'alaika atqal atqiyā'i.\nassalāmu 'alaika aṣfal aṣfiyā'i; assalāmu 'alaika azkal azkiyā'i.\nassalāmu 'alaika min rabbis- samā'i; assalāmu 'alaikadāiman bilā inqiḍā'i."}, {"type": "translation", "text": "\"Selamat buatmu, yang termulia di antara para nabi; Selamat buatmu, yang paling bertaqwa di antara orang-orang yang bertaqwa; Selamat buatmu, yang paling ikhlas di antara orang-orang yang ikhlas; Selamat buatmu, yang paling bersih diantara orang-orang yang bersih; Selamat buatmu, yang berasal dari tuhan (pemilik) langit, Selamat buatmu, yang senantiasa tidak pernah ingkar (melawan)\"."}, {"type": "arabic", "text": "السﻼم عليك٭ احمد يا حبيبى السﻼم عليك  ٭   زين اﻻنبياء\nالسﻼم عليك  ٭   زين اﻻنبياء\nالسﻼم عليك  ٭  طه يا  مم جد\nالسﻼم عليك  ٭  طه يا طبيبى\nالسﻼم عليك  ٭  احمد يا محمد"}, {"type": "transliteration", "text": "assalāmu 'alaika zainal anbiyā'i; assalāmu 'alaika ahmad yā habībī.\nassalāmu 'alaika ṭāhā yāṭabībī; assalāmu 'alaika zainal anbiyā'i.\nassalāmu 'alaika ahmad yā muhammad; assalāmu 'alaika ṭāhā yā mumajjad."}, {"type": "translation", "text": "\"Selamat buatmu, yang termulia di antara para nabi;Selamat buatmu, yang paling terpuji, wahai kekasihku; Selamat buatmu, ṭāhā, wahai dokterku (yang mengobatiku); Selamat buatmu, yang termulia di antara para nabi; Selamat buatmu, yang paling terpuji, wahai Muhammad; Selamat buatmu, ṭāhā, wahai yang mulia (agung)\". assalāmu 'alaika zainal anbiyā'i"}, {"type": "arabic", "text": "السﻼم عليك٭   زين اﻻنبياء"}, {"type": "arabic", "text": "السﻼم عليك  ٭   دّ رفت انسح اي"}, {"type": "arabic", "text": "السﻼم عليك  ٭ كهفا ومقصد"}, {"type": "transliteration", "text": "assalāmu 'alaika kahfan wa muqṣad; assalāmu 'alaika yā husnan tufarrad."}, {"type": "translation", "text": "\"Selamat buatmu,yang termulia di antara para nabi; Selamat buatmu, gua (tempat berlindung) dan tidak bercacat; Selamat buatmu, yang kebaikannya tiada tandingan\". assalāmu 'alaika zainal anbiyā'i"}, {"type": "arabic", "text": "السﻼم عليك*   زين اﻻنبياء\nالسﻼم عليك  ٭  يا  ﺟالي الكروب\nالسﻼم عليك  ٭ يا بدر التمام\nالسﻼم عليك  ٭يا كلّ المرام   \nالسﻼم عليك  ٭ يا ما حي الذنوب\nالسﻼم عليك  ٭   يا خير اﻻنام\nالسﻼم عليك  ٭   يا نور الظﻼم"}, {"type": "transliteration", "text": "assalāmu 'alaika yā mā hiyaz- zunūbi; assalāmu 'alaika yā jāliyal kurūbi.\nassalāmu 'alaika yā khairal anām; assalāmu 'alaika yā badrat- tamām.\nassalāmu 'alaika yā nūraẓ- ẓalām; assalāmu 'alaika yā kullal- marām."}, {"type": "translation", "text": "\"Selamat buatmu, yang termulia di antara para nabi; Selamat buatmu, wahai penghapus dosa; Selamat buatmu, wahai yang tinggi kesusahannya; Selamat buatmu, wahai sebaik- baik makhluk; Selamat buatmu, wahai bulan purnama yang sempurna; Selamat buatmu, wahai cahaya kegelapan; Selamat buatmu, wahai semua panah (senapan)2\"."}, {"type": "arabic", "text": "الف صلو على النبي خاتم الرسل الكرام"}, {"type": "transliteration", "text": "alfa ṣallū 'alan- nabiyyi khātimir-rusulil- kirām."}, {"type": "translation", "text": "\"Beribu-ribu salawat buat nabi penutup para rasul yang mulia\"( jābu)."}, {"type": "arabic", "text": "السﻼم عليك٭يا ذا البيّنات \nالسﻼم عليك  ٭يا ذخر العصاة\nالسﻼم عليك  ٭ يا ذا المع جزات\nالسﻼم عليك  ٭يا هادي الهداة"}, {"type": "transliteration", "text": "assalāmu 'alaikayā żal mu'jizāt; assalāmu 'alaika yā żal bayyināt.\nassalāmu 'alaika yā hādiyal hudāt; assalāmu 'alaika yā żukhral 'uṣāt3"}, {"type": "footnote", "text": "2Maraam (panah) adalah senjata yang populer pada masa itu yang digunakan saat perang. Penggunaan kata panah pada sair ini mungkin sebagai kiasan, karena nabi dianggap mampu mengalahkan /melumpuhkan\nmusuh-musuhnya."}, {"type": "footnote", "text": "3Di dalam kamus اةصالﻌjamak dari العاصىartinya yang durhaka, tidak taat. Dalam teks lain tertulis al-usaat jamak dari aasiyyu yang berarti dukun atau tabib (yang merawat, yang menghibur). Dalam kamus Arab ada\nkata al-usaa jamak dari uswah yang bermakna ikutan atau teladan; ada kata al-asaa yang bermakna\nkesedihan, duka; dan ada kata al-‘asyaa yang bermakna menggembalakan di malam hari. Penulis lebih"}, {"type": "translation", "text": "\"Selamat buatmu, wahai yang memiliki mu'jizat-mu'jizat; Selamat buatmu, wahai yang memiliki penerang (penjelasan-penjelasan); Selamat buatmu, wahai pemberi petunjuk; Selamat buatmu, wahai yang memiliki (menyimpan) al-'uṣāt\"."}, {"type": "arabic", "text": "السﻼم عليك٭       زين اﻻنبياء\nالسﻼم عليك  ٭   ياذا الموهبات\nالسﻼم عليك  ٭يا ربّ السماح   \nالسﻼم عليك  ٭   ياحسن الصفات\nالسﻼم عليك  ٭   يا ركن الصﻼح"}, {"type": "transliteration", "text": "assalāmu 'alaika yā hasanaṣ- ṣifāt; assalāmu 'alaika yā zal mauhibāt.\nassalāmu 'alaika yā ruknaṣṣalāh; assalāmu 'alaika yā rabbas- samāh."}, {"type": "translation", "text": "\"Selamat buatmu,yang termulia di antara para nabi.Selamat buatmu, wahai yang memiliki sifat-sifat yang baik; Selamat buatmu, wahai yang memiliki pemberian-pemberian; Selamat buatmu, wahai yang kokoh/kuat kebaikannya; Selamat buatmu, wahai penyayang yang murah hati\"."}, {"type": "arabic", "text": "الف صلو على النبي٭ خاتم الرسل الكرام"}, {"type": "transliteration", "text": "alfa ṣallū 'alan- nabiyyi khātimir- rusulil- kirām (Jābu).”Beribu salawat buat Nabi, penutup"}, {"type": "text", "text": "para Rasul yang mulia”"}, {"type": "arabic", "text": "السﻼم عليك٭ يا زين المﻼح\nالسﻼم عليك  ٭ يا نور الصباح\nالسﻼم عليك  ٭ يا داعى الفﻼح\nالسﻼم عليك  ٭يا حيّ الفﻼح "}, {"type": "transliteration", "text": "assalāmu 'alaikayā zainal milāh; assalāmu 'alaika yā dā'iyal- falāh.\nassalāmu 'alaika yā nūraṣṣabāh; assalāmu 'alaika yā hayyal- falāh."}, {"type": "translation", "text": "\"Selamat buatmu, wahai yang cantik parasnya; Selamat buatmu,wahai yang menyeru kepada kemenangan; Selamat buatmu, wahai cahaya yang terang; Selamat buatmu, wahai yang menyeru kepada kemenangan\". cendrung kepada yang ketiga yakni al-usaa (ikutan, teladan), meskipun tidak terdapat pada semua naskah yang diteliti ini, diduga semua salah tulis."}, {"type": "arabic", "text": "مسلب العقل سوىسهرا ﺟوفن مسلب العقل"}, {"type": "transliteration", "text": "Musallabul ’aqli siwasihira jūfuni musallabul ’aqli.  (Jābu)”Sinar di pelupuk mata tidak"}, {"type": "text", "text": "dapat dijangkau oleh akal”"}, {"type": "arabic", "text": "السﻼم عليك٭ يا عالى المفاخر\nالسﻼم عليك  ٭ يا روضا النضائر\nالسﻼم عليك  ٭ يا ضوء البصائر\nالسﻼم عليك  ٭ يا بحر الذخا ئر"}, {"type": "transliteration", "text": "assalāmu 'alaikayāḍau'al baṣāir; assalāmu 'alaika yā 'ālil- mafākhir.\nassalāmu 'alaika yā bahraz-zakhāir; assalāmu 'alaika yā rauḍan- naḍāir."}, {"type": "translation", "text": "\"Selamat buatmu, wahai cahaya para manusia; Selamat buatmu, wahai yang tinggi megah; Selamat buatmu, wahai bahraz- zakhāir.4Selamat buatmu, wahai yang baik nan rupawan\". ṣallal-lāhu 'alā ىلع ﷲ لص"}, {"type": "arabic", "text": "السﻼم على  ٭المشفّع فى القيامة \nالسﻼم على  ٭  ّوتملاج بالكرامة\nالسﻼم على  ٭المقدّم لﻼمامة \nالسﻼم على  ٭ المظلل فى الغمامة"}, {"type": "transliteration", "text": "assalāmu 'alal- muqaddam lil- imāmah; assalāmu 'alal- musyaffa'i fil- qiyāmah.\nassalāmu 'alal- muẓallali fil- gamāmah; assalāmu 'alal- mutawwaj bil- karāmah."}, {"type": "translation", "text": "\"Selamat buat pendahulu bagi para imam (pemimpin); Selamat buat pemberi syafaat di hari qiamat; Selamat buat pemberi teduh di saat duka cita (kesedihan). 5Selamat buat pemilik mahkota dengan kemuliaan\"."}, {"type": "arabic", "text": "الهى  يا الهىx2 الهىتوبة قبل الممات"}, {"type": "transliteration", "text": "Ilāhī yā ilāhī 2x ilāhī taubatan qablal-mamāt.(Jābu)"}, {"type": "translation", "text": "\"Tuhanku, ya tuhanku 2x, aku bertobat sebelum datang maut\"."}, {"type": "footnote", "text": "4Bahru selain bermakna laut, sungai besar, juga bermakna kuda yang tangkas, kuda yang kuat lari, dan az- zakhaair maknanya benda simpanan, mudah. Dengan demikian nabi Muhammad diibaratkan kuda yang\ntangkas dan mudah bagi penunggangnya, artinya cerdas dan memudahkan bagi orang lain. Kalau bahru\ndiartikan laut, berarti nabi seperti laut yang banyak menyimpan benda-benda atau kekayaan yang melimpah\n(tentu bukan materi)."}, {"type": "footnote", "text": "5Al- gamaamah bermakna hujan, awan, sedih, duka cita."}, {"type": "arabic", "text": "السﻼم على٭المبشّر بالسﻼمة \nالسﻼم على  ٭النبيّ ابي البتول \nالسﻼم على  ٭ الخليفة منك فينا\nالسﻼم على  ٭ الخﻼصة من تهامة\nالسﻼم على  ٭ محمد الرسول\nالسﻼم عليك ٭  واي ﺟه ال جميل"}, {"type": "transliteration", "text": "assalāmu 'alal-khulāṣati min tihāmah; assalāmu 'alal-mubasysyir bis-salāmah;\nassalāmu 'alā muhammadinir-rasul; assalāmu 'alan-nabiyyi abil-batuli;\nassalāmu 'alaika yā wajhal- jamīl; assalāmu 'alal- khalīfati minka wa fīnā;"}, {"type": "translation", "text": "\"Selamat buat yang datang dari Tihāmah.6Selamat buat pemberi kabar gembira dengan kedamaian; Selamat buat Muhammad sebagai Rasul; Selamat buat nabi, ayah batūli 7 (Fatimah). Selamat buatmu, wahai pemilik wajah yang cantik; Selamat buat khalifah yang berasal dari kamu dan kita. radhiyal- llāhu 'alā علىͿرضي"}, {"type": "arabic", "text": "وكذا عمر     ٭وليّ الصالحين \nّىِلَع كاذكو٭السامي يَقِين \nابي بكر       ٭ مبيد الج اهدين\nوذِ النورينِ٭رأسِ الناسِكِين "}, {"type": "text", "text": "wardhu 'anhu ورض عنه"}, {"type": "arabic", "text": "َا َكِباحْصَا ْﺟنيعَم\nوتابعهم وتابع التابعين\nوالسﻼم على الرسول\nومحمد عربي\nالسﻼم على\nمهّلك كلاووالتابعين\nالصﻼة على النبيّ\nالشّفيعِ اﻵبطحيّ"}, {"type": "transliteration", "text": "abībakrin  mubīdil- jāhidīn; wa każā'umar waliyyuṣ- ṣālihīn;\nwa żin-nūraini  ra'sin-nāsikīn; wa każāka 'aliyyu assāmī yaqīn;\nassalāmu 'alā aṣhābika ajma'īn; wa ālika kullihim wat-tābi'īn; wa tābi'ihim wa  tābi'it-\ntābi'īn; aṣṣalātu 'alan- nabiyyi; was-salāmu 'alar-rasūl; asysyafī'il- abṭahiyyi;"}, {"type": "text", "text": "wa muhammad 'arabiyy"}, {"type": "footnote", "text": "6Tihaamah adalah sebuah negeri sebelah utara Mekkah."}, {"type": "footnote", "text": "7Batuul adalah sebutan (panggilan) bagi Fatimah, putri Nabi."}, {"type": "translation", "text": "\"Semoga Allah mereḍai kepada: Abu Bakar, pelopor kaum mujahid; kepada Umar sebagai wali bagi orang-orang saleh dan memiliki dua cahaya, pemimpin bagi para ahli ibadah; juga kepada Ali, yang tinggi keyakinannya. Reḍailah kepadanya; Selamat buat sahabat-sahabatmu semua; para keluargamu, para pengikut, dan pengikut dari para pengikut.Sejahtera buat nabi, dan selamat buat rasul yang memberi syafaat seperti sungai yang luas, dan Muhammad orang Arab\"."}, {"type": "arabic", "text": "مو فّ رشو ّﺟأ  ﷲ لوسر ةباحص ّلك نع ىلاعت ﷲ يضرو همّركو امظعو د ْﺟمعين"}, {"type": "transliteration", "text": "Wa syarrafa wa majjada wa 'aẓman wa karramahu wa radhiyal- lāhu ta'ala 'an kulli\nṣahābati rasulillāhi ajma'īn (Jābu)."}, {"type": "translation", "text": "\"Semoga Allah ta'ala memberikan kemuliaan, keagungan, kehormatan, dan mereḍai kepada para sahabat Rasulullah semuanya\". (Catatan: Sair pertama ini diselingi 5 macam jābu)"}, {"type": "arabic", "text": "بسم ﷲ الرحمن الرحيم\nﱠنإ َف اـ َت ْحَن َل ا َك  َفـ ْت ًح ُم ا ِب ْي ًن ِل * ا َي ْﻐـ ِﻔ َر َل َك  ُﷲ  َم َت اـ َقـ ﱠد َم  ِم ْن  َذ ْن ِب َك  َو َم َت ا َﺄ ﱠخ َر  َو ُي ِت ﱠم  ِن ْعـ َم َت ُه  َع َل ْي َك\nَو َي ْه ِد َي َك  ِص َر ًطا ُم ا ْس َتـ ِقـ ْي ًم َو * ا َي ْن ُص َر َك  ُﷲنَ ْص ًر َع ا ِز ْي ًزا * )سورة الﻔتح : 1 - 3 َل ( َق ْد  َﺟ َءا ُك ْم\nَر ُس ْو ٌل  ِم ْن  َا ْن ُﻔ ِس ُك ْم  َع ِز ْي ٌز  َع َل ْي ِه  َم َع اـ ِن ﱡت ْم  َح ِر ْي ٌص  َع َل ْي ُك ْم  ِب ْلا ُم ِمؤ ِن ْي َن  َر ُء ْو ٌف  َر ِح ْي ٌم  َف * ْنإ  َت َو ﱠل ْو َف اـ ُقـ ْل\nَح ْس ِب َى  ُﷲ  َﻻ  ِا َهل  ّﻻإ   ُه َو   َع َل ْي ِه  َت َو ﱠك ْل ُت  َو ُه َو  َر ﱡب  ْلا َع ْر ِش  ْلا َع ِظ ْي ِم * )سورة التوبة:128-129("}, {"type": "transliteration", "text": "Terjemahan s. Al- Faṭ: 1-3."}, {"type": "text", "text": "1. Sesungguhnya Kami telah memberikan kepadamu kemenangan yang nyata;\n2. Supaya Allah memberi ampunan kepadamu terhadap dosamu yang telah lalu dan yang\nakan datang serta menyempurnakan nikmat-Nya atasmu dan memimpin kamu kepada\njalan yang lurus; 3. Dan supaya Allah menolongmu dengan pertolongan yang kuat\n(banyak).\nTerjemahan s. At-Taubah: 128-129.\n128. Sungguh telah datang kepadamu seorang Rasul dari kaummu sendiri, berat terasa\nolehnya penderitaanmu, sangat menginginkan (keimanan dan keselamatan) bagimu, Amat\nbelas kasihan lagi Penyayang terhadap orang-orang mukmin.\n129. Jika mereka berpaling (dari keimanan), Maka Katakanlah: \"Cukuplah Allah bagiku;\ntidak ada Tuhan selain Dia. hanya kepada-Nya aku bertawakkal dan Dia adalah Tuhan\nyang memiliki 'Arsy yang agung\"."}, {"type": "text", "text": "Catatan: Ayat-ayat Al-Quran di atas juga dikutip dari buku yang sama tanpa menyebut\nnama surah, ayat, dan tanpa terjemah. Terjemahnya peneliti kutip dari Al-Quran dan\nTerjemahnya."}, {"type": "arabic", "text": "الحَبيبُ الكريمُ الحمد Ϳ ربِّ العالمينصدق ﷲ العليّ العظيم وبلغ رسوله النبيﱡ\nإ نّ ﷲَ وملئكته يصلّون على النبي يا ايهاالذين امنوا صلوا عليه وسلموا تسليما\nدمحلاوͿ ربّ العالمين\nاللهم صل وسلم وبارك عليه\n دــمحلاͿ الــذي شــر ﱠف اﻷنــام بصــاحب المقــام اﻷعلــى٭وكَمــ ّلَ الســ ﱡعُو ْدَ بــاِكْر َمِ مَو ْلــ ُودِ  \nًﻼْضَفو ًافَ رَشىوح٭ لاو َءابﻻا هب َفﱠ رشو ُﺟ ِب َدوُد ُــﺟ ًﻻْدَ ــع ِهِدْ و٭دْ ﺟــِ حَمَلَتــ ْهُ اُمــ ﱡهُ امنــة فلــ َمْ تَ  \nًﻼَ ــقِث ﻻﱠ و ًامَلَا ِهِلْمَحِل٭  ﷲ ىلــص ُهْتَعَ ــضَ وَ و ًﻼﱠ ــحَكُم اــتْ وًتْخَم مّلــسو هــيلع   راــقَ ولا ِعَ ــلِ خ ىــف\nِي َةَباهَملاو ِﺟلى ٭و َو ُلِدَ نَبِيﱡنا محمد صلى ﷲ عليه وسلم  ٭  ِوب ِﺟ ىَ ــلْحَا ﻻو هنم ُنَسْحَاىَ رُيام ٍه\n٭ أو ُءَ وْضَا وه لب ِسْمﱠشلاك روُنِب ِﺟلى ٭  ىَ ــلْغَا َو ىلْعَاوــه لــب ًاؤُ ــلؤُلو ا̒رُد َقاــف ِرْ ــﻐثو٭\nىّلَمَتو ِءارسِﻹا َةلْيَل هب َفاطو٭عــل دِينــ َهُ علــى الــدﱠوامِ مُســ ْتَعْلِياً ﻻ مُســ ْتَعْﻼ ﺟِ و  ٭  ُهُ رْ ــكِذَ و\nعلى مَمَرِّ اﻻيﱠامِ يُكَر ﱠرُ ويُتْلَى٭شــ َر ْقاً وغَر ْبــاً و ﱠو َعــ ْراً و ﱠســ َهْﻼً  اَشْر َقَتْ لِمولدهِ الحَنــادِسُ  ٭\nالِسِ خُضــ ُوعًا و ّذُﻻﱠ ﺟــِ لــى المَ وخــ َر ﱠتْ لمولــده اﻻصــ ْنامِ مــن اَعْ٭  َــتْ راَ و َﺞ وهوىَ رْ ــسِك ُناوْ ــيِا\nالِسٌ فَعَدِمَ القَومُ نُطْقاً و ﱠعَقْﻼً ﺟِ٭  مهنم َدﱠدَبَتو َسِ راف ُران ْتَدِمَخو ِﺟ ًﻼْمَشّ و ًاعْم٭  ِتَ ــفِ رْخُ زَ و\nال ِﺟ تو ﱡقحلا َعَلﱠطاَ و هدلوم َةليَل ُنان َﺟ ىﱠل٭هــاتِ اَهــ ْﻼً و َســ َهْﻼً ﺟِ ميــعِ الﺟِ ونادَتِ الكائِناتُ من  \nًﻼْهَسَ و ًﻼْهَا ﱠمث٭اَلْفَ صَلﱡوا على النبي خاتِمِ الر ُسُلِ الكرامِ  *"}, {"type": "transliteration", "text": "Allahumma ṣalli 'alā sayyidina muhammad\nBismillāhir-rahmānir-rahīm\nAlhamdu lil-lāhil-lażī syarrafal-anāma biṣāhibil-maqāmil-a’lā; wa kammalas-su’ūda\nbiakrami maulūdin hawā syarafan wa faḍlan; wa syarrafa bihil-ābāa wal-judūda\nwamalaul-wujūda bijūdihī ’aḍā; hamalathu ummuhū āminatu falam tajid lihamlihī alaman\nwalā ṡiqalā; wa waḍa’tuhu ṣallal-lāhu ’alaihi wa sallama makhtūnan mukahhalan fi\nkhila’il-waqāri wal-mahābati yujlā; wawulida nabiyyunā muhammadun ṣallal-lāhu ’alaihi"}, {"type": "transliteration", "text": "wasallam; biwajhi mā yurā ahsanu minhu walā ahlā; binūrin kasy-syamsi bal huwa a’lā\naḍwau wa ajlā; waṡagrin fāqa durran wa lu’luan bal huwa  a’lā wa aglā; waṭāfa bihī\nlailatal-isrāi watamallā; waja’ala dīnahū ’alad-dawāmi musta’liyan lā musta’lā;\nważikrahū ’alā mamarri-anām yukarraru wayutlā; asyraqat limaulidihil-hanādisu syarqan\nwagarban wawa’ran wasahlā; wakharrat limaulidihil-aṣnāmu min a’lal-majālisi khuḍū’an\nważullā; wartajja īwānu kisrā wahuwa jālisun fa’adimal-qaumu nuṭqan wa’aqlā;\nwakhamidat nāru fārisa watabaddada minhum jam’an wasyamlā; wazukhrifatil-jinānu\nlailata maulidihī wa aṭṭala’al-haqqu watajallā; wanādatil-kāinātu min jamī’il-jihāti ahlan\nwa sahlan; ṡumma ahlan wa sahlan. Alfa ṣallū ’alan-nabiyyi khātimir-rusulil-kirām.\nAllahumma ṣalli 'alā sayyidina muhammad\nBismillāhir-rahmānir-rahīm"}, {"type": "text", "text": "Kumulai dengan nama Allah jua memulai membaca kitab ini yang amat murah di\ndalam negri dunia lagi yang amat mengasihani akan hambanya yang mukmin di dalam\nnegeri akhirat. Segala puji bagi Allah yang telah memulyakan hambanya Muhammad,\nkarna dialah tuhan yang mempunyai maqam yang maha tinggi. Dan disempurnakan Allah\nkebahagiaan dengan kemulyaan sebab memulyakan kelahiran nabi Muhammad saw\ndengan semulya mulya kelebihannya. Dan dipermulya oleh Allah ta'ala dengan dia ibu\nbapaknya dan nenek moyangnya, dan dipenuhi oleh Allah ta'ala seisi dunia, sebab\nmurahnya dan adilnya.\nSelama mengandung nabi Muhammad, ibunya Siti Aminah, maka tiada merasa\nsakit dan berat karna mengandung nabiyullah saw itu. Dan telah dilahirkan oleh Siti\nAminah nabiyullah itu sudah lagi bercila (berkedip/berkelip) kedua matanya, dan dengan\nperhiasannya yang maha mulya, hebat lagi gilang gemilang cahayanya. Dan dilahirkan\nnabi kita Muhammad saw dengan rupa yang tiada pernah dilihat orang, tiada seorangpun\nyang terlebih baik dari padanya, dan tiada yang terlebih manis dari padanya. Dan gigi\nRasulullah saw itu terlebih bercahaya dari pada mutiara yang besar2, tetapi nabiyullah itu\nterlebih tinggi dan terlebih mahal dari pada mutiara. Dan dikelilingi oleh malaikat akan dia\npada malam isra' dan mi'raj dengan melalui segala tempat yang gelap gulita. (Di dalam teks\nArab tidak ada kata mi'raj, mungkin penulis menambahkannya karena ada kata isra')Dan\ntelah dijadikanlah agama nabiyullah saw itu yakni agama Islam senantiasa tinggi di atas\nsegala yang mengatasi tingginya, tidak ada agama lain, ingatlah akan dia pada tiap2 hari\ndiulang2 dan dibaca.\nDan telah terang benderanglah tempat dari timur sampai ke barat segala isinya\nmengucapkan selamat datang. Dan pecahlah segala berhala karna dilahirkan nabiyullah\ndari pada segala tempat yang tinggi dengan merendahkan dirinya dan menghinakan\ndirinya. Dan runtuhlah segala istana raja Kisra, pada ketika itu dia duduk di atas istananya,\ndan tiada lagi bagi kaum itu kata-katanya sebab telah hilang aqalnya. Dan padamlah api di\nnegri Paris (Persia sekarang) yang disembah oleh orang2 kafir, dan cerai berailah dari pada\nperhimpunan mereka itu dan sekedudukan mereka itu. Dan diperhiaslah segala sorga pada\nmalam kelahiran nabiyullah saw itu dan menilik hak atau kebenaran Allah ta'ala dan tajalli"}, {"type": "text", "text": "(mengagungkan) kepadanya. Dan berseru2lah segala yang dijadikan oleh Allah ta'ala dan\ndari pada segala pihak katanya ahlan wa sahlan  kemudian maka diulang2 pula ahlan wa\nsahlan: artinya selamat datang.\nCatatan:Terjemahan di atas adalah terjemahan hikayat/kisah tentang kelahiran nabi\nMuhammad yang dibuat sendiri oleh penulis atau penyalin naskah ini. Hal ini dapat dilihat\npada naskah-naskah lain yang memiliki terjemahan yang agak berbeda redaksi atau\npemakaian kata-katanya."}, {"type": "arabic", "text": "إبراهيم الخليل ﷲ ٭ موسى كﻼم ﷲ  ٭ عيسى وروح ﷲ٭محمد رسول ﷲ  "}, {"type": "transliteration", "text": "Ibrahim al-khalīlul-lāh; mūsā kalāmul-lāh;'īsā warūhul-lāh; muhammad rasūlul-\nlāh.(Jābu)."}, {"type": "translation", "text": "\"Ibrahim adalah kekasih Allah, Musa kalam Allah, Isa Ruh Allah dan Muhammad adalah Rasulullah\""}], "raw_line_count": 296}, {"id": 2, "name": "Sair Kedua", "blocks": [{"type": "text", "text": "b. Sair kedua:"}, {"type": "arabic", "text": "ب*ىلﺟي ىمِ حلا كاذب ًاردب اذّبح ايف * ىلعﻻا هرون ادب دق عيبر رهش\n*واهل السماء قالوا له مرحبا اهﻼ * ابِ رْﻐَمو ًاقرش ناوكﻻا هب تر انا"}, {"type": "transliteration", "text": "Bi syahri rabī'i qad badā nūruhul- a'lā *fayā habbażā badran, biżākal- himā yujlā *anārat\nbihil- akwānu syarqan wa magriban * wa ahlus-samāi qālū lahū marhaban ahlan"}, {"type": "translation", "text": "\"Pada bulan Rabi' (yang dimaksud rabi'ul awal) telah muncul cahayanya yang maha tinggi; bulan purnama berjalan lambat dan melindunginya dengan amat baik; alam di timur dan barat menjadi terang; dan penduduk (isi) langit berkata kepadanya: Selamat Datang!\""}, {"type": "arabic", "text": "ﷲ لوسر دمحمهللا ﻻا هلا ﻻ * ﷲ ﻻا هلا ﻻ * ﷲ ﻻا هلا ﻻ"}, {"type": "transliteration", "text": "Lā ilāha illal-lāh; lā ilāha illal-lāh; lā ilāha illal-lāh muhammadur-rasūlul-lāh.  Tiada"}, {"type": "text", "text": "Tuhan selain Allah; Tiada Tuhan selain Allah; Tiada Tuhan selain Allah; Muhammad"}, {"type": "transliteration", "text": "adalah Rasulullah. (Jābu)"}, {"type": "arabic", "text": " عزّ ورفعة*واُلبِسَ ثواب النور  \nولما راه البدر* حار لحسنه\nفما مثله فى خلعة * الحسن يستﺟﻼ\nوشاهد منه بهﺟة* تسلب العقﻼ"}, {"type": "transliteration", "text": "Wa ulbisa ṡawāban- nūri;  'izzan wa rif'atan; famā miṡluhū fī khil'ati;  al-husni yustajallā;\nwa lammā ra'āhul-badra;  hāra lihusnihi; wa syāhada minhu buhjatan;   taslibul-'aqlā."}, {"type": "translation", "text": "\"Dia memakai pakaian cahaya yang mulia dan tinggi; tidak ada yang menyamai kebaikan dan keagungannya dalam hal pakaian; bulan purnama tercengang ketika melihat kebaikannya, dan dia mengakui keelokannya yang sulit dijangkau oleh akal\"."}, {"type": "arabic", "text": "الف صلو على خير العبادx2احمد محمد المصطﻔى شﻔيعنا"}, {"type": "transliteration", "text": "Alfa ṣallū 'alā khairil-'ibād 2x; ahmad muhammad al-muṣṭafā syafī'unā.  (Jābu)."}, {"type": "translation", "text": "\"Beribu- ribu salawat buat sebaik-baik hamba 2x; yang terpuji yakni Muhammad al-muṣtafa pemberi syafa'at kepada kita."}, {"type": "arabic", "text": "وأطﻔئ نور الشمس* من نور وﺟهه\nانقوش ت دّدﺟ *ايا مولد المختار \nما اﺟلىͿ ما ابهى *وᆕ\nﺟ * ثوعبم ريخ ىلاليل حوى الﻔضﻼ"}, {"type": "transliteration", "text": "Wa uṭfi'a nūrusy-syamsi; min nūri wajhihi; falillāhi mā abhā; walillāhi mā ajlā;\nayā maulidal-mukhtāri;jaddadta syauqanā; ilā khairi mab'ūṡi; jalīlin hawal-faḍlā;"}, {"type": "translation", "text": "\"Dan cahaya matahari redup karena cahaya wajahnya;Maka demi Allah: Alangkah eloknya! dan demi Allah: Alangkah agungnya! Kelahiran orang yang terpilih, kerinduan kami begitu besar kepada utusan yang terbaik, dan memiliki keutamaan yang maha tinggi\"."}, {"type": "arabic", "text": "صلى ﷲ على المدنى محمد شﻔيعناx2ما غرت على الﻔضل , قمري على اﻻكسر"}, {"type": "transliteration", "text": "ṣallal-lāhu 'alal-madani muhammad syafī'unā 2x mā garrat 'alal-faḍli, qumriy 'alal-\niksar(Jābu). Semoga Allah mencurahkan salawat kepadagudang ilmu; Muhammad yang"}, {"type": "text", "text": "memberikan syafa’at kepada kami, memberikan keutamaan baik kepada hamba laki-laki\nmaupun perempuan, seperti bulan purnama di atas logam mulia )."}, {"type": "arabic", "text": "وسعدا مقيما * بافتخار لمولد*  له خير عن حسنه * ابدا يتلى\nعليه صﻼة ﷲ* ما هبت الصيا*   وما سارحاد *  بالنياق الى المعلى"}, {"type": "transliteration", "text": "Wasa'adan muqīmā; biftihāri limaulidi;lahū khairū 'an husnihī;  abadan yutlā;"}, {"type": "translation", "text": "'alaihi ṣalātul-lāhi; mā habbatiṣ-ṣayā; wa mā sāra hādin * bin-niyāqi ilal-ma'lā. \"Berbahagia maqam (tempat) dengan kelahiran orang yang agung; Memiliki kebaikan yang lebih baik yang diikuti dengan selama-lamanya; Semoga Allah mencurahkan salawat kepadanya sejak masih bayi; dan kepada orang yang pergi untuk berlindung dari tempat yang tinggi ke tempat yang lebih tinggi\". (Sair kedua ini diselingi empat macam jābu)."}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\n ارً يْ  ذِ نَ وَ  ارً شِّ بَ مُ وَ  ادً هِ اشَ  نكَ لْ سَ رْ ا اَ إنﱠ ىﱡ بِ ا النﱠ هَ يﱡ ﺄَ قوله تعالى يَ* )سورة اﻻحزاب:45(   ادهاش يا\nللرسل بالتبليغ ومبشرا لمن امن بالﺟنة ونذ يرا لمن كذب بالنار وداعيا الى ﷲ اي الى\nِجارّسلاك هب ىدتهي هنﻻ ًاﺟارس ﷲ هاّمس * ارينم اﺟارسو هرماب يا هن ذاب هتعاطو هديحوت\n امره ﷲ تعالى ان يستضاء به فى الظلمة وبشّر المؤ* ًاريبك ًﻼضف ﷲ نم مهل ناب نينم\n فى قوله*يبشّر المؤمنين بالﻔضل الكبير من ﷲ عزّ وﺟلّ وقد بيّن ﷲً تعالى الﻔضﻼ َلكبير َ\nكَ الِ ذَ  مْ هِ بِّ رَ  دَ نْ ـعِ  نَ وْ اءُ شَ ا يَ مَ  مْ هُ لَ  اتِ نﱠ ﺟَ الْ  اتِ ضَ وْ ى رَ فِ  حتِ لِ وا الصّ لُ مِ عَ ا وَ وْ نُ مَ اَ  نَ يْ ذِ الﱠ تعالى وَ\nُه َو  ْلا َﻔ ْض ُل  ْلا َك ِر ْي ُم *)سورة الشورى: 22(  َو ىلاعت هلوق َﻻ ُت ِط ِع  ْلا َك ِفا ِر ْي َن )اﻻحزاب:48 (\nاي من اهل مكة والمنافقين اي من اهل المدينة ودع اذاهم . قال ابن عباس و ّقتادة معناه\n* وقال الز ّﺟّاجُ اي ﻻتﺟازهم عليه وهذا منسوخ باية القتال *اصبر على اذاهم يا محمد \nوكيﻼ )سورة النساء: Ϳاب ىﻔكو هلوقب هسناو هيلع لكوتلاب هرما ﷲ ىلع لّكوتو81 (\nومعنى وكيﻼ اي حافظا"}, {"type": "transliteration", "text": "Qauluhū ta'āla:"}, {"type": "translation", "text": "\"yā ayyuhan-nabiyyu innā arsalnāka syāhidan wa mubasysyiran wa nazīrā\" (surat al-faṭ:8) * ay syāhidan lir-rusuli bit-tablīgi wa mubasysyiran liman āmana bil-jannati wa nażīran liman każżaba bin-nāri wa dā'iyan ilal-lāhi ay ilā tauhīdihī wa ṭā'atihi bi'iżnihi ay biamrihī wa sirājan munīra * sammāhul-lāhu sirājan li annahū yuhtadā bihi kas-sirāji yustaḍā'u bihī fiẓ-ẓulmati wa basysyiril-mukminīna bi anna lahum minal-lāhi faḍlan kabīra * amarahul-lāhu ta'āla an yubasysyiral-mukminīna bil-faḍlil- kabīri minal-lāhi 'azza wa jalla wa qad bayyanal-lāhu ta'ālal-faḍlal-kabīra * fī qaulihī ta'āla: wal-lażīna āmanū wa 'amiluṣ-ṣālihāti fī rauḍātil-jannāti lahum māyasyā'ūna 'inda rabbihim żālika huwal-faḍlul-kabīr (surat asy-Syura :22) qauluhū ta'āla\"wa lā tuṭi'il- kāfirīna\" (al-ahzab:48), ay min ahli makkata wal munāfiqīna ay min ahlil-madīnati wada' ażāhum. Qāla ibnu 'abbāsi waqatādatun ma'nāhu; iṣbir 'alā ażāhum yā muhammad * wa qāla az-zajjāju ay lā tujāzihim 'alaihi wa hāżā mansūkhun biāyatil-qitāl * wa tawakkal 'alal-lāhi amarahū bit-tawakkal 'alaihi wa ānasahu biqaulihī\"wa kafā bil-lāhi wakīla\" (surat an-Nisā':81) wa ma'nā wakīla ay hāfiẓan. (Dikutip dari sumber yang sama, tanpa keterangan nama surat dan nomor ayat)."}, {"type": "arabic", "text": "اللهم صلوسلم وبارك عليه\nقلخي نا لبقىلاعت ﷲ يدي نيب ًارون ُتْنك : لاق هنا ملسو هيلع ﷲ ىلص يبنلا نع يور\nادم بالﻔي عام * يسبح ﷲ تعالى ذلك النور وتسبح الملئكة بتسبيحه * فلما خلق ﷲ تعالى\nادم القى ذلك النور فى طينته * فاهبطني ﷲ فى صلب ادم الى الﻼرض * وحملنى فى\nالسﻔينة فى صلب نوح * وﺟعلنى فى صلب ابراهيم الخليل * حين قذف به الى النار *\nولم يزل ينقلنى من اﻻصﻼب الطاهرة * الى اﻻرحام الزكية الﻔاخرة * حتى اخرﺟني ﷲ\n* ولم يلتقيا على سﻔاح قطّ *من بين ابويّ "}, {"type": "transliteration", "text": "Ruwiya 'anin-nabiyyi ṣallal-lāhu 'alaihi wa sallama annahū qāla: kuntu nūran baina\nyadail-lāhi ta'āla qabla an yakhluqa ādama bi alfay 'ām * yusabbhul-lāhu ta'āla żālikan-\nnūru wa tusabbihul-malā'ikatu bi tasbīhihi * falammā khalaqal-lāhu ta'āla ādama\nalqāżālikan-nūra fīṭīnatihi * fa ahbaṭaniyal-lāhu fīṣulbi ādama ilal-arḍi * wa hamalanī fis-\nsafīnati fīṣulbi nūh * wa ja'alanī fīṣulbi ibrāhīmal- khalīl * hīna quzifa bihi ilan-nār * wa\nyazal yanqulunī minal-aṣlābiṭ-ṭāhirah * ilal-arhāmiz-zakiyyatil-fākhirah * hattā\nakhrajaniyal-lāhu min baini abawayya * walam yaltaqiyā 'alā sifāhin qaṭṭu *\nAllahumma ṣalli wa sallim 'ala sayyidi Muhammad.\nFirman Allah ta'ala : yā ayyuhan-nabiyyu innā arsalnāka syāhidan wamubasysyiran wa\nnazīra (al-ahzab:45). Artinya: bahwasanya kami mengutus engkau akan naik saksi dan"}, {"type": "text", "text": "menceritrakan syorga dan neraka. Artinya: naik saksi bagi segala Rasulullah.Dengan\nmenyampaikan firman Allah ta'ala dan menceritrakan bagi barangsiapa yang beriman akan\ndianugrahi syorga. Dan mempertakutkan bagi barangsiapa yang mendustakan, dia akan\nditono (ditanak/dimasak) dengan api neraka. Dan menyeru kepada agama Allah. Artinya:\nmentauhidkan Allah dan mentaati perintahnya dengan izinnya atau mengerjakan\nperintahnya dan menjadi pelita yang menerangi.\nDinamai oleh Allah nabi Muhammad itu sebagai pelita, karma bahwasanya dia\nmemberikan petunjuk seperti pelita yang menerangi dalam gelap gulita, dan memberi\nkabar gembira kepada orang2 yang beriman. Bahwasanya untuk mereka itu dari pada Allah\nkarunia yang amat besar. Dia diperintahkan oleh Allah ta'ala untuk memberi kabar gembira\nkepada orang2 yang beriman dengan karunia yang besar dari pada Allah yang maha mulia\ndan maha tinggi. Dan bahwasanya telah dinyatakan oleh Allah ta'ala karunia yang besar."}, {"type": "transliteration", "text": "Tersebut dalam firman Allah ta'ala: wallazīna āmanū wa'amiluṣ-ṣalihāti fi rauḍātil-jannati\nlahum mā yasyā'ūna 'inda rabbihim zālika huwal-faḍlul- kabīr.  Artinya: dan orang2 yang"}, {"type": "text", "text": "beriman serta mengerjakan yang amal2 yang baik, mereka itu dalam kebun syorga untuk\nmereka memperoleh apa2 yang mereka kehendaki disisi Tuhannya. Dan yang demikian itu"}, {"type": "transliteration", "text": "adalah karunia yang amat besar. Dan lagi firman Allah ta'ala: walā tuṭi'il-kāfirīna ay min\nahli makkatawal-munāfiqīna ay min ahlil- madīnati wada' azāhum : artinya: dan jangan"}, {"type": "text", "text": "engkau ikut ya Muhammad akan segala kafir dari pada segala isi Makkah dan segala\nmunafiq dari pada isi Madinah, dan tinggalkan olehmu barang yang disakiti oleh mereka\nitu."}, {"type": "transliteration", "text": "Qāla ibnu Abbas wa qatādatu ma'nāhu iṣbir 'ala azāhum ya Muhammad . Berkata"}, {"type": "text", "text": "ibnu Abbas dan Qatadah; artinya: sabarlah olehmu, barang yang disakiti oleh mereka itu ya"}, {"type": "transliteration", "text": "Muhammad. Dan dengan berkata Az-zajjāju; artinya: janganlah engkau balas akan mereka"}, {"type": "text", "text": "itu atas perbuatan mereka itu, dan ayat ini sudah dimansukh (dihapus) dengan ayat tentang"}, {"type": "transliteration", "text": "qitāl (peperangan). Dan serahkanlah dirimu ya Muhammad kepada Allah ta'ala, karma"}, {"type": "text", "text": "Allah telah memerintahkan hambanya untuk menyerahkan diri kepadanya, dan dibuju2"}, {"type": "transliteration", "text": "oleh Allah ta'ala akan dia dengan firmannya: wakafā bil-lāhi wakīla , wa ma'nā wakīla\nayhāfiẓan. Dan cukuplah sebagai wakil atau tempat menyerahkan diri, dan makna dari\npada kata wakīla artinya: memeliharakan yakni Allah yang memeliharakan hambanya.\nAllahumma ṣalli wa sallim 'ala sayyidi Muhammad."}, {"type": "text", "text": "Dan diceritrakan orang dari pada Nabi saw; bahwasanya Nabiyullah itu bersabda:"}, {"type": "transliteration", "text": "adalah aku suatu cahaya antara haḍaratul-lāh ta'ala sebelum dijadikan oleh Allah ta'ala"}, {"type": "text", "text": "Nabiyullah Adamdua ribu tahun lamanya. Mengucapkan tasbih kepada Allah ta'ala cahaya\nitu dan bertasbih pula para malaikat dengan mengikuti tasbih cahaya itu. Maka tatkala\ndijadikan oleh Allah ta'ala Nabiyullah Adam, maka dihantarkan cahaya itu pada lembaga\nNabiyullah Adam yang berasal dari pada tanah. Sesudah itu maka diturunkan aku oleh\nAllah ta'ala ke dalam sulbi Nabiyullah Adam ke pada bumi. Dan selanjutnya ditinggalkan\ndaku dalam bahtera pada sulbi Nabiyullah Nuh. Dan dijadikan daku pada sulbi Nabiyullah"}, {"type": "transliteration", "text": "Ibrahim al-khalīlul-lāh, pada ketika itu dibuangkan oleh orang kafir akan Nabiyullah\nIbrahim al-khalīlul-lāh ke dalam api. Dan senantiasa dipindahkan aku dari pada sulbi yang"}, {"type": "text", "text": "suci sampai kepada rahim2 yang bersih lagi samadi. Sehingga dikeluarkan aku oleh Allah\nta'ala dari antara ibu bapakku dan tiada bertemu keduanya atas perbuatan jahat sekali-kali.\n(Terjemahan dua bagian di atas baik ayat-ayat Al-Quran dan penjelasannya serta Hadiṡ\nyang berkaitan dengan kelahiran Nabi Muhammad saw, adalah terjemahan penulis naskah\nitu sendiri)."}, {"type": "arabic", "text": "صلى عليه ربنا ونحن صلو بنا محمد نبينا فى المخشار شفيعنا"}, {"type": "transliteration", "text": "ṣallā 'alaihi rabbunā wa nahnu ṣallūbinā, muhammad nabiyyunā fil makhsyāri syafī'unā .\n(Jābu)."}, {"type": "translation", "text": "\"Semoga Tuhan kami mencurahkan salawat kepadanya, dan kami bersalawat kepadanya, Muhammad Nabi kami, pemberi syafa'at kepada kami di padang Makhsyar\"."}], "raw_line_count": 148}, {"id": 3, "name": "Sair Ketiga", "blocks": [{"type": "text", "text": "c. Sair ketiga:"}, {"type": "arabic", "text": "تنقلت فى اصﻼبارباب سودد *  كذا الشمس فى ابراﺟها تتنقل\nوسرت سريا فى بطون تشرفت *بحمل عليه فى اﻻمور المعول"}, {"type": "transliteration", "text": "Tanaqqalta fī aṣlābi arbābi sūdad;  kazasy-syamsu fī abrājihā tatanaqqalu\nWa sirta sariyyan fī buṭūni tasyarrafat;  bihamli 'alaihi fil-umūril-mu'awwal."}, {"type": "translation", "text": "\"Engkau dipindahkan di dalam sulbi-sulbi orang-orang mulia; seperti matahari berpindah di dalam gugusannya; engkau berjalan di dalam rahim-rahim yang mulia dengan membawa hal-hal yang dapat dipercaya\"."}, {"type": "arabic", "text": "ﷲ ﷲ ﷲ * ﷲ ربنا حي مولى ﷲ ﷲ ﷲ * ﷲ حسبنا حي منهي"}, {"type": "transliteration", "text": "Allah Allah Allah * Allah rabbunā hay maulā Allah Allah Allah * Allah hasbuna hay\nmanhay. (Jābu)"}, {"type": "translation", "text": "\"Allah Allah Allah; Allah Tuhan kami, penghulu; Allah Allah Allah * Allah yang mencukupkan kami."}, {"type": "arabic", "text": "هنيئا لقوم انت فيهم ومنهم *بدا منك بدر بالجمال مسربل\nو وقت ﺟئت فيه وطالع *سعيد على اهل الوﺟود ومقبل Ϳ"}, {"type": "transliteration", "text": "Hanī'an li qaumi anta fīhim wa minhum * badā minka badrun bil-jamāl musarbal;\nWa lillāhi waqtu ji'ta fīhi wa ṭāli'un* sa'īdun 'alā ahlil-wujūdi wa muqbil"}, {"type": "translation", "text": "\"Engkau menyenangkan bagi kaum yang ada di dalam mereka dan diantara mereka; Bulan purnama muncul darimu dengan keindahan yang dipakainya; waktu kedatanganmu karena Allah, dan muncul kebahagiaan bagi semua yang ada dan yang menyambutmu\". (Sair ketiga ini hanya diselingi/disisipi oleh dua jābu)"}, {"type": "arabic", "text": "اللهم صلوسلم وبارك عليه\nوعن يزيد بن عبد ﷲ بن وهب عن عمته قالت كنا نسمع ان امنة لما حملت برسول ﷲ صلى ﷲ عليه وسلم * كانت\n كما تجد النساء اﻻّ انى انكرت رفع حيضتى واتانى ات وانا*تقول ما شعرت انى حملت وﻻ وﺟدت له ثقﻼ وﻻ الما \nبين النوم واليقظة * فقال انك قد حملت بسيّد هذه اﻻمة ونبيها  له ىل لاقف * ىرداﻻ لوقا ىنأكف تلمح كنا ِترعش\nىتﻻا كلذ ىناتا ىتدﻻو تند املف * وذلك اليوم اﻻثنين قالت فكان ذلك ممّا تيقن عندى الحمل *نبي الهدى والرحمة \n* فقال لى قولى )اعيذه بالواحد الصمد من شر كل ذى حسد ( قالت فكنت اقول ذلك * ًارارم هرركاو"}, {"type": "transliteration", "text": "Wa 'an yazīd ibni 'abdil-llah ibni wahhāb 'an 'ammatihi qālat; kunnā nasma'uanna\nāminata lamā hamalat bi rasulil-lāhi ṣalla-lāhu alaih wa sallam. Kānat taqūlu mā\nsya'urtu annī hamaltu walā wajidtu lahu ṡiqalan walā alaman. Kamā tajudun-nisā'u illā\nannī ankartu raf'a haiḍatī wa atānīātin wa ana bainan-naumi wal-yaqẓati. Faqāla lī\nsya'urti annaka hamalti fakānnī aqūlu lā adrī. Faqāla innaka qad hamalti bisayyidi\nhażihil-ummati wa nabiyyiha nabiyyil-huda war-rahmati wa żalika yaumul-iṡnaini, qālat\nfakāna żalika mimmā tuyuqqina 'indīl-hamlu. Falammā danat wilādatī atānīżalikal-ātī."}, {"type": "transliteration", "text": "Faqāla lī qūlī (u’īżuhū bil-wāhidiṣ-ṣamadi min syarri kulli żī hasad), qālat fakuntu aqūlu\nżalika wa ukarriruhū mirāra"}, {"type": "arabic", "text": "اللهم صل وسلم وبارك هيلع\nقيل لما اراد ﷲ عز وﺟل ظهور خير خلقه محمد صلى ﷲ عليه وسلم * امر ﺟبريل ان يقبض طينته من مكان قبره\nالكريم * فقبضها ثم طاف بها ﺟنات النعيم * وغمسها فى انهار التسنيم * واقبل بها بين يدي ﷲ العلى العظيم * ولها\nعرق يسيل فخلق ﷲ من ذلك العرق نور كل   * فجميع اﻻنبياء خلقوا من نور محمد صلى ﷲ عليه وسلم * ليلﺟ يبن\n فوقعت هنالك طوائف المﻼ ئكة* والقي فيها النور الذى سبق فخره وتقادم *ثم اودعت تلك الطينة فى ظهر ادم \nمقربين سجودا ﻻدم * ثم اخذ ﷲ تعالى على ادم المواثيق والعهود * حين امر الملئكة له بالسجود * ان ﻻيودع ذلك\nىلا * فما زال ذلك النور ينتقل من ظهور اﻻخيار * المطهرين من الدنس والجحود *النور اﻻّ فى اهل الكرم والجود \n* مشاه نب بلطملا دبع نب ﷲ دبع ىلا مراكملاو فرشلا دي هتلصوا ىتح * رارحﻻا نوطب"}, {"type": "transliteration", "text": "Qīla lammā arādal-lāhu 'azza wa jalla ẓuhūra khairi khalqihī Muhammad ṣallal-lāhu"}, {"type": "translation", "text": "'alaihi wa sallam. Amara jibrīla an yaqbiḍa ṭīnatahu min makān qabrihil-karīm. Faqabaḍahāṡumma ṭāfa bihā jannātin-na'īm. Wagasamahā fī anhārit-tasnīm. Wa aqbala bihā baina yadayil-lāhil-'aliyyil-'aẓīm. Wa lahā 'araqun yasīlu fakhalaqal-lāhu min żalikal-'araqi nūra kulli nabiyyin jalīl. Fajamī'ul-anbiyā'i khuliqū min nūri muhammadi ṣallal-lāhu 'alaihi wa sallam. ṡumma ūdi'at tilkaṭ-ṭīnatu fīẓahri ādama. Wa ulqiya fīhan- nūrul-lażī sabaqa fakhruhū wa taqādama. Fawaqa'at hunālika ṭawāiful-malāikatil- muqarrabīna sujūda li ādama. ṡumma akhażal-lāhu ta'ala 'alāādamal-mawāṡīqa wal- 'uhūda. Hīna amaral-malāikata lahū bis-sujūd. An lā yūdi'a żalikan-nūri illā fi ahlil- kirami wal-jūd. Al-muṭahharīna minad-danasi wal-juhūdi. Famā zāla żālikan-nuru yantaqilu min ẓuhūril-akhyār. Ilā buṭūnil-ahrār. Hattā auṣalaṭu yadusy-syarafi wal- makārimi ilā 'abidil-lāhi bni 'abdil-muṭṭalib bni hāsyim"}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nفلما ان اوان وفاء عهده طلع فى اﻻكوان طالع سعده نشر علم الفتوة * لظهور خاتم النبوة  * شخصت لعبد ﷲ\nاﻻبصار * واشرقت عليه اﻻنوار * البس ثوب المﻼحة نطق بالبيان والفصاحة * ناداه لسان المشيئة يا عبد ﷲ ما\n سيدة نساء بنى النجار* المطهرة من الد نس واﻻكدار * اﻻّ احشاء امنة المنيعة *يصلح كنزا لما حملت من الوديعة \n* اﺟتمع شمله بشملها اتصل حبله بحبلها * ظهر صفاء يقينها * انطوت اﻻحشاء على ﺟنينها سطع نور النبي صلى\nﷲ عليه وسلم فى ﺟبينها * اول شهر من شهور حملها اتاها فى المنام ادم * واعلمها انها حملت باﺟل العالم * الشهر\nالثاني اتاها فى المنام ادريس * واخبرها بفخر محمد وقدره النفيس * الشهر الثالث اتاها فى المنام نوح * وقال لها\nانك قد حملت بصاحب النصر والفتوح * الشهر الرابع اتاها فى المنام ابراهيم الخليل * وذكر لها فضل محمد ومحله\nالجليل * الشهر الخامس اتاها فى المنام اسماعيل * وبشرها ان ابنها صاحب المهابة والتبجيل * الشهر السادس اتاها\nفى المنام موسى الكليم * واعلمها برتبة محمد وﺟاهه العظيم * الشهر السابع اتاها فى المنام داود * واعلمها انها\nحملت بصاحب المقام المحمود * والحوض المورود * واللواء المعقود * والكرم والجود * واخبرها ان ابنها صاحب\nالمقام  المحمود * الشهر الثامن اتاها فى المنام سليمان * واخبرها انها حملت بنبي اخر الزمان * الشهر التاسع اتاها"}, {"type": "arabic", "text": "فى المنام عيسى المسيح * وقال لها انك قد خصصت بمظهر الدين الصحيح * واللسان الفصيح * وكل واحد منهم\nيقول لها فى نومها ياامنة * اذا وضعت شمس الفﻼح والهدى * فسميه محمدا"}, {"type": "transliteration", "text": "Falammāāna awānu wafāi 'ahdihīṭala'a fil-akwāni ṭāli'u sa'dihī nusyira 'alamul-futuwwah.\nLiẓuhūri khātamin-nubuwwah. Syakhaṣat li 'abdil-lāhil-abṣār. Wa asyraqat 'alaihil-anwār.\nUlbiṡa ṡaubal-malāhati naṭaqa bil-bayāni wal-faṣāhah. Nādahu lisānul-masyī'ati yā"}, {"type": "translation", "text": "'abdal-lāhi mā yaṣluhu kamzan lima hamalta minal-wadī'ah. Illā ahsyā'u āminatal- manī'ah. Almuṭahharati minad-danasi wal-akdār. Sayyidati nisā'in banin-najjār. Ijtama'a syamluhū bi syamlihā ittaṣala habluhu bi hablihā. ẓahara ṣafā'u yaqīnihā. Inṭawatil- ahsyā'u 'alā janīnihā saṭa'a nūrun-nabiyyi ṣallahu 'alaihi wa sallama fi jabīniha. Awwalu syahri min syuhūri hamlihā atāhā fil-manāmi ādam. Wa a'lamahā annahā hamalat bi ajallil-'ālam. Asy-syahruṡ-ṡāni atāhā fil-manāmi idrīs. Wa akhbarahā bi fakhri muhammadin wa qadrihīn-nafīs. Asy-syahruṡ-ṡāliṡu atāhā fil-manāmi nūh. Wa qāla lahā annaki qad hamalti bi ṣāhibin-naṣri wal-futūh. Asy-syahrur-rābi'u atāhā fil-manāmi ibrāhīmul-khalīil. Wa żakara lahā faḍla muhammadin wa mahallahul-jalīl. Asy-syahrul- khāmis atāhā fil-manāmi ismā'īl. Wa basysyarahā annab-nahāṣāhibul-mahābati wat-tabjīl. Asy-syahrus-sādisu atāhā fil-manāmi mūsāl-kalīm. Wa a'lamahā bi rutbati muhammadin wajāhihil-'aẓīm. Asy-syahrus-sābi'u atāhā fil-manāmi dāwud. Wa a'lamahā annahā hamalat bi ṣāhibil-maqāmil-mahmūd. Wal-hauḍil-maurūd. Wal-liwā'il-ma'qūd. Wal- karami wal-jūd. Wa akhbarahā annab-nahāṣāhibul-maqāmil-mahmūd. Asy-syahruṡ-ṡamin atāhā fil-manāmi sulaimān. Wa akhbarahā annahā hamalat bi nabiyyi ākhiriz-zamān. Asy- syahrut-tāsi'u atāhā fil-manāmi 'īsal-masīh. Wa qāla lahā innaki qad khuṣṣiṣti bi muẓhirid- dīniṣ-ṣahīh. Wal-lisānil-faṣīh. Wa kullu wāhidin minhum yaqūlu lahā fī naumihā yāāminah. Iżā waḍa'ti syamsal-falāhi wal-hudā. Fa sammīhi muhammadan."}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nب * ولم يعلم بها احد من الناس * فاذا فلما اشتدّ بها طلق النفاس * الى من يعلم سرها ونجواها * اهاوكش ّفكا تطس\nاهنع بهذف * قد اضاء من ﺟمالهنّ المكان *هي باسية امراة فرعون ومريم ابنت عمران وﺟماعة من الحور الحسان \nما تجد من اﻻحزان *"}, {"type": "transliteration", "text": "Falammasy-tadda bihāṭalqun-nifās. Wa lam ya'lam bihā ahadun minan-nās. Basaṭat\nakuffa syakwāhā. Ilā man ya'lamu sirrahā wa najwāhā. Fa iżā hiya bi āsiyatam-ra'ata\nfir'auna wa maryama-bnati 'imrāna wa jamā'atin minal-hūril-hisān. Qad aḍā'a min\njamālihinnal-makān. Fa żahaba 'anhā mā tajidu minal-ahzān.\nAllahumma ṣalli wa sallim 'ala sayyidi Muhammad."}, {"type": "text", "text": "Maka diceritrakan orang dari pada Yazid bin Abdullah cucu Wahab, ia mendengar\ndari pada saudara bapaknya yang perempuan telah berkata ia. Adalah kami dengar\nbahwasanya Siti Aminah tatkala ia mengandung akan Rasulullah saw, adalah Siti Aminah\nberkata ia: Tiada aku ketahui bahwa aku telah hamil dan aku tiada peroleh perasaan yang\nberat selama (dalam naskah tertulis selamat, diduga terburu-buru) mengandungnya sesuatu"}, {"type": "text", "text": "yang berat dan tiada pula aku merasa sakit, sebagaimana yang (di)peroleh2 (di dalam teks\ntidak ada awalan di) perempuan yang lain, melainkan bahwa tersadar, aku terangkan waktu\nhaidku, dan datang kepadaku tatkala itu aku antara tidur dan jaga. Maka berkata satu suara\nkepadaku. Adakah engkau ketahui hai Siti Aminah bahwasanya engaku ini telah hamil,\nmaka seola(h) ola(h) aku berkata itu tiada aku ketahui. Maka berkata suara itu; engkau ini\ntelah hamil akan penghulu segala umat ini, dan nabinya nabi yang membawa petunjuk lagi\nyang amat mengasihani, dan adalah yang demikian itu pada hari Senin. Telah berkata Siti\nAminah, maka adalah pekerjaan itu dari pada memberi yakin pada diriku telah hamil.\nMaka tatkala hampirlah aku melahirkan, maka datanglah kepadaku suara yang telah datang\ndahulu itu. Maka berkata suara itu kepadaku: katakanlah olehmu hai Siti Aminah (aku"}, {"type": "transliteration", "text": "berlindung kepada yang maha kuasa kepada Tuhan yang Maha Esa lagi ṣamadi Tuhan"}, {"type": "text", "text": "tempat kita menyeruh diri dari pada segala kejahatan yang empunya dengki). Berkata Siti\nAminah; maka aku berkata demikian itu dan aku ulang2 perkataan itu pada tiap tempat\nyang aku lalui."}, {"type": "transliteration", "text": "Allāhumma ṣali wa sallim alā sayyidina Muhammad"}, {"type": "text", "text": "Dan dikatakan orang tatkala dikehendaki oleh Allah azza wa jalla  menzahirkan\nsebaik baik makhluqnya nabi Muhammad saw. Dititahkan oleh Allah ta'ala kepada Jibril\nbahwasanya mengambil tanah dari pada tempat kubur nabi yang amat mulia. Maka diambil\noleh Jibril akan tanah itu ditawafkan dia di dalam syorga yang bernama Jannatun na'im,\ndan diselamkan (di dalam teks tertulis disalamkan, diduga terburu-buru) akan tanah itu ke"}, {"type": "transliteration", "text": "dalam sungai yang bernama tasnim, serta dibawanya tanah itu ke haḍaratullāhta'ala yang"}, {"type": "text", "text": "maha tinggi lagi maha besar. Mengalirlah peluh atau keringat tanah itu, maka dijadikan\noleh Allah ta'ala dari pada peluh tanah itu cahaya tiap2 nabi yang besar2. Maka sekalian\npara nabi dijadikan dari pada cahaya nabi Muhammad saw. Kemudian ditaruhkan tanah itu\npada lembaga Nabiyullah Adam. Dan dihantarkan dalamnya cahaya yang elok rupanya\ntelah terdahulu megahnya dan terdahulu warnanya.  Maka jatuhlah ia disana, maka\ndikelilingi oleh segala malaikat almuqarrabin yang sujud kepada (di dalam teks tidak ada\nkata kepada) Nabiyullah Adam. Kemudian diambil oleh Allah ta'ala atas Nabiyullah\nperteguhan setia serta perjanjian. Ketika dititahkan oleh Allah ta'ala akan segala malaikat\nsujud bagi Nabiyullah Adam. Bahwasanya tiada dihantarkan cahaya itu melainkan pada\norang yang mulia lagi suci yang telah disucikan dari pada yang keji dan kotor. Maka\nsenantiasa cahaya itu dipindahkan dari segala lembaga yang baik2 serta ke dalam rahim\nperempuan yang merdeka. Sehingga disampaikan dia kepada tangan yang mulia dan murah"}, {"type": "transliteration", "text": "yaitu Abdullah anak Abdul Muṭalib cucu Hasyim.\nAllāhumma ṣali wa sallim alā sayyidina Muhammad"}, {"type": "text", "text": "Maka tatkala ketika hampirlah selesai janjinya, maka terbitlah tanda bahagia pada\nsegala tempat dan terhampirlah tanda keelokan. Karna menzahirkan sesudah sudahnya\nnabi. Melihat bagi Abdullah dengan segala penglihatan. Terbitlah atasnya segala cahaya.\nYang dipakaikan orang dia dengan pakaian yang amat elok rupanya serta berkata dan"}, {"type": "transliteration", "text": "dengan fasih lidahnya. Menyuruh akan dia lidah itu dari pada haḍaratullah ta'ala, seraya"}, {"type": "text", "text": "berkata: hai Abdullah; tiada patut perbendaharaan bagi barang yang engkau tangkungi ke\ndalam perut Siti Aminah yang mulia dan amat suci yang telah disucikan dari pada\nkejahatan dan kotoran. Ialah penghulu segala perempuan bani Najjar. Maka berhimpunlah\nkeadaan Abdullah dengan keadaan Siti Aminah. Dan sampailah tali hubungan Abdulah\ndengan tali hubungan Siti Aminah. Dan nyatalah hening yakinnya, maka dikelebungi oleh\nperut Siti Aminah akan anaknya, maka cemerlanglah cahaya nabi Muhammad saw pada\ndahi (di dalam teks tertulis padahi, diduga karena terburu-buru) Siti Aminah. Dan memberi\ningatan kepadanya tentang kelebihan kemuliaan nabi Muhammad saw. Pertama2 bulan\nhamilnya datang kepadanya dalam mimpinya Nabiyullah Adam, dan memberitahu akan\ndia bahwasanya ia mengandung akan penghulu segala alam. Pada bulan yang kedua,\ndatang kepadanya dalam mimpinya Nabiyullah Idris. Mengkhabarkan akan dia dengan\nmegahnya nabi Muhammad saw dan kejadian yang indah. Pada bulan yang ketiga, datang\nkepadanya dalam mimpinya Nabiyullah Nuh,dan berkata ia bagi Siti Aminah bahwasanya\nengkau ini mengandung yang empunya kemenangan dan mengalahkan beberapa negri\nkafir. Pada bulan yang keempat, datang kepadanya dalam mimpinya Nabiyullah Ibrahim\nal-khalil, dan menyebut ia bagi Siti Aminah akan kelebihan nabi Muhammad saw dan\ntempatnya yang amat besar. Pada bulan yang kelima, datang kepadanya dalam mimpinya\nNabiyullah Ismail, dan memberi kabar gembira baginya bahwasanya anaknya itu yang\nempunya hebat dan sangat mulia. Pada bulan keenam, datang kepadanya dalam mimpinya\nNabiyullah Musa al-kalim, dan memberi tahu akan dia dengan martabat nabi Muhammad\nsaw, dan megahnya yang amat besar. Pada bulan ketujuh, datang kepadanya dalam\nmimpinya Nabiyullah Daud, dan mengajarkan akan dia bahwasanya ia mengandung yang\nempunya maqam yang terpuji dan mempunyai telaga yang penuh isinya, dan mempunyai\nbendera kemenangan yang berkibar, dan mempunyai kemuliaan, dan mengkhabarkan\nbaginya bahwasanya anaknya itu yang mempunyai tempat yang terpuji. Pada bulan\nkedelapan, datang dalam mimpinya Nabiyullah Sulaiman, dan mengkhabarkan kepadanya\nbahwasanya ia mengandung nabi akhir zaman, pada bulan kesembilan, datang kepadanya\ndalam mimpinya Nabiyullah Isa al-masih, dan berkata ia kepada Siti Aminah bahwasanya\nengkau ini tertentulah menzahirkan agama yang sahih dan lidah fasih. Dan tiap2 seorang\ndari pada mereka itu berkata baginya dalam mimpinya, hai Siti Aminah; apabila kau\nperanakkan dia seperti matahari yang bercahaya2 dan memberi petunjuk jalan yang benar,\nmaka engkau beri namai akan dia Muhammad."}, {"type": "transliteration", "text": "Allāhumma ṣali wa sallim alā sayyidi Muhammad"}, {"type": "text", "text": "Maka tatkala sangatlah baginya hendak terakhir nifas; padahal tiada diketahui oleh\nseorang manusia, maka menengadahkan ia akan dua tapak tangannya mengadukan dirinya\nkepada Allah; yang mengetahui rahasia dan bisikannya atau kehendaknya. Maka tiba2\ndatang Asia istri Fir'aun dan Siti Maryam anak Imran dan beberapa bidadari yang elok2\nrupanya. Bahwasanya telah teranglah dari pada keelokan  mereka itu akan segala tempat.\nMaka hilanglah dari pada Siti Aminah barang yang diperolehnya dari pada segala duka\ncitanya."}, {"type": "arabic", "text": "ﷲ لي ﷲ لينعم الو لي * صلوا على هذا النبي محمد"}, {"type": "transliteration", "text": "Allahu lī Allahu lī ni'mal-walī * ṣallū 'alā hāzihin-nabiyyi muhammad"}, {"type": "arabic", "text": "ﷲ وليx2 نعم الولي  ﷲ مولي يا ربنا\nصلوا علي هذا النبي ومحمد ﷲ سيد وغفرلنا"}, {"type": "transliteration", "text": "Allāhu walī 2x ni'mal-wali Allāhu maulā yā rabbanāṣallū 'alā hāżan-nabiyyi wa\nmuhammadi al-lāhu sayyidi wa gaffir lanā  (Jābu)."}, {"type": "translation", "text": "\"Allah adalah wali 2x sebaik-baik wali, Allah penghulu yā tuhan kami;Salawatlah buat nabi Muhammad ini, ya Allah muliakan dan ampuni kami\"."}], "raw_line_count": 198}, {"id": 4, "name": "Sair Keempat", "blocks": [{"type": "text", "text": "d. Sair keempat:"}, {"type": "arabic", "text": "ولد الحبيب* والنور من وﺟناته يتوقّد * دّ روتم هّدخو\n ولد الحبيب وخدّه متور ّد*ولد الحبيب ومثله ﻻ يولد "}, {"type": "transliteration", "text": "Wulidal-habību wa khadduhū mutawarrid * wan-nūru min wajanātihi yatawaqqad;\nwulidal-habību wa miṡluhū lā yūlad * wulidal-habību wa khadduhū mutawarrid."}, {"type": "translation", "text": "\"Kekasih telah lahir dan pipinya memerah; dan cahaya dari bagian atas pipinya bersinar; Kekasih telah lahir dan yang serupanya tidak lahir; kekasih telah lahir dan pipinya memerah;"}, {"type": "arabic", "text": "ﷲ ي ﷲ ي ﷲ ي ﷲ حي ﷲ ي ﷲ  ربنا\nﷲ ي ﷲ ي ﷲ ي ﷲ حي ﷲ ي ﷲ حسبنا"}, {"type": "transliteration", "text": "Allahu Allahu Allahu Allahu Allahu Allahu rabbunā\nAllahu Allahu Allahu Allahu Allahu Allahu hasbunā\n”Allah Allah Allah Allah Tuhan kami; Allah Allah Allah yang memuliakan kami” (Jābu,\nhuruf yā dan kata hay hanya tambahan, ibarat not dalam lagu)."}, {"type": "arabic", "text": "ولد الذي لوﻻه ما عشق النقا * كﻼ وﻻ ذكر الحمى والمعهد *\nولد الذي لوﻻهما ذكرت قبا * اصﻼ وﻻ كان المحصب يقصد"}, {"type": "transliteration", "text": "Wulidal-lażi laulāhu mā 'usyiqan-niqā * kallā wa lāżukiral-himā wal-ma'had\nWulidal-lażī laulāhu māżukirat qubā * aṣlan walā kānal-muhaṣṣabu yuqṣad."}, {"type": "translation", "text": "\"Sekiranya dia tidak lahir, tidak ada yang sangat mencintai kebersihan; dan tidak sekali- kali disebut Mekkah dan Ma'had; Sekiranya dia tidak lahir, tidak disebut Kubah sama sekali, dan Muhaṣṣab8 yang dituju\"."}, {"type": "arabic", "text": "صلوا على منجاءنا باالبينة * احمد محمد المصطفى ونبينا"}, {"type": "transliteration", "text": "ṣallū 'alā man jā'anā bil-bayyinah * ahmad muhammadil-muṣtafā wa nabiyyunā."}, {"type": "translation", "text": "\"Bersalawatlah buat yang membawa/mendatangi kita dengan penjelasan; Muhammad al-mustafa nabi kita yang terpuji\". (Jābu)."}, {"type": "arabic", "text": " من قدّه يا صاح غصن املد   هذا الوفيّ بعهده هذا الذي*\nهذا الذي خلعت عليه مﻼبس * ونفائس فنظيره ﻻ يو ﺟد\nهذا الذي قالت ملئكة السما    * هذا مليح الكون هذا احمد\nديزا هنم دولوملااذ Ϳان كان معجز يوسف بقمصه * تا"}, {"type": "transliteration", "text": "Hażal-wafiyyu bi 'ahdihi hāżal-lażi * man qadduhū yāṣāhi gusnun amlad\nHażal-lażī khuli'at 'alaihi malābis * wa nafāisu fanaẓīruhū lā yūjad\nHażal-lażī qālat malāikatus-samā * hażā malīhul-kauni haża ahmad\nIn kāna mu'jizu yūsufin bi qamīṣihī * tal-lāhi żal-maulūdu minhu azyad"}, {"type": "translation", "text": "\"Inilah yang menepati janjinya; inilah yang membelah dahan pohon ukurannya menjadi halus (lunak). Inilah yang menanggalkan pakaian yang indah-indah; tidak ada yang setara dengannya; Inilah yang dikatakan oleh malaikat-malaikat yang di langit; inilah kecantikan alam, inilah yang terpuji; jika Yusuf memiliki mu'jizat dengan bajunya; demi Allah yang dimiliki oleh yang lahir (Muhammad) ini lebih dari padanya\"."}, {"type": "arabic", "text": "ﷲ يا الرحمن ﺟد لنا باﻻعمال با لوقت اﻻكوان  الحبيب السماء"}, {"type": "transliteration", "text": "Allāhu yā rahmān jud lana bil-a’māl bil-wakqtil-akwān, al-habībus-samā’i (Jābu). “Allah"}, {"type": "text", "text": "ya Rahman, limpahkanlah kami dengan waktu yang ada ini berupa amal-amal dan cinta\nyang tinggi”"}, {"type": "arabic", "text": "* هدشر يطعا ميهاربا ناك ولͿ ذا المولود منه ارشد * تا\nيامولد المختار كم لك من ثنا * ومدائح تعلو وذكر يوﺟد"}, {"type": "transliteration", "text": "Lau kāna ibrāhīmu u'ṭiya rusydahu * tal-lāhi żal-maulūdu minhu arsyad"}, {"type": "footnote", "text": "8Muhashshab adalah tempat melempar jummrah di Mina."}, {"type": "transliteration", "text": "Yā maulidal-muhktāri kam laka min ṡanā * wa madā'ijinn ta'lū ważikrin yūjad"}, {"type": "translation", "text": "\"Sekiranya Nabi Ibrahim diberikan petunjuknya; demi Allah, petunjuk yang dimiliki Muhammad melebihi dari padanya. Hai yang terpilih (Muhammad) betapa banyak pujian yang tinggi/mulia disebut-sebut terhadapmu\"."}, {"type": "arabic", "text": "شرف كنا لدينا مكة مدينةx2 ايمام الحرمينx2 نبي ثقلين9"}, {"type": "transliteration", "text": "Syarrif kunnā ladainā makkata madīnah 2x īmāmul-harmaini 2x nabiyyu saqalain (Jābu)."}, {"type": "translation", "text": "\"Muliakan pemilik Makkah Madinah 2x, Imam al-harmain 2x Nabi jin dan manusia\"."}, {"type": "arabic", "text": "يا عاشقين تولهوا في حبه * هذا هو الحسن ال *جميل المفرد \nثم الصﻼة علي النبي واله * في كل يوم ماضي ومجدد"}, {"type": "transliteration", "text": "Yā 'āsyiqīna tawallahū fi hibbihi * haża huwal-hasanul-jamīlul-mufrad\nṡummaṣ-ṣalātu 'alan-nabiyyi wa alihi * fi kulli yaumin māḍiyyin wa mujaddad"}, {"type": "translation", "text": "\"Hai orang-orang yang sangat mencintai, rindulah pada kekasihnya; Dia sendiri yang baik kecantikannya; kemudian bersalawatlah kepada Nabi dan keluarganya; pada setiap hari yang berlalu dan dimuliakan\". (Sair keempat ini diselingi lima jābu)"}, {"type": "arabic", "text": "اللهم صل وسلم و هيلع كراب\nووضعت الحبيب محمدا صلي ﷲ عليه وسلم وهو مكحل العيون * مقطوع السرة ومختون * اخذته المﻼئكة اﻻبرار *\nهما ىلا * ورﺟعوا بالمفضل علي الكونين * وعرفوا به اهل السموات واﻻرض والبحار * راطقﻻا عيمﺟ يف هب اوفاطف\nامنة فى اسرع من طرفة عين *  خفقت فى اﻻك  لصح * زال العنا *ﺟاء الهنا * دقت البشائر لقدومه * همولع مﻼعاناو\nالغنا * نلنا المنا * طابت القلوب * غفرت الذنوب * سترت العيوب * كشفت الكروب ببركة سيدنا محمد الحبيب\nالمحبوب *"}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim wa bārik a'alaih\nWa waḍa'atil-habība muhammadan ṣallal-lāhu 'alaihi wa sallam wa huwa mukahhalul-"}, {"type": "translation", "text": "'uyūn * maqṭū'us-surrati wa makhtūn * akhażathul-malaikatul-abrār * faṭāfū bihi fi jamī'il- aqṭār * wa 'arrafū bihī ahlas-samāwāti wal-arḍi wal-bihār * waraja'ū bil-mufaḍḍali 'alal- kaunain * ilā ummihīāminata fi asra'i min ṭarfati 'ain * khafaqat fil-akwāni a'lāmu 'ulūmih * dukkatil-basyāiru liqdūmih * jā'al-hanā * zālal-'anā * haṣalal-ginā * nilnal-munā * ṭābatil-qulūb * gufiratiz-żunūb * sutiratil-'uyūb * kusyifatil-kurūbu bi barakati sayyidinā muhammadil-habībil-mahbub*"}, {"type": "arabic", "text": "الف صلوا على النبي خاتم الرسل الكرام * احمد الهادي الذي سيلل عم  مانﻻا هدوﺟ"}, {"type": "footnote", "text": "9Al-Harmain adalah dua kota suci yakni Makkah dan Madinah."}, {"type": "transliteration", "text": "Alfa ṣallū 'alan-nabiyyi khātamir-rusulil-kirām * ahmadal-hādiyal-lażī sailila 'amma\njūdihil-anām."}, {"type": "translation", "text": "\"Beribu-ribu salawat buat nabi penutup para rasul yang mulia; Yang terpuji pemberi petunjuk yang kemurahannya mengalir meliputi semua makhluk\"(Jābu)"}], "raw_line_count": 85}, {"id": 5, "name": "Sair Kelima", "blocks": [{"type": "text", "text": "e. Sair kelima:"}, {"type": "arabic", "text": "وبرؤيا محمد فرحت انفس العباد  دادولاو تقولا ىفصو دارملاو دصقلا لصح"}, {"type": "transliteration", "text": "haṣalal-qaṣdu wal-murādu waṣafal-waqtu wal-widādu wa biru'yā muhammadin farihat\nanfusul-'ibād."}, {"type": "translation", "text": "\"”Yang dituju, yang dikehendaki dan waktu yang hening serta cinta kasih telah berhasil, dengan melihat Muhammad bergembiralah hati para hamba”. (Sair kelima ini hanya diselingi satu jābu)."}, {"type": "arabic", "text": "رمقت امنة محمدا بالبصر * فاذا فرقه كالصبح اذااسفر * وشعرهكالليل اذا سجى واعتكر * ووﺟهه اضوء من الشمس\nوانور * اما سمعت كيف انشق له القمر * ازج الحاﺟبين اكحل العينين اقنى اﻻنف دقيق الشفتين * كانما يتبسم عن\nنضيد الدرر * عنقه كانه ابريق فضة وقد فاق على ﺟيد الغزال * وقده ارشق من الغصن الرطيب اذا خطر * بين كتفيه\nفصاول دحي ﻼف هل امك لك اماو * فهذه قطعة من بعض اوصاف ﺟماله *خاتم النبوة فيا فوز من عاينه ونظر \nوﻻيحصر *"}, {"type": "transliteration", "text": "Ramaqat āminatu muhammadan bl-baṣar; faiżā farquhū kaṣ-ṣubhi iżā asfar; wa sya'ruhu\nkal-laili iżā sajā  wa'takar; wa wajhuhu aḍwa'u minasy-syamsi wa anwar;  amā sami'ta\nkaifa-nsyaqqa lahul-qamar; azajjul-hājibaini akhalul-'ainaini aqnāl-anfi daqīqusy-\nsyafatain; ka annamā yatabassamu 'an naḍīdid-durar; 'unuquhū ka annahū ibrīqu fiḍḍatin\nwaqad fāqa 'alā jīdil-gazāl; waqadduhū arsyaqu minal-guṣnir-raṭībi iżā khaṭar; baina\nkatifaihi khātamun-nubuwwati fayā fauza man 'āyanahū wa naẓar; fa hażihi qiṭ'atun min\nba'ḍi auṣāfi jamālih; wa ammā kullu kamālihī falā yuhaddu liwāṣifin walā yuhṣar."}, {"type": "arabic", "text": "محمد  محمد ببدر التمام * محمد  محمد عليه سﻼم"}, {"type": "transliteration", "text": "Muhammad muhammad bi badrit-tamām;Muhammad muhammad 'alaihi salām;"}, {"type": "translation", "text": "\"Muhammad, Muhammad seperti bulan purnama yang sempurna, Muhammad, Muhammad alaihis-salam\" (Jābu)."}], "raw_line_count": 22}, {"id": 6, "name": "Sair Keenam", "blocks": [{"type": "text", "text": "f. Sair keenam:"}, {"type": "arabic", "text": "فى مثل حسنك تعذر العشاق * وتمد خاضعة لك اﻻعناق\nقد فاق حسنك للوﺟود باسره * حتى اضاء بنورك اﻻفاق *"}, {"type": "transliteration", "text": "Fi miṡli husnika tu'żarul-'usysyāq; wa tumaddu khāḍi'atan lakal-a'nāf;\nQad fāqa husnuka lilwujūdi bi asrihi; hattā aḍā'a bi nūrikal-afāq."}, {"type": "translation", "text": "\"Orang-orang yang sangat cinta sukar mencontohi kebaikanmu; Dan leher-leher menjadi panjang karena tunduk kepadamu; Kebaikanmu sudah melebihi seluruh yang ada; sehingga seluruh jagat ini menjadi terang dengan cahayamu\". (Sair keenam ini hanya diselingi satu jābu)"}, {"type": "arabic", "text": "وروى محمد بن سعيد عنﺟماعة من اهل العلم ان امنة لما حملت برسول ﷲ صلى ﷲ عليه وسلم * قالت لقد علقت به\nفما وﺟدت له مشقة وﻻ تعبا * وانه لما فصل عنها خرج معه نور اضاءت له قصور الشام * وما بين المشرق والمغرب\nووقع على اﻻرض معتمدا على يديه * صلى ﷲ  نب ﷲ دبع نب ديزي ىورو * هيدل افرشو ﻼضف هدازو ملسو هيلع\nوهاب عن عمته * ان امنة لما وضعت رسول ﷲ صلى ﷲ عليه وسلم ارسلت الى ﺟده عبد المطلب فجاءه البشير وهو\nﺟالس فى الحجر فاخبره ان امنة ولدت غﻼما فسر بذالك سرورا كثيرا * وقام هو ومن معه فدخل عليها فاخبرته بكل\nماراته وما قيل لها وما امرت به فاخذه ﺟده عبد المطلب فادخله الكعبة * وقام عنها يدعوﷲ ويشكره عز وﺟل على ما\nاعطاه وروي انه قال يومئذ شعرا *"}, {"type": "transliteration", "text": "Wa rawā muhammadu-bnu sa'īdin 'an jamā'atin min ahlil-'ilmi anna āminatan lammā\nhamalat bi rasūlil-lāhi ṣallal-lāhu 'alaihi wa sallam qālat * laqad 'alaqtu bihī famā\nwajadtu lahū masyaqqatan walā ta'aban * wa annahū lammā fuṣila 'anhā kharaja ma'ahū\nnūrun aḍā'at lahū quṣūrusy-syām * wamā bainal-masyriqi wal-magribi wa waqa'a 'alal-\narḍi mu'tamidan 'alā yadaih * ṣallal-lāhu 'alaihi wa sallama wa zādahū faḍlan wa\nsyarafan ladaih * wa rawā yazīdu-bnu 'abdil-lāhi-bni wahhābin 'an 'ammatih * anna\nāminatan lammā waḍa'at rasūlal-lāhi ṣallal-lāhu 'alaihi wa sallama arsalat ilā jaddihī"}, {"type": "translation", "text": "'abdil-muṭṭalibi fa jā'ahul-basyīru wahuwa jālisun fil-hijri fa akhbarahū anna āminatan waladat gulāman fasarra biżālika surūran kaṡīran * wa qāma huwa wa man ma'ahū fa dakhala 'alaihā fa akhbaraṭu bikulli mā ra'aṭu wamā qīla lahā wamā umirat bihī fa akhażahū jadduhū 'abdul-muṭṭalibi fa adkhalahul-ka'bah * wa qāma 'indahā yad'ul-lāha wa yasykuruhū 'azza wa jalla 'alā mā a'ṭāhu wa ruwiya annahū qāla yaumaiżin syi'ran * Allahumma ṣalli wa sallim 'alā sayyidi muhammad Maka beranaklah Siti Aminah akan habībullāh Muhammad saw. Yaitu bercila kedua matanya. Telah terputus tali pusatnya dan sudah terkhatan, maka disambut dia oleh segala malaikat (di dalam teks tertulis maka baik2, tidak ada sambungannya, diduga salah tulis). Maka ditawafkan (di dalam teks tertulis tawafkan, diduga karena terburu-buru) dia pada segala tempat. Dan memberi tahu mereka itu dengan dia pada isi tujuh lapis langit dan bumi serta kepada isi laut. Maka dikembalikan oleh mereka itu dengan kelebihan kedua negri. Kepada ibunya Siti Aminah terlebih cepat dari pada sekejap mata. Berkediplah pada alam segala yang mengetahui ilmunya. Maka lanjutlah segala yang terceritra bagi kejadiannya. Dan datanglah nabi Muhammad saw. Dan hilanglah segala duka cita orang. Dan sampailah segala kekayaan. Diperoleh sekehendak kita. Dan suka citalah segala hati orang (dalam teks tertulis ong tidak ada ra, diduga terburu-buru) terampunlah segalah dosa. Dan tertutuplah segala 'aib serta hilanglah segala kesusahan. Dengan berkata penghulu kita Nabi Muhammad saw yang dikasihi oleh Allah ta'ala mengasihi hambanya. Allahumma ṣalli wa sallim 'alā sayyidi muhammad Maka teranglah mata Siti Aminah dengan mengandung Nabiyullah saw. Maka pada ketika itu keelokan Nabiyullah itu seperti waktu subuh ketika hampir siang. Dan rambutnya Nabiyullah seperti malam gelap gulita. Dan bermula mukanya Nabiyullah itu terlebih terang dari pada matahari dan cahaya bumi. Maka tiada engkau dengar betapa bulan terbelah baginya. Bertemu dua keningnya lagi bercila kedua matanya, dan mancung hidungnya dan tipis kedua bibirnya, seolah telah tersenyum umpama terbuka ujung matanya. Lehernya Nabiyullah itu seperti gindi perak. Dan bahwasanya terlebih concang (mungkin jenjang) dari pada leher kicang (mungkin kijang). Dan sederhana batang tubuhnya terlebih lemah lembut dari pada cabang bunga, dan apabila berjalan, bergeraklah antara kedua bahunya tanda sebagai penutup dari semua nabi. Maka beroleh kemenanganlah barangsiapa yang menghadapi dia dan melihatnya. Maka inilah sebahagian disebutkan dari pada sifat2 keelokannya. Adapun sekalian sifat2 keelokan itu tiada boleh diperkatakan dan sampaikan (maksudnya disampaikan, diduga terburu-buru) oleh yang mensifatkan dia. Allahumma ṣalli wa sallim 'alā sayyidi muhammad Pada perumpamaan tuan hamba akan jadi guru segala yang birahi. Dan bertunduklah segala yang leher orang dengan menghinakan dirinya atas keelokan tuan hamba bagi segala alam. Sehingga teranglah dengan cahaya tuan hamba segala cakrawala. (Sebenarnya ini adalah terjemahan dari sair keenam di atas). Dan ceritra Muhammad anak Sa'id, ia mendengar dari pada sidang jama'ah dari segala orang2 yang berilmu, bahwasanya Siti Aminah tatkala mengandung akan Rasulullah saw berkata Siti Aminah: bahwasanya aku waktu mengandung akan Rasulullah, maka tiada aku peroleh karnanya kesakitan dan tiada pula aku merasa lelah. Dan bahwasanya Nabiyullah itu tatkala ia selesai dari pada Siti Aminah, maka keluarlah sertanya cahaya yang menerangi segala mahligai di negri Syam, dan apa2 yang antara masyriq (Timur) datang ke magrib (Barat) dan jatuhlah ia atas bumi dan ditadahkan kedua tapak tangannya Nabiyullah saw. Ditambah oleh Allah kelebihannya dan kemuliaannya pada haḍaratullāh ta'ala. Dan ceritra Yazid anak Abdullah cucu Wahab, ia mendengar dari pada bapaknya yang perempuan (maksudnya saudara bapaknya yangperempuan , diduga karena terburu- buru menulis). Bahwasanya Siti Aminah tatkala melahirkan ia akan Rasulullah saw, maka menyuruh ia kepada kakeknya Abdul Mutalib, maka datanglah kepadanya yang disuruh itu. Dan didatanginya pada ketika itu Abdul Mutalib duduk di dalam Hijir Ka'batullah. Maka mengkhabarkan orang yang disuruh itu kepada Abdul Mutalib bahwasanya Siti Aminah telah melahirkan seorang anak, dan dengan mendengar khabar itu, maka suka citalah Abdul Muṭalib dengan suka cita yang amat banyak. Dan berdirilah ia dan berdiri pula orang2 yang besertanya. Maka masuklah ia kepada Siti Aminah, maka dikabarkan kepadanya (kepada Abdul Muṭalib) tiap2 barang yang dilihatnya dan tiada dikatakan kepada Siti Aminah dan yang diperintahkan kepadanya 10, maka diambilnya anak itu oleh kakeknya Abdul Muṭṭalib dan dibawanya masuk akan dia ke dalam Ka'batullah. Dan berdirilah Abdul Muṭṭalib dan meminta doa kepada Allah dan bersyukurlah kepada Allah azza wa jalla atas barang yang dikaruniai oleh Allah akan dia. Dan diriwayatkan pula bahwasanya Abdul Muṭṭalib berkata pada hari itu dengan menyiarkannya."}, {"type": "arabic", "text": "على كل حال استغفر ﷲ من كل ذنب على ذنبͿ الحمدͿالحمد"}, {"type": "transliteration", "text": "Al-hamdu lillāhi al-hamdu lillāhi 'alā kulli hāli 'alā hāli astagfirul-lāhi min kulli żanbin"}, {"type": "translation", "text": "'alāżanbi. \"Segala puji bagi Allah atas segala hal, saya mohon ampun atas segala dosa di atas dosa\". (Jābu)"}], "raw_line_count": 94}, {"id": 7, "name": "Sair Ketujuh", "blocks": [{"type": "text", "text": "g. Sair ketujuh:"}, {"type": "arabic", "text": "* هذا الغﻼم الطيب اﻻردان *دمحلاͿ الذى اعطاني \nقد ساد فى المهد على الغلمان * اعيذه بالبيت ذى اﻻركان *"}, {"type": "transliteration", "text": "Al-hamdu lillāhil-lażī a'ṭānī * hāżal-gulāmaṭ-ṭayyibal-ardān *\nQad sāda fil-mahdi 'alal-gilmān * u'īżuhū bil-baiti żil-arkān"}, {"type": "translation", "text": "\"Segala puji bagi Allah yang telah memberikanku anak yang baik seperti sutra merah; Sungguh mulia anak laki-laki ini sewaktu masih di ayunan; dilindungi dia di rumah yang kokoh\"."}, {"type": "arabic", "text": "صلى عليك ﷲ يا عدنان ﷲ  ﷲ يا مصطفى يا صفوة الرحمان حسبنا ﷲ"}, {"type": "transliteration", "text": "ṣallā 'alaikal-lāhu yā 'adnāni alāhu allāhuyā muṣṭafā yāṣafwatar-rahmāni hasbunal-lāh\n(Jābu)"}, {"type": "translation", "text": "\"Semoga Allah mencurahkan salawat kepadamu hai Adnan; Allah Allah hai Mustafa hai yang pengasih yang hening, Allah memuliakan kami\"."}, {"type": "arabic", "text": "حتى اراه بالغ البنيان"}, {"type": "text", "text": "Sehingga ia melihatnya mencapai bangunan\""}, {"type": "arabic", "text": "اعيذه من شر ذى سناان * من حسد المذطرب العينان"}, {"type": "transliteration", "text": "*u'īżuhū min syarri żīsana'ān * min hasadil-muzṭaribil-'ainnān *"}, {"type": "translation", "text": "\"Dilindungi ia dari kejahatan yang besar berupa kedengkian penyakit dua mata\". (Jābu)"}, {"type": "footnote", "text": "10Di dalam naskah lain terjemahannya sebagai berikut:..dan barang yang dilihatnya dan barang yang dikatakan orang kepadanya dan yang disuruh orang akan dia…ini disebabkan oleh perbedaan dalam"}, {"type": "arabic", "text": "ماmaa)..ما رأته وما قيل لها وما امرت"}, {"type": "arabic", "text": "انتالذي سميت في القران"}, {"type": "transliteration", "text": "antal-lażī summīta fil-qurāni;"}, {"type": "translation", "text": "\"Engkau telah diberi nama di dalam Al-Quran\""}, {"type": "arabic", "text": "قم قما بالذي بالذي قم قما عليهاx2"}, {"type": "transliteration", "text": "qum qumā bil-lażī bil-lażīqum qumā alaihā 2x ”Berdiri (bangkit)lah bersama orang-orang\nyang berdiri di atasnya”(Jābu)."}, {"type": "arabic", "text": "احمد مكتوب على الجنان * صلى عليك ﷲ فى اﻻحيان"}, {"type": "transliteration", "text": "ahmadu maktūbun 'alāl-jinān;ṣallā 'alaikal-lāhu fil-ahyān ."}, {"type": "translation", "text": "\"Ahmad telah tertulis di atas perisai (sorga); Semoga Allah mencurahkan salawat buatmu di dalam kehidupan\". (Sairketujuh inidiselingi empat jābu)."}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nفسبحان من ابرز فى شهر ربيع اﻻول * طلعة قمر الوﺟود * فما اﺟملها من طلعة وابهاها * وما احسنها من محاسن\nواحﻼ ها * حملت به امنة فجاء ها ادم وهناها * ووقف نوح على بابها ونادها * واتاها الخليل يبشرها بما اتاها *\nوقصد حلتها موسى الكليم فسلم عليها وحياها * كل ذلك ﻻﺟل هذا المولود الذي تشرفت به اﻻرض وثراها * وﺟاءت\nالطيور من اوكار ها وفناه  يذلا رونلا اذه ام نيداني نهو * وخرﺟت الحور العين وعليهن خلع السرور وحﻼها * ا\nمﻶالبقاع وكساها * فقال ﺟبريل قد ولد من فاق البرية وما عداها * وخرت لمولده اﻻصنام وهدمت صوامع الكهان\nوزال بناها * وحمله ﺟبريل على يديه وهو يقبل بين عينيه * ويقول له انت حم * انت يس * انت طه * انت ولي\nالنفوس المؤمنات انت مولها *"}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim wa bārik a'alaih\nFa subhāna man abraza fī syahri rabī'il-awwal;ṭal'ata qamaril-wujūd; famā ajmalahā min\nṭal'atin wa abhāhā; wa mā ahsanahā min mahāsina wa ahlāhā; hamalat bihīāminatu fa\njā'ahāādamu wa hannāhā; wa waqafa nūhun 'alā bābihā wa nādāhā; wa atāhal-khalīlu\nyubasysyiruhā bimā atāhā; wa qaṣada hillatahā mūsāl-kalīmu fasallama 'alaihā wa\nhayyāhā; kullu żālika liajli hāżal-maulūdil-lażī tasyarrafat bihil-arḍu wa ṡarāhā; wa\njā'atiṭ-ṭuyūru min aukārihā wa fināhā; wa kharajatil-hūrul-'ainu wa 'alaihinna khala'us-\nsurūri wa hulāhā; wa hunna yunādīnu mā hāżan-nūrul-lażī malaul-biqā'a wa kasāhā;\nfaqāla jibrīlu qad wulida man fāqal-bariyyata wa mā 'adāhā; wa kharrat limaulidihill-\naṣnāmu wa huddimat ṣawāmi'ul-kuhhāni wa zāla bināha; wa hamalahū jibrīlu 'alā yadaihi\nwa huwa yuqabbilu baina 'ainaihi; wa yaqūlu lahū anta hā mīm; anta yā sīn; anta ṭā hā;\nanta waliyyun-nufusil-mu'mināti anta maulāhā.\nAllahuma ṣalli wa sallim wa bārik 'alaih"}, {"type": "text", "text": "Maka maha suci Tuhan yang menjadikan nabinya pada bulan Rabi'ul awwal.  Maka\nterbitlah bulan yang menerangi pada sekalian alam. Maka indalah keelokan dari pada terbit"}, {"type": "text", "text": "bulan itu dan maha indah cahayanya. Dan amat elok parasnya dan terbaik dari pada segala\nmanusia. Maka tatkala dikandungnya oleh Siti Aminah akan Nabiyullah itu, maka\ndatanglah kepada Siti Aminah Nabiyullah Adam dan sampaikan akan dia dengan kebajikan\ndan berdirilah Nabiyullah Nuh pada pintu rumah Siti Aminah dan menyuru akan dia. Dan"}, {"type": "transliteration", "text": "datang pula kepada Siti Aminah Nabiyullah Ibrahim al-khalilul-lāh, dan diceritrainya"}, {"type": "text", "text": "kepada Siti Aminah barang yang datang kepadanya. Dan sampailah pula ketempat Siti\nAminah Nabiyullah Musa al-kalim dan memberi kepada Siti Aminah serta memuja\nmujanya akan dia. Maka tiap2 yang demikian itu karena diperanakkan itu yang telah\ndimuliakan dengan dia pada segala bumi dan tanahnya. Dan datanglah segala burung2 dari\nsarangnya dan tempatnya. Dan keluarlah segala anak bidadari dan atas diri mereka itu\nsegala jenis pakaian kesukaan diri dan perhiasannya. Dan sekalian anak bidadari itu\nberseru2lah katanya; cahaya apa ini yang memenuhi segala tempat dengan segala\nperhiasannya. Maka Jibrail berkata: Bahwasanya telah dilahirkan seorang yang lebih dari\npada segala manusia dan yang sebelumnya. Dan tersanggurlah (hancur) segala berhala2\nkarna diperanakkan Rasulullah saw. Dan telah runtuhlah segala tempat tenung dan\nhilanglah bangunan2nya. Dan diciumnya antara kedua matanya. Dan berkata ia kepadanya:"}, {"type": "transliteration", "text": "Tuan hambalah yang bernama hāmīm. Dan tuan hambalah yang bernama yāsīn. Dan tuan\nhambalah yang bernama ṭā hā . Dan tuan hambalah yang memeliharkan segala nyawa"}, {"type": "text", "text": "orang mukmin dan tuan hambalah penghulunya."}, {"type": "arabic", "text": "يانوران بنور ﷲ * ياخاتم اﻻنبياء * ياسيد المرسلينͿيا مصطفى شيئ"}, {"type": "transliteration", "text": "Yā muṣṭafā syayiun lillāh  yā nūrani binūril-lāh. Yā khātamal-anbiyā'a. Yā sayyidil-\nmursalīn. Wahai yang terpilih segala sesuatu milik Allah, wahai yang memiliki dua nur\n(cahaya) dengan nur Allah, wahai penutup para nabi, wahai para utusan yang mulia. (Jābu)"}], "raw_line_count": 79}, {"id": 8, "name": "Sair Kedelapan", "blocks": [{"type": "text", "text": "h. Sair kedelapan:"}, {"type": "arabic", "text": "بدت لنا فى ربيع طلعة القمر
