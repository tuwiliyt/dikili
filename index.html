* من وﺟه من فاق كل البدر والحضر\nﺟلوه فى الكون واﻻمﻼك تحجبه * فى طلعة الحسن بين التيه والحفر *"}, {"type": "transliteration", "text": "Badat lanā fi rabī'i ṭal'atul-qamar; min wajhi man fāqa kullal-badri wal-haḍar;\nJallauhū fil-kauni wal-amlāku tahjubuh; fīṭal'atil-husni bainat-tīhi wal-hafar."}, {"type": "translation", "text": "\"Pada bulan Rabi', bulan terbit dengan wajah yang melebihi semua bulan purnama dan semua yang ada; pembesar-pembesar di alam ini menutupi keagungannya; kebaikannya muncul di antara padang belantara dan lubang di tanah\"."}, {"type": "arabic", "text": "ﷲ  ﷲ ﷲ ﷲx2 ﷲ ﷲ ﷲ ﷲ ﷲ ﷲ  يا صمد يا مولى"}, {"type": "transliteration", "text": "Allāh allāh allāh allāh 2x allāh allāh allāh allāh allāh allāh yāṣamadi yā maulā .(Jābu).\nṣamad artinya yang dituju.*"}, {"type": "arabic", "text": "اكرم بمولد خير الخلق والبشر\nﺟلوه فى صورة فاقت على الصور\nسعيا على الرأس بل سعيا على البصر\nمن بعد هذا الجفا ياضيعة العمر\nوكان فى مثل هذا الشهر مولده\nتجمع الحسن فيه فهو واحده\nمتى ارى ربعه  ياسعد واسعى له\nان لم ازر قبره ياسعد فى عمرى"}, {"type": "transliteration", "text": "Wa kāna fī miṡli hāżasy-syahri mauliduhū * akrim bi maulidi khairil-khalqi wal-basyar *\ntajamma'al-husnu fīhi fahuwa wāhiduh * jallauhu fi ṣūratin fāqat 'alaṣ-ṣuari * matā arā\nra'bahū yā sa'du was'ā lahū * sa'yan 'alar-ra'si bal sa'yan 'alal-baṣar * in lam azur\nqabrahū yā sa'du fī 'umurī * min ba'di hāżal-jafāyā ḍai'atal-'umur."}, {"type": "translation", "text": "\"Untuk mencontohi sebaik-baik makhluk dan manusia ini, maka muliakanlah bulan kelahirannya; kebajikan telah terhimpun di dalam dirinya sendiri; keagungannya di dalam bentuk melebihi semua bentuk; ketika aku melihatnya berhenti, bergembira dan berusaha mendapatkannya dengan kepala bahkan dengan penglihatan; jika belum menziarahi kuburnya di dalam umurku; sia-sialah umur sesudah ini\"."}, {"type": "arabic", "text": " سبحان خير الوارا رب الذكر*سبحان رب السماء رب الزمان "}, {"type": "transliteration", "text": "Subhāna rabbus-samā rabbuz- zamān * subhāna khairal-wār rabbuż-żukira"}, {"type": "translation", "text": "\"Maha suci tuhan yang dilangit, tuhan sepanjang masa; mahasuci tuhan yang selalu disebut/dīngat oleh sebaik-baik makhluk. (Jābu)."}, {"type": "arabic", "text": "* رهسلل نافﺟﻻاو بلقلل دﺟولاف *تقسم الحب فيه كل ﺟارحة \nصلى عليه اله العرش ما صدحت * حمائم الورق فى اﻻصال والبكر *"}, {"type": "transliteration", "text": "Taqassamal-hubbu fīhi kulla jārihah * fal-wajdu lil-qalbi wal-ajfānu lis-sahri\nṣallā 'alaihi ilāhul-'arsyi māṣadahat * hamā'imal-warqi fil-āṣāli wal-bukar."}, {"type": "translation", "text": "\"Cinta telah terbagi pada semua anggota; hati merasa rindu dan mata terbuka; Semoga Tuhan 'arasy mencurahkan salawat buat ayam yang berkokok di atas daun yang sejuk setiap pagi dan sore\". (Sair kedelapan ini diselingi tiga jābu)."}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nفلما ان اوان مولده الكريم * وحان مقدمه الشريف العظيم * صاح شاووش اﻻشارة بالبشارة ﻻهل   * نيعمﺟا ضرﻻا\nوماارسلناك اﻻ رحمة للعالمين * فعند ذالك حفت بامه امنة المﻼئكة اﻻبرار * تحجبها باﺟنحتها عن اعين اﻻغيار *\nفوقف عن يمينها ميكائيل وبين يديها ﺟبريل ولهم زﺟل بالتسبيح والتقديس والتهليل للملك الجليل * واقبلت الحور العين"}, {"type": "arabic", "text": "الى امه امنة الكريمة تب شرها بانها من ﺟميع المخاوف امنة * وتنوب عن القوابل البشرية با لسعادة اﻻبدية والغرة\nالقمرية * والطلعة المحمدية * اخذها المخاض واشتدبها اﻻمه * فولدت النبي صلى ﷲ عليه وسلم كانه البدر فى تمامه"}, {"type": "text", "text": "*"}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim wa bārik a'alaih\nFalamā anna awāna maulidihil-karīm. Wa hāna maqdamuhusy-syarīful-'aẓīm. ṣāha\nsyāwūsyul-isyārati bil-basyārati liajlil-arḍi ajma'īn. Wa mā arsalnāka illā rahmatan lil-"}, {"type": "translation", "text": "'ālamīn. Fa'inda żalika haffat bi ummihīāminatal-malāikatal-abrār. Tahjubuhā biajnihatihā 'an a'yunil-agyār. Fawaqafa 'an yamīnihā mīkā'īlu wa baina yadaihā jibrīlu wa lahum zajalun bit-tasbīhi wat-taqdīsi wat-tahlīli lil malikil-jalīl. Wa aqbalatil-hurul- 'īnu ilā ummihīāminatal-karīmati tubasysyiruhā bi annahā min jamī'il-makhāwifi āminah. Wa tanūbu 'anil-qawābilil-basyariyyati bis-sa'ādatil-adabiyyati wal-gurratil-qamariyyah; waṭ-ṭal'atil-muhammadiyyah; akhażahāl-makhāḍu wasytaddabihāālāmuh. Fa waladatin- nabiyya ṣallal-lāhu 'alaihi wa sallama ka annahul-badru fī tamāmih. Allahumma ṣalli wa sallim 'alā sayyidi muhammad Maka tatkala hampirlah dewasa masa jadinya Nabiyullah yang amat mulia. Dan hampirlah pengetahuanya yang amat mulia lagi amat besar. Dan berseru2lah dengan suara nyaring suaranya dengan memberi isyarat kepada segala isi bumi sekalian. Dan tiada kami mengutus engkau ya Muhammad melainkan menjadi rahmat bagi seluruh alam. Maka adalah tatkala itu dikelebungi (mungkin maksudnya dikerumuni) ibunya Siti Aminah oleh malaikat yang baik2. dan dilindunginya dengan sayapnya dari pada segala mata orang yang celaka, maka berdirilah pada pihak kanannya Mikail dan dihadapannya Jibrail, dan bagi sekalian mereka itu adalah berdengung2 mengucap tasbih dan taqdis dan tahlil bagi Tuhan yang maha tinggi. Dan datanglah sekalian anak bidadari kepada ibunya Siti Aminah yang mulia. Dan diceritrakan neneknya akan dia bahwasanya Siti Aminah sentosalah dari pada segala yang menakutkan. Dan disampaikan oleh sekelompok manusia dengan bahagia yang berkekalan, dan bercahayalah bulan. Dan cemerlanglah cahaya Nabi Muhammad ṣallal-lāhu 'alaihi wa sallam. Maka sukarlah bagi Siti Aminah adalah buntingnya itu amat keras sakitnya. Maka beranaklah Siti Aminah akan Nabi Muhammad ṣallal-lāhu 'alaihi wa sallam seolah olah Nabi Muhammad itu seperti bulan purnama empat belas hari dalam keadaan yang sempurnanya."}], "raw_line_count": 79}, {"id": 9, "name": "Sair Kesembilan", "blocks": [{"type": "text", "text": "i. Sair kesembilan:"}, {"type": "arabic", "text": "بسﻢ ﷲ الرحمن الرحيﻢ\nيا حبيب سﻼم عليك * صلوات ﷲ عليك  يا نبي سﻼم عليك * يا رسول سﻼم عليك"}, {"type": "transliteration", "text": "Yā nabī salāmun 'alaik; yā rasūl salām 'alaik; yā habība salāmun 'alaik; ṣalawātul-lāhi"}, {"type": "translation", "text": "'alaik; Wahai Nabi, selamat buatmu; Wahai Rasul, selamat buatmu. Wahai kekasih, selamat buatmu, semoga Allah mencurahkan salawat buatmu."}, {"type": "arabic", "text": "اشرق البدر علينا\nمثل حسنك ما راينا\nانت شمس انت بدر\nانت اكسير وغالي\nياحبيبي يا محمد\nيا مؤيد يا ممجد\nمن راى وﺟهك يسعد\nحوضك الصافى المبرد\nفاختفت منه البدور\nقط يا وﺟه السرور\nانت نور فوق نور\nانت مصباح الصدور\nياعروس الخافقين\nيا امام القبلتين\nيا كريم الوالدين\nوردنا يوم النشور"}, {"type": "transliteration", "text": "Asyraqal-badru 'alainā; fakhtafat minhul-budūri; miṡla husnika mā ra'ainā; Qaṭṭu yā\nwajhus-surūri; anta syamsu anta badrun; anta nūrun fauqa nūri; Anta iksīrun wa gāli;\nanta miṣbāhuṣ-ṣudūri; yā habībī yā muhammad; Yā 'urūsal-khāfiqaini; yā muayyad yā\nmumajjad; yā imāmal-qiblataini; man ra'ā wajhaka yas'ad; yā karīmal-wālidaini;\nhauḍukaṣ-ṣāfīl-mubarrad; Wirdunā yauman-nusyūri;"}, {"type": "translation", "text": "\"Bulan purnama telah terbit di atas kita; maka lenyaplah cahaya semua bintang karenanya. Keindahan yang serupa denganmu sama sekali belum pernah kami lihat, wahai orang yang berwajah gembira. Engkau (seperti) matahari, engkau (seperti) bulan purnama. Engkau cahaya di atas cahaya; engkau logam mulia yang sangat didambakan; engkau pelita hati. Wahai kekasihku, wahai Muhammad, wahai pengantin (orang yang paling tampan) di seluruh jagat. Wahai orang yang dikukuhkan, wahai Muhammad; wahai imam dua kiblat. Siapa yang memandang wajahmu akan bahagia, wahai orang yang mulia kedua orang tuanya. Telagamu yang bersih lagi sejuk adalah tempat tujuan kami pada hari kebangkitan."}, {"type": "arabic", "text": "مرحبا يا مرحبا * مرحبا يا مرحبا * مرحبا ياهر العين *ﺟد الحسين اي ابحرم "}, {"type": "transliteration", "text": "Marhaban yā marhaban * marhaban yā marhaban\nMarhaban yāhural-'aini * marhaban yā marhaban yā jaddul-husaini(Jābu)."}, {"type": "text", "text": "Selamat Datang! Selamat Datang! Selamat Datang! Selamat Datang!\nSelamat Datang wahai bidadari * Selamat Datang wahai wahai kakek Husain"}, {"type": "arabic", "text": "والغمامه قد اظلت* والمﻼ صلوا عليك\nواستجارت يا حبيبى *عندك الظبي النفور\nما راينا العيس حنت* بالسرىاﻻ اليك\nواتاك العود يبكى* وتذلل بين يديك"}, {"type": "transliteration", "text": "Mā ra'aināl-'īsa hannat; bis-surā illā ilaika; wal-gamāmah qad aẓallat; wal-malāṣallū"}, {"type": "translation", "text": "'alaika; wa atākal-'ūdu yabkī; wa tażallal baina yadaika; wastajārat yā habībī; 'indakaẓ- ẓabyun-nafūr. \"Kami belum pernah melihat unta mengeluarkan suaranya pada malam hari karena ingin diajak berjalan kecuali hanya dengan engkau. Awan selalu menaungimu, dan seluruh malaikat memohonkan salawat buatmu. Batang (kurma) datang kepadamu seraya menangis dan meminta kepadamu (untuk dinaiki). Kijang liar datang kepadamu dengan jinak hai kekasihku meminta perlindungan (supaya tidak diburu)\"."}, {"type": "arabic", "text": "ﷲ ﷲ نور ﷲ * ﷲ ﷲ نور ﷲ * نور محمد صلى ﷲx2 ﻻاله اﻻ ﷲ"}, {"type": "transliteration", "text": "Allah Allah nūrul-lāh,  Allah Allah nūrul-lāh;\nNūr Muhammad ṣallal-lāh 2x lā ilāha illal-lāh (Jābu)"}, {"type": "translation", "text": "\"Allah Allah cahaya Allah, Allah Allah cahaya Allah; Nur Muhammad, semoga Allah mencurahkan salawat kepadanya 2x; tiada Tuhan selain Allah\"."}, {"type": "arabic", "text": "ﺟئتهم والدمع سائل * قلت قف لى يادليل\nنحوهاتيك المنازل*فى العشي والبكور"}, {"type": "arabic", "text": "عند ما شدوا المحامل*وتنادوا للرحيل\nوتحمل لى رسائل*ايها الشوق الجزيل"}, {"type": "transliteration", "text": "inda mā syaddūl-mahāmil; wa tanādau lir-rahīl; ji'tuhum waddam'u sā'il; qultu qif lī yā\ndalīl; wa tahammal lī rasā'il; ayyuhasy-syauqul-jazīl; nahwa hātīkal-manāzil; fil-'asyiyyi\nwal-bukūr."}, {"type": "translation", "text": "\"Pada saat mereka telah mengikat semua perbekalannya pada pelanta unta, dan seluruh kaum berseru mengeluarkan aba-aba untuk berangkat; Aku datang kepada mereka dengan air mata bercucuran seraya berkata \"berhentilah sejenak untukku, wahai penuntun jalan\". Dan bawalah pesan-pesan ini dariku untuk memuaskan rasa rindu yang menggebu-gebu. Kepada (penduduk) rumah-rumah yang jauh (yang selalu kurindukan) di setiap petang dan pagi\"."}, {"type": "arabic", "text": "شرف قريسياx2 دينه مكة مدينة * امام الحرمينx2 نبي ثقلين"}, {"type": "transliteration", "text": "Syarrif quraisiyya 2x dīnahu makiyyah nadīnah,Imāmul-haramaini 2x nabiyyu ṡaqalaini\n(Jābu)."}, {"type": "translation", "text": "\"Muliakan (Nabi) dari kaum Quraisy penduduk kota Mekkah Madinah, agamanya, dan Imam Al-Haramain, nabitsaqalaini (bangsa jin dan manusia)\"."}, {"type": "arabic", "text": "كل من فى الكون هاموا * فيك يا با هى الجبين* ولهم فيك غرام*واشتياق وحنين\nفى معانيك اﻻنام  *قد تبدت حائرين *  انت للرسل ختام *انت للمولى شكور"}, {"type": "transliteration", "text": "Kullu man fil-kauni hāmū;  fīka yā bāhil-jabīn; wa lahum fīka garāmu; wasytiyāqun wa\nhanīn; fī ma'ānīkal-anām;qad tabaddat hā'irīn; anta lir-rusuli khitām;anta lilmaulā\nsyakūr;"}, {"type": "translation", "text": "\"Semua makhluk yang ada di alam ini mencintaimu, wahai orang yang bersinar keningnya; Mereka mabuk kepayang, rindu dan sayang kepadamu; Seluruh manusia yang menelusuri hakekat jati dirimu tenggelam dalam kebingungan. Engkau penutup para rasul, engkau hamba yang banyak bersyukur kepada tuhan\"."}, {"type": "arabic", "text": "عندنى واكمل منى عندنى واكمل منىمحمد2 رسول ﷲ محمد2 حبيب ﷲ"}, {"type": "transliteration", "text": "indanī wa akmala minnī;'indanī wa akmala minnī;muhammadun 2x rasūlul-lah;\nmuhammad 2x habībul-lāh (Jābu)"}, {"type": "translation", "text": "\"Yang paling sempurna adalah kepunyaanku dan berasal dariku; yang paling sempurna adalah kepunyaanku dan berasal dariku; Muhammad 2x Rasulullah; Muhammad 2x kekasih Allah\"."}, {"type": "arabic", "text": "عبدكالمسكين يرﺟو*فضلك الجم الغفير* فيك قد احسنت ظني* يابشير يانذير  * فاغثني واﺟرني* يا مجير من\nالسعير* ياغياثى يامﻼذي*  فىمهمات اﻻمور"}, {"type": "transliteration", "text": "abdukal-miskīnu yarju;faḍlakal-jammal-gafīr;Fīka qad ahsanta ẓannī;yā basyīru yā\nnażīr;Fa agiṡnī wa ajirnī;yā mujīru minas-sa'īr;Yā giyāṡī yā malāżi;fi muhimmātil-umūr;"}, {"type": "translation", "text": "\"Hambamu yang miskin ini mengharapkan karuniamu yang melimpah; Engkau telah bersangka baik padaku, wahai pembawa kabar gembira dan pemberi peringatan; Tolong dan selamatkan aku, wahai orang yang mampu menyelamatkan dari neraka sa'ir; Wahai penolongku, wahai yang dapat melindungiku dari hal-hal yang sulit\"."}, {"type": "arabic", "text": "يا نبي سﻼم عليك , ابي بكر سيد * يا عمر عثمان علي عبد القدير  ﺟيﻼن"}, {"type": "transliteration", "text": "Yā nabiyya salāmun 'alaik;abībakri sayyid;yā 'umar 'uṡmān 'āli;abdul-qadir jailāni\n(Jābu)."}, {"type": "translation", "text": "\"Wahai nabi selamat buatmu, Abubakar yang mulia; wahai Umar, Usman, Ali, Abdul Kadir Jailani."}, {"type": "arabic", "text": "سعد عبد قد تملى* وانجلى عنه الحزين* فيك يابدر تجل*فلك الوصف الحسين       \nليس ازكى منك اصﻼ*  قط يا ﺟد الحسين*  فعليك ﷲ صلى*    دائما طول الدهور"}, {"type": "transliteration", "text": "Sa'da 'abdun qad tamalla; wanjala 'anhul-hazīn; fīka yā badrun tajalla;falakal-waṣful-\nhasīn; laisa azkā minka aṣla;qaṭṭu yā jaddal husain; fa'alaikal-lāhu ṣalla;dāiman ṭūlad-\nduhūr;"}, {"type": "translation", "text": "\"Berbahagia hamba yang berusia panjang, dan dihindarkan dari kesulitan; Karena cinta kepadamu wahai bulan purnama yang tampak jelas; sifat yang baik hanya ada pada dirimu; Tiada yang lebih bersih keturunannya daripada engkau; wahai kakek Husain; Semoga Allah senantiasa mencurahkan salawatNya kepadamu sepanjang masa\"."}, {"type": "arabic", "text": "ﷲ  ﷲx2 ﷲ  ﷲ x2عزاواﺟﻼﻻ  يا مولى مولى  عزاواﺟﻼﻻ"}, {"type": "transliteration", "text": "Allah Allah 2x Allah Allah 2x 'izzan  waijlālan; yā maula maula 'izzan-waijlālan. (Jābu)."}, {"type": "translation", "text": "\"Allah Allah 2x Allah Allah 2x Maha Mulia dan Maha agung; wahai penghulu, penghulu Maha Mulia dan Maha Agung\"."}, {"type": "arabic", "text": "يا ولي الحسنات يا رفيع الدرﺟات* كفر عني الذنوب *واغفر عني السيئات\nانت غفار الخطايا والذنوب الموبقات* انت ستار المساوي* ومقيل العثرات"}, {"type": "transliteration", "text": "Yā waliyyal-hasanāti; yā rafī'ad-darajāti; kaffir 'anniż-żunūba;wa gaffir 'annis-sayyi'āti;\nantagaffārul-khaṭāya;waż-żunūbil-mūbiqāti; anta sattārul-masāwiy; wa muqīlul-'aṡarāti;"}, {"type": "translation", "text": "\"Wahai penghulu (Tuhan yang menguasai) semua kebaikan; wahai (Tuhan) yang Maha Tinggi KedudukanNya; Ampunilah dosa-dosaku;dan ampunilah kesalahanku; Engkau pengampun kesalahan, dan dosa-dosa yang membinasakan; Engkau pemaaf terhadap semua keburukan, dan mengenyahkan semua halangan dan rintangan\"."}, {"type": "arabic", "text": "ﷲ ﷲ موﺟود * ﷲ ﷲ موﺟود * ﻻ اله اﻻ ﷲ انت مقصود"}, {"type": "transliteration", "text": "Allah Allah maujud;  Allah Allah maujud; lā ilāha illal-lāhu anta maqṣūd ; (Jābu)."}, {"type": "translation", "text": "\"Allah Allah yang maujud; Allah Allah yang maujud; tiada Tuhan selain Allah; engkaulah yang dituju\"."}, {"type": "arabic", "text": "يا عالم السر واخفى*  مستجيب الدعوات* رب فارحمنا ﺟميعا*  بجميع الصالحات"}, {"type": "transliteration", "text": "Yā 'ālimus-sirri wa akhfā; mustajībud-da'awāti;rabbi farhamnā jamī'an; bi jamī'iṣ-\nṣālihāti;"}, {"type": "translation", "text": "\"Wahai yang mengetahui rahasia dan yang tersembunyi dan mengabulkan do'a-doa; Wahai Tuhan, kasihanilah kami semua dengan segala kebaikan\". (Sair kesembilan ini sebenarnya adalah sair Barzanji11 yang biasanya dibacakan pada saat aqiqah atau acara-acara lain, dan sair ini diselingi tujuh macam jābu)."}, {"type": "footnote", "text": "11Al-Barzanji adalah sebuah karya tulis seni sastra yang memuat kehidupan Nabi Muhammad saw. Kitab ini adalah 'Iqd al-jawaahir  (kalung permata) yang ditulis oleh Syech Fa'far al-Barzanji bin Husin bin Abdul\nKarim yang lahir di Medinah tahun 1690 dan meninggal tahun 1766. nama al-Barzanji dibangsakankepada\nnama penulisnya, yang juga sebenarnya diambil dari tempat asal keturunannya yakni daerah Barzinj\n(Kurdistan). Dalam kitab al-Barzanji dilkiskan riwayat hidup Nabi Muhammad saw dengan bahasa yang\nindah, berbentuk puisi serta prosa dan kasidah yang menarik perhatian orang yang\nmembaca/mendengarkannya. Kitab ini dalam bahasa aslinya (Arab) dibaca pada berbagai kesempatan antara\nlain pemberian nama bagi anak/bayi, peringatan maulid, acara sunatan/khitanan, pernikahan menaiki rumah"}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nبالسجود ولم يخلق مثله مولود ثم اومى باصبعه الى السماء فولد مختونا مكحﻼ Ϳفلما اشرق نوره فى الوﺟود اذعن\nمدهونا معطرا مكرما وخرج من ثغره نور اضاء له قصور بصرى من ارض الشام * وخرت لهيبته ﺟميع الصلبان\nواﻻصنام * واصبح كل ﺟبار بعد عزته ذليﻼ * ومنعت الشياطين ان تسترق السمع فلم تجد بعد ذلك الى السماء وصوﻻ\n* فلما بدت انوار غرته البهية * واشرقت شمس طلعته العلوية * اضاءت بمولده ظلم الحنادس وانشق ايوان كسرى *\nوخمدت نار فارس وكسرت الصلبان تعظيما لقدومه وتوقيرا * ونادى المنادى فى اﻻكوان تنبيها ﻻمته على كرامته\nوتذكيرا\nِهِنْذِإِب ِﷲ ىَلإ اًيِعاَدَ و * و َبَشِّرِ الْمُؤْمِنِيْنَ بِأَنﱠ لَهُمْ مِنَ ﷲِ يَأَيﱡهَا النﱠبِىﱡ إنﱠا اَر ْسَلْنكَ شَاهِدًا و َمُبَشِّر ًا و َنَذِ يْر ًا * اً رْيِنُم اًﺟاَ رِسَ و\n* اً رْيِبَك ًﻼْضَف"}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim wa bārik 'alaih\nFalammā asyraqa nūrhū fil-wujūdi az'ana lillāhi bis-sujūdi walam yukhlaq miṡlahu\nmaulūdun ṡumma aumā bi uṣba'ihi ilas-samā'i fawulida makhtūnan mukahhalan\nmadhūnan mu'aṭṭaran mukarraman wa kharaja min ṡagrihi nūrun aḍā'u lahu quṣūru buṣra\nmin arḍisy-syām. Wa kharrat lihaibatihi jamī'uṣ-ṣulbāni wal aṣnām. Wa aṣbaha kullu\njabbārin ba'da 'izzatihi zalīla. Wa muni'atisy-syayāṭīnu an tastariqas-sam'a falam tajid\nba'da zalika ilas-samā'i wuṣūla. Falammā badat anwāru gurratihil-bahiyyah. Wa asyraqat\nsyamsu ṭal'atihil-'ulwiyyah. Aḍā'at bimaulidihi ẓulamal-hanādisi wansyaqqa īwānu kisra.\nWa khamidat nāru fārisa wa kusiratiṣ-ṣulbānu ta'ẓīman liqudūmihi wa tauqīra. Wa nādal-\nmunādī fil-akwāni tanbīhā li ummatihi 'ala karāmatihi wa tażkīra. Yā ayyuhan-nabiyyu\ninnā arsalnāka syāhidan wa mubasysyiran wa nażīra. Wa dā'iyan ilal-lāhi bi iżnihi wa\nsirājan munīra. Wa basysyiril-mukminīna bi anna lahum minal-lāhi faḍlan kabīra."}, {"type": "arabic", "text": "ما مضى يا وسيع الكرام  2xانلرفغو 2xاندصق ام غلب ىفطصملاب ابر اي"}, {"type": "transliteration", "text": "Yā rabba bil-muṣṭafā ballig mā quṣidnā 2x wa gaffir lanā 2x mā maḍā yā wasī'al-kirām.\n(Jābu)"}, {"type": "translation", "text": "\"Wahai tuhan pengasih yang terpelihara, sampaikan kehendak kami, dan ampunilah bagi kami apa yang telah lalu, wahai yang Maha luas kemuliānnya\"."}], "raw_line_count": 177}, {"id": 10, "name": "Sair Kesepuluh", "blocks": [{"type": "text", "text": "j. Sair kesepuluh:"}, {"type": "arabic", "text": "فلكم له من اية مشهورة * نص الكتاب بها غدا مشهورا\nخمدت له نار المجوس ونكست * اصنامهم ودعوا هناك ثبورا *"}, {"type": "transliteration", "text": "Falakum lahu min āyatin masyhūrah; naṣṣul-kitābi bihā gadan masyhūra;\nKhumidat lahu nārul-majūsi wa nukkisat; aṣnāmuhum wada'au hunāka ṡubūra;"}, {"type": "text", "text": "baru, dan sebagainya, dan cara membacanya juga dengan bermacam-macam lagu. (Lihat Ensiklopedi Islam,\nPT Ichtiar Bom Van Hoeve, Jakarta, 1999, hal.241."}, {"type": "translation", "text": "\"Sebagian mu'jizat yang termasyhur yang dimilikinya adalah naṣ kitab yang diperuntukkan buat kamu, dapat memadamkan cahaya agama majusi, menundukkan berhala-berhala mereka, dan di sana dikemudian hari mereka akan mengalami kebinasaan\"."}, {"type": "arabic", "text": "ﷲ ﷲ2x ربنا * ﷲ ﷲ حسبنا * والنبي المصطفىx2 محبوبنا يا سيدنا"}, {"type": "transliteration", "text": "Allah Allah 2x Allah Allah rabbunā * Allah Allah hasbunā * wan-nabiyyul-muṣṭafā 2x\nmahbūbanā yā sayyidanā ."}, {"type": "translation", "text": "\"Allah Allah 2x Allah Allah tuhan kami; Allah Allah yang memuliakan kami; dan Nabi al-muṣṭafā (yang terpelihara) 2x kekasih kami, wahai tuan kami\". (Jābu)"}, {"type": "arabic", "text": "واتى يبشر بالهداية والتقى * فلذالك يدعى هاديا وبشيرا"}, {"type": "transliteration", "text": "Wa atā yubasysyiru bil-hidāyati wat-tuqā; faliżālika yud'ā hādiyan wa basyīra."}, {"type": "translation", "text": "\"Dia datang membawa kabar gembira dengan petunjuk dan takwa; maka oleh sebab itu dia dido'akan agar beroleh hidayah dan kegembirān\". (Sair kesepuluh ini diselingi dua jābu)"}, {"type": "arabic", "text": "اللهم صل هيلع كرابو دزو ملسو\nولما ولد صلى ﷲ عليه وسلم سأل الوحش والطير رضاعه * وسألت المﻼئكة تربيته * فقال ﷲ عز وﺟل انا قادر ان\nهذه عضري ﻻ نا *اربيه من غير رضاع وﻻ سبب ولكن سبقت كلمتي وتمت حكمتي وكتبت على نفسى فى اﻻزل \nالجوهرة اليتيمة غير امتي حليمة *"}, {"type": "transliteration", "text": "Allhumma ṣalli wa sallim wazid wa bārik 'alaih\nWa lammā wulida ṣallal-lāhu 'alaihi wa sallama sa'alal-wahsyu waṭ-ṭairu raḍā'ah * wa\nsa'alatil-malā'ikatu tarbiyyatah * faqālal-lāhu 'azza wa jalla ana qādirun an urabbiyahu\nmin gairi riḍā'in wa lā sababin walākin sabaqat kalimatī wa tammat hikmatī wa katabtu"}, {"type": "translation", "text": "'alā nafsī fil-azali * an lā yurḍi'a hażihil-jauharatal-yatīmati gairu amatī halīmah. Allhumma ṣalli wa sallim 'ala sayyidinā Muhammad Yio tondahu lo'uma bo timihulalatinelo Nabi Muhammad saw todelomo owwoluwo lo alamu mo'a’amilala wau ma lolamemetolo Nabiyullah lo tidupapa to Allah ta'ala molanggata wau uda2uda'a. Wau diyālu ta pilopowalilio mai ta lohuhumayawa wolio totonulola ta pilotutu tomoomoliomao, ma lotomayalomola Nabiyullah lo tutunulio ode hulunga tu'udu lopo tuwawu lomola lo Allah ta'ala. Wau to'u ma pilotutu lio mai Nabiyullah yito ma isi isilamu lomai, wau ma yide2tolomai lohuta lo Makkah bīhu lo mato lio mohualia. Wau ma huli2 mai lou moonu ma bo motungengeta boolio wolo u laba2 lotutu molanggata wau uda2a, wau u helumualai to dungito Rasulullah yito bo tinela ma lo'obāngo loma'o tonulola mālihe lo olongia lo Busra tohuta lolipu lo Syam. Wau ma yilolohubulo karna yiloohe lo uda'a lio wolo barakati lio lo Rasulullah, totonulola bu'i keke'i wau bu'i dudula'a, wau tonulola ta motiti uda'a lobatangalio. Tomoomolio ma'o ma moali ukiki'o wau moali mola hina timongolio sababu omumulialio lo Rasulullah saw. Wau ma ilo'embola lati2yala mola mota'o modungohe to hulunga dīlalo ta tunggula mola ode hulunga yio tondahu lo uma lo bulilangolomai tinela ma bo timihulala to dehupio wau ma lo'obāngolomao tinelo Nabiyullah tohumaya lotinelo matolodulahe paladio wolo uma laba2 lotutu molanggata wau uda2a. Wau ma yilotilangolo mao tu'udu upilotutuwalio to Rasulullah tonulola uhui modi'oloma wau boli motondoyo'oma wau ma yilondo'olo malihe2 lo olongia lo Kisra wau ma lopowatelo tulu hetutubo lo ta kapiru to lipu lo Paris. Wau ma lopipitangolo tonulola bui limongolio tu'udu ilowalia lo Nabiyullah mai laba2 lotutu molanggata wau uda2a, wau ma bolo hewuwa2ti'alo ma'o tonulola ta to bilulo'a limongolio tu'udu umodaha bolo moali ummati li Muhammadi du'ola to omumulialio wau ilolo'o lotilanggulio hamālo ma'o totili yoludelio lo huta hutawala pitu tunggula mola ode tili yolude lo hulunga wau mola womba2a bulilangio to Arasiyul-lah ta'ala. Wau lo paramani mai tio Eya molanggata to delomo kitabi lio Eya molamahe wau uda2a o'o diya mola lapalilio : Yā ayyuhan-nabiyyu innā arsalnāka syāhidan wa mubasysyiran wa nażīra. Wa dā'iyan ilal-lāhi bi iżnihi wa sirājan munīra. Wa basysyiril-mukminīna bi anna lahum minal-lāhi faḍlan kabīra. Wau debolilio ma'o: wu Nabiyullah tutu lio tutu amima lomangumai olemu Muhammadi ode dunia botiya wau ma lowali rahmati wau mola mowali sakusi wau mopo eela lo'opiyohu nikmati todelomo syorga wau mola mopo'ingati tonulola manusia tomimbihu olo leeto lo naraka. Wau motiyanga to ummatilio ode dalalo Allah ta'ala wolo izini lio wolo tinela mobanga wau mopatata. Wau mola wungguliamu to tonulola ta parcaya tutu lio tutu olimongolio yito de moli Allah ta'ala u mo'o toduwo ponu mai laba2 lotutu uda'a. Keterangan: Ini merupakan terjemahan bebas si penulis/penyalin naskah ini ke dalam bahasa Gorontalo terhadap kisah yang berkaitan dengan peristiwa kelahiran Nabi Muhammad saw. Tidak jauh beda kisah yang sudah diungkapkan terdahulu. Ini dapat dilihat pernyataan runtuhnya istana raja Kisra dan padamnya api yang disembah oleh kaum kafir di negeri Persia (dalam teks ditulis Paris) serta hancurnya berhala-berhala yang mereka sembah. Allahumma ṣalli wa sallim 'ala sayyidi muhammad Wau ma bolo dila dātala tuwota laba2 lotutu mopatata wau ma pilidudutio mai lo kitabi to dulahio moomoli wau tio2lo ta laba2 lotutu ilolo'opiyo wau ma lopopowatelo tulu u he tutubo lo ta kapiru, majusi, wau ma yilolohubulo tonulola bu'i he tutubo limongolio wolo uma hiwuwawuwati'ala timongolio. Wau u hepongowati'i mongolio yito uwalio bo ma yiloleeta ami ilodunggamai lo Nabi Muhammadi mai hemohungguli lo dalala motulide wau po'i'ooheya lio mola to Allah ta'ala. Mai hemohungguli lo'opipiyohu syorga wau ooleeto naraka. Wau tondahu lo uma pilotutu lio mai Rasulullah yito ma tilonggoyindulo tonulola binatangi linggela wolo tonulola buburungiyala tomimbihu ta moponu lo'u mopotutu to Nabiyullah. Wau odito olo tonulola malaikati ma ma'o hipohindua uwalio ta tonu ta momalihara to Nabiyullah. Bolo uwalo firmanu Allah ta'ala: wa'u ta kawasa tutu lio tutu u momalihara olio eleponu boli diyalu ta moponu lo'u mopotutu olio delo dila mongola olo Nabiyullah wau delo diyalu sababulio delo bolo ma yilemulo mai lo'iya'u, wau ma pilatatu'u mai tobuto'o wau ma tiluladu'u mai tio todelomo owwoluwo'u donggomola to ajali. Tutu lio tutu ta moponu lo'u mopotutu olio malo yatimu botī ngopohiya delo bo wato'u tilo Halimah. Keterangan: Ini juga merupakan terjemahan bebas si penulis/penyalin naskah. Namun ada kekeliruan (kelebihan), diduga salah tulis. Seharusnya terjemahan ini dimulai pada wau tondahu lo umapilotu lio mai Rasulullah …., karena teksnya dimulai pada ولما ولد صلى ﷲ عليه وسلم(walammā wulida ṣallal-lāhu 'alaihi wa sallam)…."}], "raw_line_count": 101}, {"id": 11, "name": "Sair Kesebelas", "blocks": [{"type": "text", "text": "k. Sair kesebelas:"}, {"type": "arabic", "text": "صﻼة ﷲ على  الهادي محمد * شفيع الخلق فى  يوم القيامة"}, {"type": "transliteration", "text": "ṣalātul-lāhi 'alal-hādiy Muhammad;  syafī'ul-khalqi fī  yaumil-qiyāmah;"}, {"type": "translation", "text": "\"Semoga Allah mencurahkan salawat buat pemberi petunjuk yakni Muhammad; pemberi syafa'at bagi makhluk pada hari kiamat\""}, {"type": "arabic", "text": "فطرق الوصل اضحت مستقيمة * واسرار الهوى عندى مقيمة\nفﻼ تخشى صدودا من حبيب * له نعم بما اولى عميمة *"}, {"type": "transliteration", "text": "Faṭurqul-waṣli aḍhat mustaqīmah * wa asrārul-hawā 'inda muqīmah * falā\ntakhsyāṣudūdan min habīb * lahu ni'amun bimā aula 'amaimah."}, {"type": "translation", "text": "\"Jalan untuk menyambung sudah nampak lurus; Dan rahasia-rahasia percintān padaku sudah berdiri tegak; Maka jangan takut menolak terhadap kekasih; Baginya kenikmatan/kesenangan lebih utama dari pada yang tidak tampak (buta)\"."}, {"type": "arabic", "text": "صﻼة ﷲ على الهادى اﻻمين * امام اﻻنبياء مولى2x والمرسلين"}, {"type": "transliteration", "text": "ṣalātul-lāhu 'alal-hādil-amīn * imāmul-anbiyā'i maulā wal-mursalīn.  (Jābu)"}, {"type": "translation", "text": "\"Semoga Allah mencurahkan salawat buat pemberi petunjuk yang terpercaya; Pemimpin para nabi, penghulu 2x dan para utusan\"."}, {"type": "arabic", "text": "* تقربه عواطفه الرحيمة * هتدع اب دبع تﻻز اذا\nوان عثر العجول بسوء فعل * يﻼطفه باوصاف كريمة *"}, {"type": "transliteration", "text": "Izā zallāt 'abdin bā 'adaṭu; tuqarribuhu 'awāṭifuhur-rahīmah; Wa in 'aṡural-'ajūlu bisū'I\nfi'lin;  yulāṭifuhu bi auṣāfin karīmah."}, {"type": "translation", "text": "\"Apabila seorang hamba sudah saling menjauhi, maka dekatkan ia dengan belas kasihan; Dan jika sudah jatuh kepada perbuatan jahat, maka lemah lembutlah dengan sifat-sifat mulia\"."}, {"type": "arabic", "text": "اﻻ يا رسول ﷲ  ختمه ﷲx2 فيها ليلة اﻻﺟلىx2 سلطان خيرالرسول"}, {"type": "transliteration", "text": "Alā yā rasūlal-lāh khatamahul-lāhu 2x fīhā lailatul-ajali 2x sulṭānu khairar-rasūl  (Jābu)."}, {"type": "translation", "text": "\"Ingatlah ya Rasulullah Allah telah menutupnya 2x; di dalamnya terdapat malam yang agung 2x, seorang pemimpin sebaik-baik rasul\"."}, {"type": "arabic", "text": "وان يشك الغرام حليف شوق * يقربه ويجعله نديمة"}, {"type": "transliteration", "text": "Wa in yasykul-garāma halīfu syauqin * yuqarribuhu wa yaj'aluhu nadīmah *"}, {"type": "translation", "text": "\"Jika ragu terhadap kerinduan dan kasih sayang kawan yang sudah sumpah setia, maka akan tidak lama lagi menjadi penyesalan\". (Sair kesebelas ini diselingi dua jābu)."}, {"type": "arabic", "text": "اللهم صل وسلم وزد وبارك عليه\nقال اهل السير رضى ﷲ عنهم وكان اهل مكة من عاداتهم ان يخرﺟوا باﻻطفال الى المراضع * قالت حليمة فاصابتنا\nفى بنى سعد سنة مغلية لعدم الغيث فجئنا الى مكة نحو اربعين امرأة مع كل امرأة منا بعلها نلتمس الرضعاء *وخرج\nاهل مكة باطفالهم الى المراضع * فوضعوهم حول الكعبة فسبقتنى النساء الى كل رضيع بمكة وتأخرت انا لضعفي\nوضعف اتانى وقلة سيرها * وﺟئت انا فلم اﺟد شيئا من الرضعاء * وسمعت امنة بقدومنا فقالت لعبد المطلب\nانظرلمولودك هذا مرضعة من بنى سعد فقد قدمن من المراضع السعديات * انظر لمولود ك مرضعة من اشرف\nالبريات *فخرج عبد المطلب فبينما هو يمشى اذ سمع هاتفا يقول له انظر الى حليمة السعدية * ترضع ابن امنة اﻻمينة\nرما هنا اهاوس ىلا هوملستﻻ * فماله اﻻ حليمة مرضعة نعم النبي المصطفى المختار*محمدا خير اﻻنام وصفوة الجبار \nوحكم ﺟاء من قهار * قالت حليمة السعدية * ثم انى مررت بعبد المطلب * فسألته عن رضيع * فقال لى ما اسمك وما\n هل لك فى  قف كبرع* فتبسم ضاحكا وتهلل وﺟهه فرحا فقال بخ بخ لك يا حليمة السعدية *لت اسمى حليمة السعدية \nارضاع غﻼم يتيم تسعدين به ان شاءﷲ تعالى *"}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim wa zid wa bārik 'alaih\nQāla ahlus-siari raḍiallahu 'anhum wa kāna ahlu makkata min 'ādātihim an yakhrujū bil-\naṭfāli ilal-marāḍi'i. qālat halīmatu fa aṣābatnā fī banī sa'din sanatun mugliyatun li'adaml-\ngaiṡa fa ji'nā ila makkata nahwa arba'īnam-ra'atan ma'a kullim-ra'atin minnā ba'luhā\nnaltamisur-ruḍa'ā. Wa kharaja ahlu makkata bi aṭfālihim ilal-marāḍi'. Fa waḍa'ūhum\nhaulal-ka'bati fasabaqatnin-nisā'u ila kulli raḍī'I bi makkata wa ta'akhkhartu ana liḍa'fī\nwa ḍa'fi atānīi wa qillati sairiha. wa ji'tu ana falam ajid syayi'an minar-ruḍa'ā. Wa sami'at\nāminatu bi qudūmina faqālat li 'abdil-muṭṭalib unẓur limaulūdika haża murḍi'atan min\nbanī sa'din faqad qadimna minal-marāḍi'is-sa'adiyyāt. Unẓur limaulūdika murḍi'atan min\nasyrafil-bariyyāt. Fa kharaja 'abdul-muṭṭalib fabainama huwa yamsyi iz sami'a hātifan\nyaqūlu lahu unẓur ilā halīmatis-sa'adiyyah. Turḍi'ub-na āminatal-amīnata muhammadan\nkhairal-anāmi wa ṣafwatal-jabbār. Famā lahu illā halīmatu murḍi'atun ni'man-nabiyyul-\nmuṣṭafal-mukhtār. Lā tusallimūhu ilā siwāha innāhu amrun wa hukmun jā'a min  qahhār.\nQālat halīmatus-sa'adiyyah. ṡumma innī marartu bi 'abdil-muṭṭalib. Fasa'altuhu 'an raḍī'i.\nFaqāla lī masmuki wa mā 'arbuki faqulti ismī halīmatus-sa'adiyyah. Fatabassama ḍāhikan\nwa tahallala wajhuhu farahan faqāla bakhi bakhi laki yā halīmatus-sa'adiyyah. Hal laki fi\nirḍā'in gulāmi yatīmin tas'adīna bihi in syā allāhu ta'āla."}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nقالت حليمة فجئت الى بيت امه امنة وهي امرأة هﻼلية * تزهر كالكوكب الدري فسألتها عنه فقالت انتم يااهل البادية *\nتطلبون من تجدون رفده * وهذا طفل يتيم مات ابوه وكنت به حامﻼ*  فكفله ﺟده عبد المطلب * قالت حليمة فرﺟعت\nالى بعلى ﻻشاوره فيه * فقال ارينى هذا الغﻼم* قال فتقدمت انا وبعلى الى بيت امنة * فقلنا هلمى به الينا فاتت به صلى\nﷲ عليه وسلم مد هونا مدرﺟا فى ثوب صوف ابيض وتحته حريرة خضراء * فاذا وﺟهه يضيء كالقمر ليلة البدر *\nفنظر بعلى فى وﺟهه ففتح عينيه فخرج منها نور ساطع وضياء ﻻمع * فحار عقلى وعقل بعلى * فقال ويحك يا حليمة\nهذا المولود هو كل المنا والمقصود * فقلت له هو يتيم فماذا تصنع به فقال خذيه فلعل ﷲ ببركته يرزقنا ان شاء ﷲ\nتعالى فكان كذالك *"}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim wa zid wa bārik 'alaih\nQālat halīmatu faji'tu ilā baiti ummihīāminata wa hiyam-ra'atun hilāliyyah. Tazharu kal-\nkaubid-durriyyi fasa'altuhā 'anhu faqālat antum yā ahlal-bādiyyah. Taṭlubūna man\ntajidūna rifdah. Wa hāża ṭiflun yatīmun māta abūhu wa kuntu bihī hāmila. Fa kafalahū\njadduhū 'abdul-muṭṭalib. Qālat halīmatu fa raja'tu ilā ba'lī li usyāwirahū fīh. Fa qāla arīnī\nhāzal-gulām. Qāla fa taqaddamtu ana wa ba'li ilā baitīāminah. Faqulnā halummī bihī\nilainā fa atat bihīṣallal-lāhu 'alaihi wa sallam madhūnan mudrahan fīṡaubi ṣaufi abyaḍa\nwa tahtahū harīratun khaḍrā'u. fa iżā wajhuhū yuḍī'u kal-qamari lailatil-badri. Fa naẓara\nba'lī fi wajhihī fa fataha 'ainaihi fa kharaja minhumā nūrun sāṭi'un wa ḍiyāun lāmi'.\nFahāra 'aqlī wa 'aqlu ba'lī. Fa qāla waihaka yā halīmatu hażal-maulūdu huwa kullul-\nmunā wal-maqṣūd. Fa qultu lahū huwa yatīmun fa māża taṣna'u bihī fa qāla khużīhi fa\nla'allal-lāhu bi barakatihī yarzuqunā in syā allāhu ta'ala fa kāna każālik."}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nقالت حليمة فاخذته وليس فى ثديي لبن وولدي طول الليل يقلقني من شدة ال  ملسو هيلع ﷲ ىلص دمحم تلمح املف *عوج\nواتانى ضعيفة فقويت وزال عنى ما اﺟد من اﻻلم* ثم وضعت ثديي فيه فثار اللبن حتى فاض وتبدد وسمعت قائﻼ يقول\nطوبى لك ايهاالسعدية* بالطلعة الهاشمية* والغرة القمرية* والهمة القريشية* سعدلك ياحليمة بالدرة اليتيمة*"}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim wa zid wa bārik 'alaih\nQālat halīmatu fa akhażtuhū wa laisa fi ṡdyī labanun wa waladīṭūlal-laili yuqliqunī min\nsyiddatil-jū'. Falammā hamaltu muhammadan ṣallal-lāhu 'alaihi wa sallama wa\natāhīḍa'īfatun fa qawiyat wa zāla 'annī mā ajidu minal-alam. ṡumma waḍa'tu ṡadyī fīhi\nfaṡāral-labanu hattā fāḍa wa tabaddada wa sami'tu qā'ilan yaqūlu ṭūbā laki ayyuhas-\nsa'adiyyah. Biṭ-ṭal'atil-hāsyimiyyah. Wal-gurratil-qamariyyah. Wal-himmatil-quraisyiyyah.\nSa'dun laki yā halīmatu bid-durratil-yatīmah.\nAllahumma ṣalli wa sallim 'alā sayyidinā muhammad"}, {"type": "text", "text": "Malohungguli tonulola ta tilonggonao ilopiya lo Eya timongolio: to owwoluo lo\ntuango Makka boito tingga malo watade limongolio tutu liotutu ma yilumualai timongolio\nwau hipudu'a ma'o tota ukiki'i limongolio ode tonulola bilulo'a lo ta mopotutu. Yio\nlotombilu tilo Halimah ualio yilowali olemu to kaumu lo Bani Sa'ad to taunu boito ma"}, {"type": "transliteration", "text": "lodudulahe lomai wau mā laba2 lotutu ilomomahale lo u'ālo dīlalo ilodehua lodidi eleponu"}, {"type": "text", "text": "bo peenda ma'o. Yio ma lona'olo timongolio wopato pulu lota mongobua2 wau moti2idu\ntangota limongolio yito delo detutuwau ma'o wolo mongolola'i limongolio tu'udu u\ntimongolio yito ohilao ma'o mohama tilihu lo'u mopututu. Yio ma yilumualo lomao\ntimongolio tuango Makkah boito, wau ma hepudu'a ma'o tonulola ta ukiki'i mongolio, wau\nma mao hipalita to bulemengo Ka'batullah. Yio mai lemulolo mongobua wuwewo lilo\nHalimah, wau tonulola ta ukekeinga potutuwola to Makkah boito, ma pilotatayade\nlimongolio, wau tilo Halimah yito delewoli ma'o tu'udu u tila'ealio malolulupuhe wolo u\ndilalo boti mo'owali moona'o.\nYio totonggadu uma ledungga ma'o ode Makkah boito yio tio tilo Halimah dilalo\nboli ta lo'otoduwo ngota ma'o olota ukiki'inga potutuolio. Yio teeto ma ilodungohe ma'o li\nmbu'i Aminah, timongolio ledungga ma'o ode Makkah, yio ma lotombilu ma'o tio du'ola\noli Abdul Mutalib uwalio polulawotindo mai to ta mopotutu to wombundo boti tu'udu"}, {"type": "transliteration", "text": "uwātia lo'odungohe to ta ledungga mai londo kaumu lo Bani Sa'ad. Yio ma'o"}, {"type": "text", "text": "polulawotindo mai to ta mopotutu to wombundo boti de ta laba2 lotutu molamahe lo\ntonulola kaumu boito. Yio teeto ma yilumalolo ma'o ti Abdul Mutalib wau ma yiloona'olo\ntio. Debolo ma totode suara tuwawu ilodungohe lio he motombilu mai uwalio; wu Abdul\nMutalib ma'otulawotamu mai tilo Halimah Sa'diyyah, tio2lo ta mopotutu to wala'i limbu'i\nAminah."}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim 'alā sayyidinā muhammad"}, {"type": "text", "text": "Wau de ta boito yito ti Muhammad ta malo ilo2 piyohe lo tonulola tau, wau ta\nlaba2 lotutu molamahe wau boli molanggata wau diyalu ta mopotutu olio ngopohiya delo\nbo wato lo Allah ta'ala tilo Halimah ta mopotutu olo ta ilo2 piyohe lo tonulola nabi. Ma\ntilulawotio mai wau elehiyamu umai mohudu to ta ngopohiya lilo Halimah. Tutu lio tutu u\nhepohutuwolio yito bo buto'a u hemedungga mai mondo Eya laba2 lotutu kawasa.\nLotombilu tilo Halimah Sa'adiyyah uwalio tomomolio ma'o leto wa'u ma loona'o ma'o ode\nbele li Abdul Mutalib, yio ma ma'o lohindu to ta ukiki'a potutuwola boito. Yio teto ti\nAbdul Mutalib ma lohindu mai ola'u: uwalio tita po'olo tanggula ma boti wau Arabi londo\nutonu ito boti. Yio teto ma tilameta ma'o lowatia tanggulo watia ti Halimah Sa'adiyyah.\nTeto ti Abdul Mutalib yito bo ilimiyoma wau tilalahehe wau ma yilumanggelamola lobaya\nlio karna yengahu hilalio wolo tombilu lio ma'o li Abdul Mutalib uwalio ma'o; laba2 lotutu\nuda2a u hepohutuwondo boti wolo uma lo'otoduwo palade yi'o wu Halimah, na'olo delo"}, {"type": "transliteration", "text": "ma reḍa hilamu tomimbihu mopotutu olo ta ukiki'a malo yatimu boti. Potala bolo"}, {"type": "text", "text": "po'otoduwowando palade wau ma posababua mai lo kohendako lo Allah ta'ala molanggata.\nLotombilu tilo Halimah, yio teto wa'u ma lona'olo ma'o ode bele li mama lio lo ta\nukiki'a potutuwola boito. De ta boitoito ti lo mbu'i Aminah. Yio teto wa'u ma ma'o lohindu\noli lo mbu'i Aminah tomimbihu ta ukiki'a potutuwola boito. Yio teto ma yilindu lio mai li\nlo mbu'i Aminah uwalio; wu timongoli ta londo huta2wala timongoli boti debo mopiyohu\nbolo mealo tita lotita ta po'otoduwowa limongoli huna ta ukiki'a malo yatimu ma ilopateya\nliyamolio to masa lo'u donggolo ombo2da'a."}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim 'alā sayyidinā muhammad"}, {"type": "text", "text": "Lotombilu tilo Halimah uwalio; muhuwalingo po'olo watia ode bele lo talola'i\nlowatia tu'udu watia donggolo ma'o mopo'otawa mai wolio wolo u ma momusawara wolio.\nYio teto ma lona'olo ma'o tio wau ma ilowolia lio u o'odito boito to talola'i lio, bolo uwa\nma'o lo talola'i lio mondali ma'o popobilohei pomai ta ukiki'a boito. Yio teto ma yilona'olo\ntimongolio dudulota ode bele li lo mbu'i Aminah. Wau to u ma yiledungga ma'o yito ma\nlotombilu ma'o timongolio uwalio mondali luwalopo mai ta ukiki'a boti wau deloa mai\nodia. Teto ma dilelo mai li lo mbu'i Aminah Nabiyullah saw. Bo tohuhama lo'u donggolo\npilo pohulia lio mai lo'u moonu ma bo motungengeta bolio, wau ma dilumumu lio mai lo"}, {"type": "transliteration", "text": "kaini ṣuf (kain wol) moputi u totibawa lio mola yito bo u dilomanga yidu, wau totonggade"}, {"type": "text", "text": "boito baya lo Nabiyullah yito malo laba2 lotutu motinela pohumaya mai ode bo'odelo\nhulala mopulu hui wau wopahui. Yio ma pilopo tilo2'io ma'o lo ta lola'i li lo Halimah baya\nlo Nabiyullah, wau tondahu lo u ma yilulahio mai mato lio mohualia lo ta ukiki'a boito, yio\nbo tinela ma bo timihulala. Yio ma yilayongolo mola akali li lo Halimah wolo akali lo ta\nlola'i lio. Yio bolo uwama'o lo ta lola'i lio tingga paladuma wu Halimah ta ukiki'a boti ta\ntolo pehumola wau boli tohilao. Bolo uwa ma'o li lo Halimah to ta lola'i lio uwalio; wolooli\nhuna lio olando to u mohama ma'o olo ta ukiki'a malo yatimu boti. Bolo uwa ma'o lo ta\nlola'i lio; delo bo hama lomai tio boti potala bolo ma pongohia lio mai lo Allah ta'ala"}, {"type": "text", "text": "barakati wolo riziki olando dudulota wau bolo ma posababua mai lo kohendaki lo Allah\nta'ala wau de EeEeya'olo."}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim 'alā sayyidinā muhammad"}, {"type": "text", "text": "Lotombilu tilo Halimah uwalio to'u tio yilohama ma'o to Nabiyullah yito tohuhama\nlo u dilalo otabu tutu lio wau wala'io yito malo ngohilaya'alo ma'o lohuyilio u dilalo\ntilimutu malo sambe ilopopolango ombongio. Teto ma piludu'io ma'o Nabiyullah boito ode\nbungolopalio, wau totonggade boito tilo Halimah mai laba2 lotutu molulupuhe u\nyilunduwalio boito bo ma pilopolotolai lo Allah ta'ala wau ma yilenggilo u mongongota\nwau bolo mealo u mo'otoduwo molulupuhe. Wau tomoomoli lio ma'o, ma pilopotangulio\nma'o lunggongo tutulio to tunggilo Nabiyullah. Yio ma lato yilumunetolomai tabu lotutu\nboito dilolotonga lo'u ma hetolohemola. Yio totonggade boito tilo Halimah ma\nyilo'odungohe suara tuwawu he motombilu uwalio: paladuma wu Halimah, tu'udu ta\nukiki'a boti wombu lo Hasyimu wau hepoluneta mai lotinelo mato lodulahe, wau hulala,\nwau ta ilotoli'angio to bangsalio Quraisy, wau paladuma wu Halimah tingga bo yi'o ta"}, {"type": "transliteration", "text": "lo'otoduwo wala'a bidurratil-yatīmah12malo wunula wau pu'ula."}, {"type": "arabic", "text": "اللهم صلx2  على محمدx3 والهx2 وصحبه وسلمx3"}, {"type": "transliteration", "text": "Allahumma ṣalli 2x 'alā Muhammad 3x wa ālihi 2x wa ṣahbihi wa sallam 3x (Jābu)."}, {"type": "translation", "text": "\"Ya Allah, curahkan salawat dan keselamatan buat Muhammad, para keluarganya dan para sahabatnya\"."}], "raw_line_count": 179}, {"id": 12, "name": "Sair Kedua Belas", "blocks": [{"type": "text", "text": "l. Sair kedua belas:"}, {"type": "arabic", "text": "تعلم لينه * الغصن القويم * ومن الطاف معناه النسيم *\nمليح لم يحز بشر حﻼه * فدل بانه بشر كريم *"}, {"type": "transliteration", "text": "Ta'allama līnuhu al-guṣnul-qawīm * wa min al-ṭāfi ma'nāhun-nasīm *\nMalīhun lam yahuz basyarun hulāh * fadalla bi annahu basyarun karīm *"}, {"type": "translation", "text": "\"Pelajari kelembutan dahan yang lurus; dan terhadap al-ṭāf;13 Tiupan angin sepoi-sepoi; indah tidak bisa dihalangi oleh manusia keindahannya; menunjukkan bahwa ia adalah manusia yang mulia\"."}, {"type": "arabic", "text": "محمد بشرx2 ﻻ كالبشر بل هو كالقوت بين الحجر"}, {"type": "transliteration", "text": "Muhammad basyar 2x lākal-basyar * bal huwa kal-yāqūti bainal-hajar."}, {"type": "translation", "text": "\"Muhammad adalah manusia; tidak seperti manusia, bahkan dia seperti batu delima (batu permata merah) di antara bebatuan\" (Jābu)."}, {"type": "footnote", "text": "12Durratil-yatiimah artinya mutiara yang sangat bagus (tidak ternilai harganya)."}, {"type": "footnote", "text": "13Al-thaaf adalah sesuatu yang terapung."}, {"type": "arabic", "text": "وسيم فى مﻼحته حشيم * وما فى الحسن قط له قسيم\nفما كل الشقاء سوى ﺟفاه * وليس سوى تواصله نعيم"}, {"type": "transliteration", "text": "Wasīmun fi malāhatihi hasyīm; wa mā fil-husni qaṭṭun lahu qasīm;\nFamā kullusy-syaqā'i siwā jafāh; wa laisa siwā tuwāṣulihi na'īm."}, {"type": "translation", "text": "\"Yang cantik merasa malu karena tidak disertai kebaikan sama sekali; tidak ada yang sia- sia muncul secara bersamaan; dan tidak ada yang secara bersamaan mendatangkan kebaikan\"."}, {"type": "arabic", "text": "اللهم صلx2 على محمد والهx2 وصحبه وسلم"}, {"type": "transliteration", "text": "Allhumma ṣalli 2x 'alā Muhammad wa ālihi 2x wa ṣahbihi wa sallim ."}, {"type": "translation", "text": "\"Wahai Tuhan, curahkan salawat dan keselamatan buat Muhammad, para keluarga dan sahabat- sahabatnya\" (Jābu)."}, {"type": "arabic", "text": "له فى طيبة اسنى مقام * لديه الخير اﺟمعه مقيم\nاذا غنى به حادى المطايا * رايت النوق من طرب تهيم"}, {"type": "transliteration", "text": "Lahu fi ṭaibatin asnā maqām; ladaihil-khairu ajma'ahu muqīm;\nIża ganā bihi hādil-maṭāya; ra'aitan-nūqa min ṭarabin tahīm."}, {"type": "translation", "text": "\"Dia memiliki kedudukan yang lebih tinggi dalam hal kebaikan; memiliki kebaikan yang lebih banyak; apabila ia berbernyanyi, engkau lihat penggiring unta betina kesayangan dari bangsa Tahim turun dari kenderaannya\"."}, {"type": "arabic", "text": "صﻼة ﷲ على الهادى محمد يارسول ﷲ شفيع الخلق فى يوم القيامة يا حبيب ﷲ"}, {"type": "transliteration", "text": "ṣalātul-lāhi 'alal-hādī Muhammad yā rasūlullāh;\nsyafī'ul-khalqi fi yaumil-qiyāmah yā habībal-lāh. (Jābu)"}, {"type": "translation", "text": "\"Semoga Allah mencurahkan salawat buat pemberi petunjuk yakni Muhammad Rasulullah; Pemberi syafa'at bagi makhluk pada hari kiamat, wahai kekasih Allah\"."}, {"type": "arabic", "text": "عليه صﻼة ﷲ فى كل يوم وشهر وكل دهر وتسليم"}, {"type": "transliteration", "text": "alaihi ṣalatul-lāhi fi kulli yaum, wa syahri wa kulli dahri wa taslīm. (Jābu, dan di dalam"}, {"type": "text", "text": "teks tertulis sahri diduga salah tulis). \"Semoga Allah mencurahkan salawat dan\nkeselamatan buat Muhammad setiap hari, setiap bulan dan sepanjang masa\"."}, {"type": "transliteration", "text": "(Sair kedua belas ini diselingi lima jābu)"}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه"}, {"type": "arabic", "text": "قالت حليمة فاخذته ودخلت به على اﻻصنام فنكس هبل رأسه وخرت اﻻصنام مــن اماكنهــا ف جئــت الــى الحجــر اﻻســود*\nﻻقبله فخرج الحجر من مكانه حتى التصق بوﺟهه صلى ﷲ عليه وسلم فاخبرت بعلى بذلك فقال الم اقــل لــك انــه مبــارك\nخذيه وانصر فى بنا قالت حليمة فما انصرف احد كماانصرفنا* وﻻ ظفر احد كما ظفرنا* قالت فركيت الدابة التى ﺟئــت\nعليها وكانت ضعيفة ﻻتستطيع المشي* فجعلت الدابة تسبق دواب القافلة كلها حتى كانت النساء يقلــن لــي امســكي اتانــك\nعنا ياحليمة* قالت وكنت ﻻامر على شجر وﻻ مدر اﻻ ويقول السﻼم عليك ياخير المرسلين *"}, {"type": "transliteration", "text": "Allhumma ṣalli wa sallim wa bārik 'alaih\nQālat halīmatu fa akhażtuhu wa dakhaltu bihi 'alal-aṣnāmi fanakkasa hubala ra'sahu wa\nkharratil-aṣnāmu min amākiniha faji'tu ilal-hajaril-aswad. Li uqabbilahu fakharajal-\nhajaru min makānihi hattal-taṣaqa biwajhihi ṣallal-lāhu 'alaihi wa sallama fa akhbartu\nba'lī biżālika fa qāla alam aqul laki annahu mubārakun khużīhi wanṣarifī binā qālat\nhalīmatu faman-ṣarafa ahadun kaman-ṣarafanā. Wa lā ẓafira ahadun kamā ẓafirnā. Qālat\nfa rakītud-dābbatal-latī ji'tu 'alaihā wa kānat ḍa'īfatan lā tastaṭī'ul-masyya. Fa ja'alatd-\ndābbtu tasbīqu dawābbal-qāfilati kullahā hattā kānatin-nisāu yaqulna lī amsikī atānaki"}, {"type": "translation", "text": "'annā yā halīmah. Qālat wa kuntu lā amurru 'alā syajarin walā mandarin illā wa yaqūlus- salāmu 'alaika yā khairal-mursalīn."}, {"type": "arabic", "text": "اللهم صل وسلم وبا هيلع كر\nوكنا ﻻننزل تحت شجرة يابسة اﻻ خضرت واثمرت لوقتها ببركته صلى ﷲ عليه وسلم فسرنا حتى اتينــا منازلنــا وعنــدنا\nشويهات عجاف ضعاف فاخذت يد محمد صلى ﷲ عليه وسلم ووضعتها عليهن فدررن لوقتهن ومنذ اخــذناه لــم يكــن لنــا\nمصباح فى الليالى المظلمة اﻻ نور وﺟهه صلى ﷲ عليه وسلم قالت حليمــة وكنــت اذا اعطيتــه ثــديي اﻻيمــن شــرب واذا\nحولته لثديي اﻻيسر ابى ﻻن ﷲ تبارك وتعالى الهمه العدل حتى فى الرضاعة* علــم ان لــه شــريكا فنــا صــفه عــدﻻ منــه\nصلى ﷲ عليه وسلم* قالت حليمة وانقطع الغيث عنا سنة كاملة من السنين فاخذ ناه وخرﺟنابه الى الصحراء وقلنــا اللهــم\nبحرمة هذا المولود* عليك اﻻ ما سقيتنا الغيث يا ربنا يا معبود* قالت فاذا السماء قد غيمت وسكبت ماء كافواه القرب *"}, {"type": "transliteration", "text": "Allhumma ṣalli wa sallim wa bārik 'alaih\nWa kunnā lā nanzilu tahta syajaratinn yābisatin illākh-ḍarrat wa aṡmarat liwaqtihā\nbibarakatihīṣallal-lāu 'alaihi wa sallam fasirnā hattā atainā manāzilanā wa 'indanā\nsyuwaihātun 'ijāfun ḍi'āfun fa akhażtu yada muhammadin ṣallal-lāhu 'alaihi wa sallama\nwa waḍa'tuhā 'alaihinna fa dararna liwaqtihinna wa munżu akhażnāhu lam yakun lanā\nmiṣbāhun fil-layālil-muẓlimati illā nūru wajhihīṣallal-lāhu 'alaihi wa sallama qālat\nhalīmatu wa kuntu iżā a'ṭaituhūṡadyil-aimana syariba wa iżā hawwaltuhū liṡadyil-aisara\nabā li annal-lāha tabāraka wa ta'āla alhamahul-'aḍa hattā fir-raḍā'ah. 'alima anna lahū\nsyarīkan fanāṣafahū 'aḍan minhu ṣallal-lāhu 'alaihi wa sallam. Qālat halīmatu\nwanqaṭa'al-gaiṡu 'annā sanatan kāmilatan minas-sinīna fa akhażnāhu wa kharajnā bihī\nilaṣ-ṣahrā'i wa qulnā allahumma bihurmati hażal-maulūd. 'alaika illā mā saqaitanāl-gaiṡa\nyā rabbanā yā ma'būd. Qālat fa iżās-samā'u qad gayyamat wa sakabat mā'an ka afwāhil-"}, {"type": "text", "text": "qirab."}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim 'alā sayyidinā muhammad"}, {"type": "text", "text": "Lotombilu tilo Halimah uwalio tio lohama ma'o to Nabiyullah wau ma dilelo lio\nma'o ode bele lo mbu'i, yio ma lolohubulu bu'i tanggulio Hubalu ta'uwa lio wau ma\nlopupulepelo bu'i ngopohiya lo tonulola bilulo'a lio, yio ma pilona'o lio lilo Halimah"}, {"type": "transliteration", "text": "Nabiyullah ode hajar aswad. Tu'udu tio mopodīla to Nabiyullah to hajar aswad, yio ma\nyilumalo lomai hajar aswad to dūtua lio dililotonga lo'u ma mai lodudunggaya wolo baya"}, {"type": "text", "text": "lo Rasulullah. Yio ma ma'o yilungguli lilo Halimah u 'o'odito boito to talola'i lio. Yio bolo\nuwa ma'o lo talola'i lio uwalio dama hepolele'umai olemu ta ukiki'a boti ta ma pongohiya\nlio mai lo Eya iloma olando dudulota, yio delo bo hamalomai tio boti wau delowalo mai\nmohuwalinga ma tutuwawu ma'o wolando. Lotombilu tilo Halimah uwalio wonu odito\ndiyalu ngota ma'o ta ilodudelo to'u ma lohuwalinga ode lo'u ma dilelomai lohuwalinga\nbotiya. Wau olo diyalu ma'o ngota ta lo'otoduwo u ilundungi odelo ilundungi lami. Poli\nlotombilu tilo Halimah uwalio tomulolo lio u tila'eya lio boito ma'o laba2 lotutu\nmolulupuhe wau dilalo boti mo'owali moona'o bo totonggade u tio ma lohuwalinga yito,"}, {"type": "transliteration", "text": "ma  lo'owali lona'o u tila'eya lio boito wau ma lemulolo lo totonulola u ta'eya mo'a'āmilala\ndilolotonga lo owwoluwo lomongobuwa mo'a'āmilala boito ma hepotombiluwa mai oli"}, {"type": "text", "text": "Halimah uwalio tohetimu po'olo u tila'eyamu boti ma bolo tetetete'a. Lotombilu tilo"}, {"type": "transliteration", "text": "Halimah uwalio to owwoluwo'u botiya de dīla ta yilumawodu bungo lo ayu meyalo botu\ndelo bo ma hepotombiluwa mai lo'u assalamu 'alaika yā khairal-mursalīn, ta ilo2piyohe lo"}, {"type": "text", "text": "tonulola ta ilahula."}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim 'alā sayyidinā muhammad\nWau to owwoluwo lilo Halimah yito de dīla ta yilohuheli ma'o to bungo lo ayu"}, {"type": "text", "text": "eleponu boli mohengu delo bo ma lomi2yodu lomola wau ma hungo2 lomola saba2bu lo\nbarakati boito tu'udu ilomata lo Nabiyullah saw. Yio teto ma tilonggona'olo timongolio\ndilolotonga lo'u ma ledungga ma'o ode tonulola bilulo'a limongolio, wau to owwoluwo\nlimongolio boito titihede ma'o wolami o batade dadatala, wau ma bolo hengongotala wau\nhilulupuhela. Yio teto ma hilama ma'o lilo Halimah olu'u lo Nabiyullah wau ma\npilopoteyapu lio ma'o du'ola to tonulola ta'u lo batade boito. Yio teto ma iloponu ma'o lo\nAllah ta'ala wolo u ma lolotololo mola batade boito, wau ma lolinggahulo mola. Poli"}, {"type": "transliteration", "text": "lotombilu tilo Halimah uwalio tuhuhewo lo'u tio lohama ma'o to Nabiyullah yito, dīla lo ta"}, {"type": "text", "text": "lototoheya lotohe biasa totonggadu uhui modi'oloma wau motondoyo'oma, yio bo ma\nlongatalo lo tinelo baya lo Rasulullah saw. Wau to owwoluwo lilo Halimah ma lohama\nma'o tutulio mambahu olowalalio, wau ma pilopotutulio ma'o to Rasulullah. Yio ma\ntilutulio poli yilimbatio ma'o ode tutulio mambahu oloyihilio, yi bo pilalingio tutu boito"}, {"type": "transliteration", "text": "tu'udu Allah tabāraka wa ta'ala ta lohehulai lo'i palinga'o tutu boito, wau delo ma otawalio\nlo Rasulullah tutu boito ma pilodūlude lo ta ngopohiya, wau ma uyitolo u ma"}, {"type": "text", "text": "pilohehulamai lo Allah ta'ala tutu boito. Poli lotombilu tilo Halimah uwalio yiloluwo olami\nma lohuhumbuta lomai tawunu boito ma ilodungga lopongonuwa tu'udu u dilalo ilo\ndehuwa lo didi eleponu pe'enda ma'o. Yio ma hilama ma'o limongolio Nabiyullah, wau ma\npiloluwalio ma'o ode u pade2nga wau ma hetombiluwo lio mola uwalio wu Eya'u ta\nohu'uwo lo'u tubola tuhatuhata wolo hurumati lo ta ukiki'a boti, wau oponuwamai lo didi"}, {"type": "text", "text": "ami yatia. Teto lotombilu ta ohu'uwo lo wungguli botiya uwalio ma dilumepuhulo mai\nhulunga wolo u ma lodehu mai didi humaya mai odelo u he lumuwalai to ta'u lo bunggo\nhemodehu to walita mohengu."}, {"type": "arabic", "text": "ﷲ ﷲ ﷲ حي ﷲ ﷲ ﷲ ﷲ حي ﷲ حي ﷲ ﷲ ﷲ\nحي ﷲ يا صاحب الصلى سﻼم على"}, {"type": "text", "text": "Allah Allah Allah hay Allah Allah Allah Allah hay Allah hay Allah Allah Allah hay Allah"}, {"type": "transliteration", "text": "yāṣāhibuṣ-ṣallā salāmun 'alā (Jābu, ṣāhibuṣ-ṣalla artinya pemilik salawat, dan kata hay di\ndalam jābu ini hanya tambahan)"}], "raw_line_count": 132}, {"id": 13, "name": "Sair Ketiga Belas", "blocks": [{"type": "text", "text": "m. Sair ketiga belas:"}, {"type": "arabic", "text": "من مثل احمد فى الكونين نهواه * بدرﺟميع الورى فى حسنه تاهوا\nمن مثله واله العرش شرفه * بالخلق والخلق ان ﷲ اعطاه *"}, {"type": "transliteration", "text": "Man miṡlu ahmada fil-kaunaini nahwāh; badrun jamī'ul-warā fī husnihi tāhu;\nMan miṡluhū wa ilāhul-'arsyi syarrafah; bil-khulqi wal-khulqi innal-lāha a'ṭāh;"}, {"type": "translation", "text": "\"Siapa yang menyerupainya dalam hal pujian di dunia dan akhirat; Semua orang bingungmelihat kebaikannya; Siapa yang menyerupainya dan Tuhan 'arasy memuliakannya; Sesungguhnya Allah telah memberikannya luar dalam (penampilan dan akhlak)\"."}, {"type": "arabic", "text": "يا سيد يا رسول ﷲx2 خذ بيد ماليس لى توكلت اﻻ اﻻحد"}, {"type": "transliteration", "text": "Yā sayyidi yā rasulullah khuż bi yadi mā laisa lī tawakkaltu illal-ahad. (Jābu)"}, {"type": "translation", "text": "\"Wahai yang mulia, wahai Rasulullah 2x berpeganglah, aku tidak bertawakkal kecuali kepada yang satu (Allah)\""}, {"type": "arabic", "text": "والشمس تخجل من انوار طلعته * حارت عقول الورىفى وصف معناه\nتبارك ﷲ ما احلى شمائله * حازالجمال فما ابهى محياه *"}, {"type": "transliteration", "text": "Wasy-syamsu takhjalu min anwāri ṭal'atih; hārat 'uqūlul-warā fi waṣfi ma'nāh.Tabārakal-\nlāhu mā ahlā syamāilahu; hāzal-jamāla famā abhā muhayyāh."}, {"type": "translation", "text": "\"Cahaya matahari tersipu-sipu pada saat terbit; akal orang-orang tercengang dalam menggambarkan jati dirinya. Semoga Allah memberkati orang-orang yang cendrung kepada hal-hal yang lebih indah, memiliki kecantikan, dan kehidupanyang lebih elok\"."}, {"type": "arabic", "text": "ﷲ ﷲ ﷲ ربنا * ﷲ ﷲ ﷲ حسبنا صلوة على النبيx2 وسلم على خير الرسول"}, {"type": "transliteration", "text": "Allah Allah Allah rabbunā; Allah Allah Allah hasbunā; ṣalawātu 'alan-nabiyyi 2x; wa\nsallim 'alā khairir- rasūl . (Jābu)"}, {"type": "translation", "text": "\"Allah Allah Allah tuhan kami; Allah Allah Allah yang mencukupkan kami; Salawat buat Nabi 2x dan sejahtera atas sebaik-baik rasul\"."}, {"type": "arabic", "text": "يا عرب وادى النقا يا اهل كاظمة * فى حبكم قمر فى القلب مأواه\nهذا مليح وكل الناس يهواه * وسائر الخلق فى اوصافه تاهوا *"}, {"type": "transliteration", "text": "Yā 'urba wādin-nuqā yā ahla kāẓimah; fi hubbikum qamarun fil-qalbi ma'wāh;Haża\nmalīhun wa kullun-nāsi yahwāh; wa sāirul-khalqi fi auṣāfihi tāhu;"}, {"type": "translation", "text": "\"Wahai orang Arab yang cinta kebersihan; wahai ahlu kāẓimah; Bulan yang kamu cintai tempatnya di dalam hati; Ini adalah kecantikan dan setiap manusia sangat menyukainya; Dan semua makhluk kehilangan akal dalam menggambarkan sifat-sifatnya\"."}, {"type": "arabic", "text": "ابراهيم الخليل ﷲx2 موسى كﻼم ﷲ عيسى وروح ﷲx2 محمد رسول ﷲ"}, {"type": "transliteration", "text": "Ibrahīma al-khalīlul-lāh 2x mūsā kalāmul-lāh 'īsā wa rūhul-lāh 2x Muhammadun\nrasulullah. (Jābu)"}, {"type": "arabic", "text": "اﻻرض ثم السماء متفاخرن به * يا قوم هذا النبي ما احسن محياه\nالطيب والمسك والكافور من عرقه *العلم والفضل وتنبيه من فاه *"}, {"type": "transliteration", "text": "Al-arḍu ṡummas-samā'u mutafākhirna bih; yā qaumu hażan-nabiyyu mā ahsana\nmuhayyāh; aṭ-ṭayyibu wal-misku wal-kāfūru min 'araqih; al-ilmu wal-faḍlu wa tanbīhi\nman fāh."}, {"type": "translation", "text": "\"Bumi dan langit bertolak belakang; wahai kaum, alangkah bagus kehidupan Nabi ini; Wangi-wangian, minyak kesturi, dan kapur barus tergantung padapokok (akar)nya; Ilmu, keutamaan dan kemuliaan tergantung pada yang berbicara\"."}, {"type": "arabic", "text": "صلى ﷲ على المدن محمد شفيعنا * ماغرة على الفضل قمري على اﻻكسر"}, {"type": "transliteration", "text": "ṣallal-lāhu 'alal-madani muhammadin syafī'unā; mā garrat 'alāl-faḍli qumuriya 'alal\niksari.(Jābu)"}, {"type": "translation", "text": "\"Semoga Allah mencurahkan salawat kepadagudang ilmu; Muhammad yang memberikan syafa’at kepada kami, memberikan keutamaan baik kepada hamba laki-laki maupun perempuan, seperti bulan purnama di atas logam mulia”"}, {"type": "arabic", "text": "قومه اﻻلف والميم مبسمه * والنون حاﺟبه والصاد عيناه *\nصلى عليه اله العرش ما طلعت * شمس وما حثحث الحادي مطاياه *"}, {"type": "transliteration", "text": "Qaumuhū al-alif wal-mīmu mubsamah; wan-nūnu hājibuhu, waṣ-ṣād 'aināh; ṣalla 'alaihi\nilāhul-'arsyi māṭala'at; syamsun wa mā hatṣaṡal-hādī maṭāyāh;"}, {"type": "translation", "text": "\"Mulutnya alif, mim senyumnya; nun keningnya, dan ṣad matanya; Semoga Tuhan 'arasy mencurahkan salawat buat matahari yang terbit, dan orang yang bergerak menggiring unta sambil berdendang di atas tunggangannya\". (Sair ketiga belas ini diselingi lima jābu)"}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nقالت حليمة فما زال عندى حتى يسر ﷲ علي الخيرات والبركات والسعادات بركته صلى ﷲ عليه وسلم * ثم انــه خــر ج\nيوما مع اخيخ ضمرة يرعيان غنما لنا حول بيوتنا فبينما انا كذلك اذ بابنى ضمرة يعدو وقد عــﻼه صــفرة وهــو ينــادى يــا\nاماه الحقي اخى محمد * فما اظنك تجدينه اﻻ مقتوﻻ اعاذه ﷲ من ذلك قالت حليمة فاسرعنا فاذا هو شاخص ببصره الــى\nالسماء* فلما راني تبسم ضاحكا فضممته الى صدرى وقبلت بين عينيه فقلت له حبيبــي فــدتك نفســى ماالذىاصــابك يــابني\nفقال لها ﺟاءنى ثلثة نفر فاخبرها انهم شقوا صدرى واخرﺟوا قلبي وغسلوه وردوه الى مكانــه والتــأم صــدري بقــدرة ﷲ\nسبحانه وتعالى من غير الم *"}, {"type": "transliteration", "text": "Allhumma ṣalli wa sallim wa bārik 'alaih\nQālat halīmatu famā zāla 'indī hattā yassaral-lāhu 'alayyal-khairāti wal-barakāti was-\nsa'ādātibi barakatihīṣallal-lāhu 'alaihi wa sallam. ṡumma annahu kharaja yauma ma'a\nakhīhi ḍamrata yar'ayāni ganaman lanā haula buyūtina fabainamā ana każālika iż\nbibnīḍamrata ya'dū waqad 'alāhu ṣufratun wa huwa yunādī yā ummāhu alhiqī akhī\nmuhammad. Famā aẓunnaka tajidīnahu illā maqtūlan a'āżahul-lāhu min żalika qālat\nhalīmatu fa asra'nā fa iżā huwa syākhiṣun bi baṣarihī ilas-samā'. Falammā ra'ānī\ntabassama ḍāhikan fa ḍamamtuhū  ilāṣadrī wa qabbaltu baina 'ainaihi faqultu lahu habībī\nfadatka nafsī mal-lażī aṣābaka yā bunayya fa qāla lahā jā'anīṡalāṡatu nafarin fa\nakhbarahā annahum syaqqūṣadrī wa akhrajū qalbī wa gasalūhu wa raddūhu ilā makānihī\nwal-ta'ama ṣadrī bi qudratil-lāhi subhānahu wa ta'āla min gairi alam.\nAllhumma ṣalli wa sallim 'alā sayyidinā muhammad"}, {"type": "text", "text": "Lotombilu tilo Halimah uwalio ma lailaita ponu lo Allah ta'ala wolo tonulola ilomata lo\nNabiyullah saw. Tomoomolilio ma'o Nabiyullah ma yilumuwalai to dulahe ma ma'o\nmolami mai batade to tihedio ma'o lo bele limongolio. Yio teto dipo ode ma ngoolo"}, {"type": "transliteration", "text": "hihewolio debolo ma dungga dungga mai te ḍamrati tohuhama lo'u motapi tapiyata\nbayalio, wau ma mai wuwa2ti'a uwalio; wu māma Halimah ma'o lolohepo mai wutatu'u ti"}, {"type": "text", "text": "Muhammadi dila bo ma'o tolo wandobe lo'u ma yilate meyalo pilate lo tau. Teto tilo\nHalimah yito bolo lotihululungolo mola ode Allah ta'ala wau ma bolo tete2olo ma'o tio\ndebolo totonggade boito ma ma'o ilodunggalio Nabiyullah bo ma'o tihu-tihula to dalala"}, {"type": "transliteration", "text": "wau matolio yito bo bilo2he mola ode yitāta. Teto to'u ma dilehulio mai matolio, yio ma\nilondongalio ma'o tīlolio tilo Halimah. Teto tio bo ilimiyoma wau tilalahehe. Teto ma mota"}, {"type": "text", "text": "dilumumulio wau ma dile'upiyolo mola duhelio, wau ma hetombiluolio ma'o lo'u wu\nwala'u2 buloto batanga'u tinelo mato'u wau hungo lo hila'u malo tita uti ta mai longarnaya\nolemu boti. Teto bolo uwa ma'o lo Nabiyullah watia botia bo ilodungga mai lo ta towulota"}, {"type": "text", "text": "wau ma mai biluta'io duhelo watia wau ma yilu'ala'o limongolio tuwango duhelo watia\nlapata'o ma ma'o bilobo'a limongolio tuwango duhelo watia, wau tomoomolilio ma'o delo\nbo pilohuwalingio ma'o ode dutuwalio odelo umulomulolo, wau ma yilohuhe'utalo duhelo"}, {"type": "transliteration", "text": "watia wau okokawasa lo Allah ta'ala u dīla lo otoduwo u mongongota wau boli meyalo"}, {"type": "text", "text": "mopopolota."}, {"type": "arabic", "text": "ﷲ ﷲ واحدالجﻼل ﷲ ﷲ واحد الجﻼل ﷲ استغفر قبل اﻻﺟل"}, {"type": "transliteration", "text": "Allah Allah wāhidul-jalāl Allah Allah wāhidul-jalāl; astagfar qablal-ajali"}, {"type": "translation", "text": "\"Allah Allah satu-satunya yang memiliki keagungan, aku mohon ampun sebelum ajal (Jābu)."}], "raw_line_count": 98}, {"id": 14, "name": "Sair Keempat Belas", "blocks": [{"type": "text", "text": "n. Sair keempat belas:"}, {"type": "arabic", "text": "يا مولدا قد حوى عزا واقباﻻ * بوصله يبلغ المشتاق اماﻻ\nيا مدعى الحب فيه وهو ذووله * وفى هواه ﺟفا اهﻼ واطﻼﻻ*"}, {"type": "transliteration", "text": "Yā maulidan qad hawā 'izzan wa iqbālan; bi waṣlihi yablugul-musytāqu āmāla; yā\nmudda'il-hubbi fīhi wa huwa żū walah; wa fī hawāhu jafā ahlan wa aṭlāla."}, {"type": "translation", "text": "\"Wahai hari kelahiran yang mulia, penyambutan disertai rasa rindu sudah berkumpul menunggu tibanya orang yang diharapkan. Wahai yang mengajak kepada cinta, dia ragu dalam cintanya, dan kecintaannya sudah sia-sia dan menemui puing-puing reruntuhan\"."}, {"type": "arabic", "text": "ﷲ حي ﷲ ﷲ ﷲ ﷲ حي ﷲ ﷲ ﷲ محمد رسول ﷲ محمد حبيب ﷲ"}, {"type": "text", "text": "Allah ya Allah Allah Allah Allah ya Allah Allah Allah;muhammadun rasulullah"}, {"type": "transliteration", "text": "muhammadun habībullah; (Jābu)"}, {"type": "arabic", "text": "ان كنت تعشقه مت فى محبته * موله القلب مشتاق واﻻﻻ\nالنوق تعشقه وﺟدا وتقصده * شوقا وتطلب من رؤياه اﺟﻼﻻ *"}, {"type": "transliteration", "text": "In kunta ta'syaquhu mut fī mahabbatih; muwallahul-qalbu musytāqun wa illā lā;\nAn-nūqu ta'syaqahū wajadan wa taqṣiduh; syauqan wa taṭlubu min ru'yāhu ijlāla."}, {"type": "translation", "text": "\"Jika engkau mencintainya, matilah pada kecintaannya; Hati yang sedih menjadi rindu, dan tidak terkecuali unta betina yang merindukan dan menghendakinya; rindu dan meminta untuk melihat keagungannya\"."}, {"type": "arabic", "text": "صلوا على نور فاطمة صلوا على نور فاطمة احي  رسولx2 على المصطفى محبوبنا"}, {"type": "transliteration", "text": "ṣallū 'alā nūri fāṭimah ṣallū 'alā nūri fāṭimah ahay rasūli 2x 'alal-muṣṭafā mahbūbanā\n(Jābu)."}, {"type": "translation", "text": "\"Bersalawatlah kamu buat cahaya Fatimah, bersalawatlah kamu buat cahaya Fatimah, buat Rasul 2x, bersalawat buat yang terpelihara kekasih kita\" (Kata احــي hanya tambahan)."}, {"type": "arabic", "text": "اما تراها اذا ﻻ حت قباب قبا * تحط عنها حداة العيس اثقاﻻ\nمشتاقة عشقت من ﻻشبيه له * يقطع الشوق منها فيه اوصاﻻ *"}, {"type": "transliteration", "text": "Amā tarāhā iża lā hat qibābu qubā; tahuṭṭu 'anhā hudātul-'aisi aṡqāla;\nMusytāqatan 'asyiqat man lā syabīha lah; yuqaṭṭi'usy-syauqa minhā fīhi auṣāla."}, {"type": "translation", "text": "\"Ketika atap kuba bersinar, engkau melihat semangat penyanyi akan turun karena rasa cinta yang berat muncul tidak ada yang menyerupainya, menghancurkan rasa rindu semua anggota yang terdapat di dalamnya\"."}, {"type": "arabic", "text": "ﷲ ﷲ واحدالجﻼلx2 ﷲ ﷲ ﺟد لنا كرامة"}, {"type": "transliteration", "text": "Allah Allah wāhidul-jalāli2x Allah Allah juḍanā karamah (Jābu )."}, {"type": "translation", "text": "\"Allah Allah Dia sendiri yang memiliki keagungan, Allah Allah yang limpahkan kami kemuliaan \"."}, {"type": "arabic", "text": "اياك والعذل من فى الكون يشبهه * قد فاق فى الحسن اشكاﻻ وامثاﻻ\nانجئت بان النقا اوﺟئت مربعه *فحط يا حادي اﻻضعان احماﻻ *"}, {"type": "transliteration", "text": "Iyyāka wal-'azla man fil-kauni yusybihuh; qad fāqa fil-hasani asykālan wa amṡāla; in ji'ta\nbānan-nuqā aw ji'ta marba'ahh; fahuṭṭu yā hādiyal-aḍ'āni ahmāla."}, {"type": "translation", "text": "\"Siapa yang menyerupainya di alam ini; dia memiliki kelebihan dalam segala bentuk kebaikan dan teladan; jika engkau mendatangi tempat tinggalnya, nampak bersih, orang yang menggiring unta turun dengan bawaannya\"."}, {"type": "arabic", "text": "ﷲ ﷲ ﷲ ربنا ﷲ ﷲ ﷲ حسبنا صلوة على النبيx2 وسلم صديقمولى"}, {"type": "transliteration", "text": "Allah Allah Allah rabbunā Allah Allah Allah hasbunāṣalawatu 'alan-nabiyyi 2x wa\nsallama ṣiddiqi maulā (Jābu, )."}, {"type": "translation", "text": "\"Allah Allah Allah tuhan kami, Allah Allah Allah yang memuliakan kami, salawat buat Nabi dan keselamatan buat penghulu yang benar\"."}, {"type": "arabic", "text": "ضاع الزمان ولم انظر منازله * وما رأيت بذاك الشعب اطﻼﻻ\nذنبي يقيدني والصد يقعدني * وقد حملت من اﻻوزار اثقاﻻ *"}, {"type": "transliteration", "text": "ḍā'az-zamānu walam anẓur manāzilah; wamā ra'aitu biżālikasy-syi'bi aṭlāla;żanbī\nyuqayyidunī waṣ-ṣaddu yuq'idunī; waqad hamaltu minal-auzāri aṡqāla."}, {"type": "translation", "text": "\"Waktu telah berlalu, dan aku belum melihat rumahnya; karena itu aku tidak melihat orang-orang di dalam rumah; dosaku akan dicatat untukku dan penghalang akan didirikan untukku; dan aku telah memikul berat sebagian dosa-dosaku\"."}, {"type": "arabic", "text": "صﻼة من المولى عﻼمة هوالفضل من له نور فوق على الشمس"}, {"type": "transliteration", "text": "ṣalātu minal-maulā, ‘alāmātuhuwal-faḍlu, mallahu nūru, fauqa 'alasy-syamsi ."}, {"type": "translation", "text": "\"Salawat dari penghulu (Nabi), pertanda dia memiliki keutamaan, dan cahaya yang lebih utama daripada matahari\". (Jābu)"}, {"type": "arabic", "text": "لكنني فى غد ارﺟوه يشفع لي * وحسن ظنى بخير الخلق مازاﻻ\nوقد لجونا الى باب الكريم ومن * يلجو اليه يرى رحبا واقباﻻ *"}, {"type": "transliteration", "text": "Lākinnī fī gadin arjūhu yasyfa'u lī; wa husnu ẓannī bikhairil-khalqi māzāla;\nWaqad lajaunā ilā bābil-karīmi waman; yaljū ilaihi yarā ruhban wa iqbāla;"}, {"type": "translation", "text": "\"Aku mengharapkan padanya di hari esok memberikan syafaat bagiku, dan senantiasa bersangka baik terhadap sebaik-baik makhluk; dan melindungi kami ke pintu yang mulia, melindungi dan menyambut kami dengan leluasa\"."}, {"type": "arabic", "text": "يا حييا قيومx2 احي القلوب تحيا واصلح لناx2اﻻعمال فى الدين والدنيا"}, {"type": "transliteration", "text": "Yā hayyun yā qayyum 2x ahyal- qulubi tuhiya, wa aṣlih lanā2x al-a'māl fid-dīni wad-"}, {"type": "text", "text": "dunya. \"Wahai Tuhan yang hidup, wahai Tuhan yang Maha Mandiri, hidupkan jiwa kami,\ndan berilah kami kebaikan dalam menjalankan amalan-amalan baik dalam agama maupun"}, {"type": "transliteration", "text": "hidup di dunia"}, {"type": "translation", "text": "\". (Jābu)"}, {"type": "arabic", "text": "بحقه يا الهى ﺟد لنا كرما * بالعفو والصفح اكراما واﺟﻼﻻ\nهو النبي الذى طاب الوﺟود به * وفيه خالفت لواما وعذاﻻ *"}, {"type": "transliteration", "text": "Bihaqqihī yā ilāhī juḍanā karamā; bil-'afwi waṣ-ṣafhi ikrāman  wa ijlāla;\nHuwan-nabiyyul-lażīṭalabal-wujūdu bih; wa fīhi khālaftu luwwaman wa 'użżālan."}, {"type": "translation", "text": "\"Wahai Tuhanku, berikanlah kemuliaan kepada kami dengan sebenar-benarnya, dengan ampunan dan kemaafan, kemuliaan dan keagungan. Dia Nabi yang terdapat padanya kebaikan, dan di dalam dirinya tidak terdapat cacat dan cela\"."}, {"type": "arabic", "text": "صلى ﷲ على المدن محمد شفيعنا ما غرت على الفضل قمري على اﻻكسر"}, {"type": "transliteration", "text": "ṣallal-lāhu 'alal-madani muhammadi syafī'unā; mā garāt 'alal-faḍli, qumriya 'alal-iksar."}, {"type": "text", "text": "“Semoga Alah mencurahkan salawat buat gudang ilmu, Muhammad pemberi syafa'at\nkepada kita, memberikan keutamaan baik kepada hamba laki-laki maupun perempuan,"}, {"type": "transliteration", "text": "seperti bulan purnama di atas logam mulia” (Jābu)."}, {"type": "arabic", "text": "صلى عليه اله العرش ثم على * اله والصحب ابادا وازاﻻ"}, {"type": "transliteration", "text": "ṣallā 'alaihi ilāhul-'arsyi ṡumma 'alā; ālihi waṣ-ṣahbi ābādan wa āzāla."}, {"type": "translation", "text": "\"Semoga Tuhan 'arasy mencurahkan salawat buat beliau, keluarganya, dan sahabat- sahabatnya tiada terhingga untuk selama-lamaya\". (Sair keempat belas ini diselingi delapan jābu)"}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nوسماه رب العالمين محمد * على وصفه المحمود * وهو به يدري وما غسلت اﻻمﻼك من بطنه اذا ولكنهم زادوه طهــرا\nعلى طهر * فهو اعظم اﻻنبياء قدرا واكبرهم همة  وفخرا * لوﻻه ما خلق ﷲ ملكا وﻻ ادار فلكا وﻻ اطلع بدرا * اسرى\nبه اليه فى الظﻼم ليخصه بنيل المرام * فسبحان الذى اسرى به ليلة اﻻسراء وخاطبه بلسان انسه * على بســاط قدســه *\nفاوحى اليه منه سرا وﺟهرا صلى ﷲ عليه وسلم وعلى اله واصحابه سادات الدنيا وملوك اﻻخرى"}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim wa bārik a'alaih.\nWa sammāhu rabbul-'ālamīna muhammad. 'alā waṣfihil-mahmūd. Wa huwa bihī yadrī\nwamā gasalatil-amlāku min baṭnihī ażan wa lākinnahum zādūhu ṭuhran 'alāṭuhrin.\nFahuwa a'ẓamul-anbiyāi qadran wa akbaruhum himmatan wa fakhran. Laulāhu mā\nkhalaqal-lāhu malakan wa lā adāra falakan wa lā aṭla'a badra. Asrā bihī ilaihi fiẓ-ẓalāmi\nliyakhuṣṣahu binailil-marām. Fa subhānal-lażī asrā bihī lailatal-isrāi wa khāṭabahū bi\nlisāni unsih. 'alā bisāṭi qudsih. Fa auhā ilaihi minhu sirran wa jahran ṣallal-lāhu 'alaihi\nwa sallama wa 'alāālihi wa aṣhābihī sādātid-dunyā wa mulūkil-ukhra.\nAllahumma ṣalli wa sallim 'alā sayyidina muhammad\nWau mā tilanggulalio ma'o tio Eya lo tonulola alamu mo'ā'amilala lo tanggula Muhammad."}, {"type": "text", "text": "Du'ola to sifatilio odewowa. Wau tio2lo Eya ta laba2 lotutu molanggata wau boli motota."}, {"type": "transliteration", "text": "Wau diyalu u ma'o pilomubo'a lo malaikati tuwango duhelio yito dīla bo karna de'i, bo"}, {"type": "text", "text": "timongolio malaikati yito bo mai loduhenga u molamahe boli toyitato u molamahe. Wau"}, {"type": "transliteration", "text": "tio2lo Nabiyullah ma pilongilabotio mai to nabi-nabi yala mo'ā'amilala, wau ma laba2\nlotutu uda2'a ilo undungilio wau e'eetilio wolo u bubuhelilio, wau wonu de'u dīla tio dila\npilopoali mai lo Allah ta'ala tonulola malaikati, wau dīla loali helilia wau dīla yilumuneta"}, {"type": "text", "text": "olo mato lodulahe wau hulala pilona'oalio ode bilulo'a modi'oloma wau motondoyo'oma\ntu'udu u ma tilandulio mai tio ta tunggula mola ode bilulo'a ma laba2 lotutu molanggata\nwau boli molamahe.\nEya longohi mai dalala olio tohui lo'u mola pilome'erajialio, wau mola pilolo'iyalio\nmai wolo Allah ta'ala bolo meyalo bahasa molamahe. Mola pilololimoalio mai tutuwau\ntowombata molamahe. Wau ma yiluasialio mai lo Allah ta'ala tio lo'u ma bolo diladatala\nrahasia londo olio, wolo u baya2he wau pilomonu mai lo Allah ta'ala paladio du'ola to\nNabiyulllah wolo ongongala'alio wolo tonulola hihilingalio,wau ma loali ta'uwa tio\ntodelomo dunia wau olongia tio to lipu lo akhirati."}, {"type": "arabic", "text": "يا سيد يا رسول ﷲ خذ بيدx2 ما ليس لى توكلت اﻻ اﻻحد"}, {"type": "transliteration", "text": "Yā sayyidi yā rasūlullah khuż biyadi 2x mālaisa lī tawakkaltu 3x illal-ahad. Wahai tuan,\nwahai Rasulullah tidak ada tempat aku bertawakkal kecuali kepada yang satu. (Jābu)"}], "raw_line_count": 122}, {"id": 15, "name": "Sair Kelima Belas", "blocks": [{"type": "text", "text": "o. Sair kelima belas:"}, {"type": "arabic", "text": "موﻻيصل وسلم دائما دهرا على الحبيب على فوق العلى وسرا"}, {"type": "transliteration", "text": "Maulā ya ṣalli wa sallim dā'iman dahran; 'alal-habībi 'alā fauqil-'ulā wa sarā."}, {"type": "translation", "text": "\"Semoga salawat dan keselamatan tercurah sepanjang masa buat penghuluku; dan buat kekasih yang memiliki rahasia dan menempati tempat yang tinggi\"."}, {"type": "arabic", "text": "صلى اﻻله على النور الذى ظهرا * لنا بشهر ربيع اﻻول اشتهرا\nاضاءت اﻻرض نورا يوم مولده * واصبح الكون من انفاسه عطرا *"}, {"type": "transliteration", "text": "ṣallal-ilāhu 'alan-nūril-lażīẓahara; lanā bi syahri rabī'il-awwalisy-tahara;\nAḍā'atil-arḍu nūran yauma maulidih; wa aṣbahal-kaunu min anfāsihi 'aṭira;"}, {"type": "translation", "text": "\"Semoga tuhan mencurahkan salawat kepada cahaya yang telah menampakkan kepada kita pada bulan Rabi'ul-awal yang termasyhur; bumi telah terang dengan cahaya pada hari kelahirannya; dan dengan nafas-nafasnya jagat menjadi harum\"."}, {"type": "arabic", "text": "ﷲ ﷲ ﷲ ربنا ﷲ ﷲ ﷲ حسبنا صلوة على النبيx2 وسلم صديق مولى"}, {"type": "transliteration", "text": "Allah Allah Allah rabbunā. Allah Allah Allah hasbunā;ṣalawāti 'alan-nabiyyi 2x wa\nsallimṣiddīq maulā. (Jābu) ”Allah Allah Allah Tuhan kami, Allah Allah Allah yang"}, {"type": "text", "text": "mencukupkan kami, salawat dan kesentosaan buat Nabi 2x, penghulu yang benar”."}, {"type": "arabic", "text": "هو الذي نارت الدنيا بطلعته * وسره  فى قلوب العارفين سرا\nمن بطن امنة للعالمين بدا * مولود حسن سناه يخجل القمرا *"}, {"type": "transliteration", "text": "Huwal-lażī nāratid-dunyā bi ṭal'atih; wa sirruhū fī qulūbil-'ārifīna sara;\nMin baṭni āminatin lil-'ālamīna bada; maulūdu husni sanāhu yukhjilul-qamara."}, {"type": "translation", "text": "\"Kemunculannya membuat dunia bersinar, dan rahasianya terdapat di dalam hati orang- orang arif (pintar); dia telah nyata keluar dari rahim Aminah untuk semua alam, lahir dengan kebaikan, cahayanya membuat matahari tersipu-sipu\"."}, {"type": "arabic", "text": "نور ﷲ نور محمد اول الزمان يا رسول ﷲ يا حبيب ﷲ اخر الزمان"}, {"type": "transliteration", "text": "Nūrul-lāhi nūru muhammad,awwaluz-zamān yā rasulallah, yā habībal-lāh;"}, {"type": "transliteration", "text": "ākhiriz-zamān (Jābu) ."}, {"type": "translation", "text": "\"Nur Allah nur Muhammad pada awal zaman, wahai Rasulullah, wahai kekasih Allah pada akhir zaman\"."}, {"type": "arabic", "text": "ﺟاءت مﻼئكة الرحمن تشهده * كيما تمتع من انوار النظرا\nطافوا به اﻻرض واﻻكوان اﺟمعها * ليشهد الناس سرا كان مستترا *"}, {"type": "transliteration", "text": "Jā'at malāikatur-rahmāni tasyhad; kaimā tumatti'a min anwārihin-naẓara;\nṭāfū bihil-arḍa wal-akwāna ajma'ahā; liyasyhadan-nāsu sirran kāna mustatira."}, {"type": "translation", "text": "\"Malaikat yang pengasih datang menyaksikannya; untuk menikmati dan melihat cahaya- cahayanya; mereka berkumpul mengelilingi bumi dan alam, agar manusia menyaksikan rahasia yang tersembunyi\"."}, {"type": "arabic", "text": "ﷲ ﷲ ﷲ ﷲ ﷲ يا رحمن يا رحيم* ﷲ ﷲ ﷲ ﷲ ﷲ سبحان ﷲ استغفر"}, {"type": "transliteration", "text": "Allah Alah Allah Allah Allah yā rahmān; Allah yā rahīm;\nAllah Allah Allah Allah Allah subhānal-lāhu astagfir. (Jābu)"}, {"type": "arabic", "text": "واخبروا امه ان الذي حملت * بفخرهعز قدرالبيت وافتخرا *\nهو الذي كل من فى الكون يعشقه * ويطرب الصب معناه اذا ذكرا *"}, {"type": "transliteration", "text": "Wa akhbarū ummahū annal-lażī hamalat; bi fakhrihī 'azza qadrul-baiti waftakhara;\nhuwal-lażī kullu man fil-kauni ya'syaquh; wa yuṭribuṣ-ṣabbu ma'nāhu iżāżukira."}, {"type": "translation", "text": "\"Mereka mengabarkan kepada ibunya bahwa yang dikandungnya memiliki kemegahan dan dengan kemegahannya rumah menjadi mulia dan bernilai. Dia yang membuat semua yang ada di alam ini merindukannya; apabila disebut namanya, orang yang jatuh cinta bernyanyi / bergembira\"."}, {"type": "arabic", "text": "يا صاحب الصلى مجدنا رب محمد النبي محمد رسول ﷲ بدر ورفاء"}, {"type": "transliteration", "text": "Yāṣahibuṣ-ṣalla majaddanā rabbu muhammadun nabiyyi muhammadun rasulillah badru\nwa rifāi' (Jābu) ."}, {"type": "translation", "text": "\"Wahai pemilik salawat, Tuhan yang memuliakan kami; Muhammad sebagai Nabi, Muhammad Rasulullah seperti bulan purnama tempat berlindung\"."}, {"type": "arabic", "text": "هذا يتيم فقيرزانه شرف * من اﺟله تكرم اﻻيتام والفقرا\nهذا النبي الذي لوﻻﺟﻼلته * لم يخلق الخلق ﻻﺟنا وﻻ بشرا"}, {"type": "transliteration", "text": "Hażā yatīmun faqīrun zānahū syarafa; min ajlihī tukramul-aitāmu wal-fuqara;\nHażan-nabiyyul-lażī laulā jalālatuh; lam yukhlaqil-khalqu lā jinā walā basyara;"}, {"type": "translation", "text": "\"Ini anak yatim dan faqir yang memiliki kemuliaan; oleh karena itu anak-anak yatim dan kaum faqir dimuliakan; inilah Nabi yang jika bukan karena keagungannya, makhluk tidak diciptakan baik jin maupun manusia\"."}, {"type": "arabic", "text": "ايمام الحشيمي نبي قريسي محمد عربي رسول ثقلين"}, {"type": "transliteration", "text": "Īmāmul-hasyīmiyyu, nabiy quraisiyyu muhammadun 'arabiyyu rasulun ṡaqalain"}, {"type": "translation", "text": "\"Imam kaum Hasyim, nabi bagi kaum Quraisy, Muhammad bangsa Arab, Rasul bangsa jin dan manusia\". (Jābu)"}, {"type": "arabic", "text": "هذا النبي الذي من زار حجرته * نال الهنا والمنا والسؤل والوطرا *\nصلى عليه اله العرش ما سجعت * حمامة فوق غصن مائس سحرا"}, {"type": "transliteration", "text": "Hażan-nabiyyul-lażī man zāra hujratahu; nālal-hanā wal-munā was-su'ula wal-waṭara;\nṣallā 'alaihi ilāhul-'arsyi mā saja'at; hamāmatu fauqa guṣnin māisin sahara;"}, {"type": "translation", "text": "\"Inilah nabi, siapa yang mengunjungi kamarnya, akan memperoleh kesenangan, ujian, pertanyaan dan apa yang diinginkan. Semoga Tuhan 'arasy mencurahkan salawat kepadanya; melindunginya dari tukang fitnah yang menipu seperti wanita cantik di atas dahan\". (Sair kelima belas ini diselingi enam jābu)"}, {"type": "arabic", "text": "اللهم صل وسلم وزد وبارك عليه\nقال عبد الواحد بن اسماعيل * كان بمصر رﺟل يصنع مولدا للنبي صلى ﷲ عليه وسلم كل عام * وكان الى ﺟانبه رﺟل\nيهودي فقالت زوﺟة اليهودي * مابال ﺟارنا المسلم * ينفق ماﻻ ﺟزيﻼ فى مثل هذا الشهر * فقال لهــا زوﺟهــا انــه يــزعم\nان نبيه ولد فيه وهو يفعل ذلك فرحة به وكرامة له ولمولده * قال فسكتا ثم ناما ليلتهما فــرأت امــرأة اليهــودي فــى المنــام\nرﺟﻼ ﺟميﻼ ﺟليﻼ عليه مهابة وتبجيل ووقــار* فــدخل بيــت ﺟــاره المســلم* وحولــه ﺟماعــة مــن اصــحابه وهــم يبجلونــه\nويعظمونه فقالت لرﺟل منهم من هذا الرﺟل الجميل وﺟــه* فقــال لهــا هــذا رســول ﷲ صــلى ﷲ عليــه وســلم* دخــل هــذا\nالمنزل ليسلم على اهله ويزورهم لفرحهم به* فقالت له هل يكلمني اذا كلمته قال نعم* فاتت اليه* وقالــت يــا محمــد فقــال\nلها لبيك فقالت له اتجيب لمثلي بالتلبية وانا على غير دينــك ومــن اعــدائك* فقــال  لهــا والــذي بعثنــي بــالحق نبيــا مااﺟبــت\nنداءك* حتى علمت ان ﷲ تعالى قد هداك*"}, {"type": "transliteration", "text": "Qāla 'abdul-wāhidi-bni ismā'īl. Kāna bi miṣra rajulun yaṣna'u maulidan lin-nabiyyi ṣallal-\nlāhu 'alaihi wa sallama kulla 'ām. Wa kāna ilā jānibihī rajulun yahūdiyyun fa qālat\nzaujatul-yahūdiyyi. Mā bālu jārināl-muslim. Yunfiqu mālan jazīlan fi miṡli hażasy-syahri.\nFa qāla lahā zaujuhā innahū yaz'umu anna nabiyyahū wulida fīhi wa huwa yaf'alu żālika\nfarhatan bihī wa karāmatan lahū wa limaulidih. Qāla fasakatāṡumma nāmā yalutalahumā\nfara'ati-mra'atul-yahūdiyyi fil-manāmi rajulan jamīlan jalīlan 'alaihi mahābatun wa\ntabjīlun wa waqār. Fa dakhala baita jārihil-muslim. Wa haulahū jamā'atun min aṣhābihī\nwa hum yubajjilūnahu wa yuhaẓẓimūnahū fa qālat lirajulin minhum man hażar-rajulul-\njamīll-wajhi. Fa qāla lahā hażā rasulullah ṣallal-lāhu 'alaihi wa sallam. Dakhala hażal-"}, {"type": "transliteration", "text": "manzili liyusallima 'alā ahlihī wa yazūrahum li farahihim bih. Fa qālat lahū hal\nyukalimunī iżā kallamtuhū qāla na'am. Fa atat ilaih. Wa qālat yā muhammadu fa qāla\nlahā labbaiki fa qālat lahū atujību limiṡlī bit-talbiyati wa ana 'alā gairi dīnika wa min\na'dāik. Fa qāla lahā wal-lażī ba'aṡanī bil-haqqi nabiyyan mā ajabtu nidā'ak. Hattā 'amiltu\nannal-lāha ta'ala qad hadāk.\nAllahumma ṣalli wa sallim 'alā sayyidina muhammad"}, {"type": "text", "text": "Lotombilu ti Abdul wahid wala'i Ismail. Uwalio maito ta tolipu lo Masir ta lola'i\nngota mohuhutuwa mauludu lo Nabiyullah saw. Moti2idu tawunu wau maito 'olo ta lola'i\nngota Yahudi to tihedio ma'o. Bolo uwa ma'o lo dile lo ta Yahudi boito to ta lola'ilio\nuwalio wolo po'olo u hepohutuwo lo ta islamu ngongotihede ma'o wolando boti ma bolo\nhemolo hu'ayade haratalio, ma bolo dadatala to hulala boti. Bolo uwa ma'o lo ta lola'ilio,\ntutu liotutu timongolio boito he mopo'uda'a mola to nabi limongolio to hulala botia tu'udu\nu pilotutuwalio to hulala botia wolo u ma laba2 lotutu hila limongolio to nabi limongolio.\nBolo uwa ma'o lo ta ohu'uwo lo wungguli botia yio ma lotipo'oyongolo dile lo ta Yahudi\nboito, wau tomoomolilio ma'o ma lotuluhe timongolio dudulota to huyilio boito. Wau to\ndelomo tutuluhio lo tabua lo ta Yahudi boito tutu liotutu bo ma lo'ondo to ta lola'i ngota\nmai la
