ba2 lotutu molamahe lakulio, wau motinela bayalio, wau mohulalanga wau moputi'a\nwau motilanga pohuwawa'alio wolo u molumboyota alipo puhuwawa'alio, wau ma bolo\ntotililahepa lo pakeyangi mai laba2 lotutu motinela, wau owwoluwo lo ta lola'i boito ma\ntilumuwota'o tio ode bele lo ta islamu. To tihede olami boito wau tohuhama lo'u ma\ntombu2lunga ta lola'i boito towolota lo jama'ati hi'ambua hihadiria tohuhama lo'u\ntimongolio jama'ati boito ma hibuluhuta lo'u ma hipodewowa mola lo salawati uda2a\ndu'ola to ta lola'i boito. Wau ta boyi2tolo ta'uwando nabi besar Muhammad saw.\nTomoomolilio ma'o ma lohindu ma'o dile lo ta Yahudi boito to ta lola'i ngota\ntowolota lo jama'ati boito. Na'olo malo ta lola'i tonu ta mai hulo2a tombu2lungo towolota\nlo jama'ati boti, malo odiye o pipiyohu lakulio wolo ottinelo bayalio wolo u lumboyoto\n(dalam teks tertulis lumbo, diduga karena terburu-buru) sifati lio, wolo popolilio. Yio ma\nlolametai ta lola'i pilohindualio, wonu dipo mopatata olemu ta tabotiyelo ta'uwa lo tonulola\nta islamu ta tanggula nabi Muhammad rasulullah saw. Ma tilumuwotai tio ode bilulo'a boti\ntu'udu malo wengahio du'ola to ummatilio ta ma he podewowa mola lo salawati du'ola olio.\nYio poli lohindu dile lo ta Yahudi boito to ta lola'i he pohindualio. Na'olo delo mowali\nwatia mototombilua wolio boti, wonu bolo woluwo hazati lowatia ode Rasulullah botia.\nYio ma lotahuda mai Nabiyullah boito lo'u na'am (artinya ya), oditolio ma tilumalu mota\ndile lo ta Yahudi boito wolo hurmatilio, wolo dupapalio wolo po'uda'alio wolo tombilulio\nlo dile lo ta Yahudi ode Rasulullah uwalio, wu Muhammadi ma longola po'olo ito Eya\nRasulullah ma lato lotimamanga to watia botia, tohuhama lo owwoluwo lo watia ta\nngopohiya lo agamando, wau le boluta to golongani lo ta lowali musu lo ito Eya\nRasulullah.\nYio o'oditolio ma lotombangai Rasulullah wolo tahudalio uwalio, potamai to Allah\nta'ala! Tio Eya ta lomangu mai ola'u lowali nabi wolo u sobonar2 lo'u nabi. Tomulolo lo'u"}, {"type": "text", "text": "dipo lolameto wa'u tahiliyomu botiye delo bo ma mopatata ola'u tutu liotutu owwoluwo lo\nAllah ta'ala ma mongohi mai potunu ode dalala agamalio ode olemu."}, {"type": "arabic", "text": "ﷲ ﷲ ﷲ ربنا ﷲ ﷲ ﷲ حسبنا الصلوة على النبي وسلم على خير الرسول"}, {"type": "transliteration", "text": "Allah Allah Allah rabbunā. Allah Allah Allah hasbunā; aṣṣalawāti 'alan- nabiyyi, wa\nsallim 'alā khairir-rasūl ."}, {"type": "translation", "text": "\"Allah Allah Allah tuhan kami, Allah Allah Allah yang memuliakan kami, salawat dan keselamatan buat nabi sebaik-baik asul\". (Jābu)."}], "raw_line_count": 137}, {"id": 16, "name": "Sair Keenam Belas", "blocks": [{"type": "text", "text": "p. Sair keenam belas:"}, {"type": "arabic", "text": "تعالوا بنا نصطلح * فباب الرضا قد فتح* داووالفؤاد الذيبسيف الهوى قد ﺟرح\nايا مدعي حبنا* دع الروح ثم اطرح* تعلق باهل الهدى* وقل للعذول استرح\nولى قلب من حبكم* على بابكم ما برح* اﻻ يا نبي الهدى* اغث من بذكرك يصح\nاﻻ يا رسول الكريم* عليك صﻼة تصح* وشوقى لكم ما انقضا* وحبي لكم ما برح"}, {"type": "transliteration", "text": "Ta'ālau binā naṣṭalih; fa bābur-riḍā qad futih; dāwul-fuādal-lażī; bi saifil-hawā qad jurih;\nayā mudda'ī hubbinā; da'ir-rūha ṡumma ṭarih; ta'allaq bi ahlil-hudā; wa qul-lil'ażūli-\nstarih; walī qalbu min habbakum; 'alā bābikum mā barih; alā yā nabiyyal-hudā; agiṡ man\nbi żikrik yaṣih; alā yā rasūlal-karīm; 'alaika ṣalātan taṣih; wa syauqī lakum ma –nqaḍa;\nwa hubbī lakum mā barih."}, {"type": "translation", "text": "\"Mari kita bina kemaslahatan, pintu kereḍaan sudah terbuka; Obatilah hatiyang sudah terluka dengan pedang cinta (cinta yang tajam); Hai orang yang mengajak kepada cinta; tinggalkanlah hati (yang terluka) dan obatilah; Bergantunglah pada petunjuk, dan katakan pada pencela/pengeritik agar berhentilah; Aku memiliki hati yang cinta kepadamu, yang senantiasa ada di atas pintu kamu; Ingatlah wahai nabi pemberi petunjuk, bantulah yang mengingatmu dia akan sehat; Ingatlah wahai Rasulul yang mulia, salawat buatmu akan membuat selamat/sehat; Dan rasa rinduku padamu sudah berat, dan cintaku padamu terus menerus\"."}, {"type": "arabic", "text": "المولد ﷲ يا مولى المولد ﷲ يا سيد احمد محمد ملك الوﺟود ﷲ ﷲ"}, {"type": "transliteration", "text": "Al-maulūdu allah yā maulā; al-maulūdu allah yā sayyid ahmad muhammad;\nMālikil-wujūdil-lāh allah ."}, {"type": "translation", "text": "\"Yang lahir, Allah, wahai penghulu yang lahir, Allah, wahai yang mulia, yang terpuji Muhammad, raja segala yang ada, Allah, Allah\". (Jābu)."}, {"type": "arabic", "text": "وكم ﻻمنيﻻئم * وما بسلوي فرح* اما ترحموا باكيا * اذا ضحك المنشرح\nفيا سعد من حبكم * ففى العاقبه قد ربح* ترنم بذكر النبي * وغرد به ثم صح"}, {"type": "transliteration", "text": "Wa kam lā manī lāim; wa mā bisuluwwī farih; ammā tarhamū bākiyan; iżāḍahikal-\nmunsyarih; fayā sa'du man habbakum; fa fil-'āqibahu  qad rabih;\nTarannama bi żikrin-nabiyyi; wa garrid bihi ṡumma ṣih;"}, {"type": "translation", "text": "\"Betapa banyak pencela yang tidak mendatangkan kesenangan dan tidak akan membawa kegembiraan; jika kamu ingin menangis, tertawalah karena tertawa bisa melapangkan hati; Wahai yang bahagia, siapa yang kamu cintai, maka akan beruntung; Bernyanyilah dengan menyebut nabi, dan bersiullah dengan menyebutnya agar kamu bisa selamat\"."}, {"type": "arabic", "text": "الف صلوا على اﻻحمد * صلى ﷲ على المدن كل من اﻻعجم * ياصاحب الفرح"}, {"type": "transliteration", "text": "Alfa ṣallū 'alal-ahmad. ṣallal-lāhu 'alal-madan; qul minal-ajam, yāṣāhibul-farh."}, {"type": "translation", "text": "\"Beribu salawat buat yang terpuji, semoga Allah mencurahkan salawat kepada gudang ilmu, kepada semua ‘ajam(bukan bangsa Arab), wahai pemilik kesenangan\" (Jābu)"}, {"type": "arabic", "text": "اﻻ نبي الهدى * اغث من بذكرك يلح* وصل علىالمصطفى * ختامي ومن به فتح"}, {"type": "transliteration", "text": "Alā yā nabil-hudā; agiṡ man bi żikrik yalih; wa ṣalli 'alal-muṣṭafā; khitāmī wa man bihi"}, {"type": "text", "text": "futih."}, {"type": "translation", "text": "\"Ingatlah wahai nabi pemberi petunjuk, bantulah yang mengingatmu dengan nyata; Salawatlah buat yang terpilih yakni penutupku dan siapa yang bersamanya akan menang\"."}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nفقالت انك لنبي كريم* وانك لعلى خلق عظيم تعس من خالف امرك وخاب من ﺟهل قدرك* امدد يدك فانا اشهد ان ﻻ اله\nاﻻ ﷲ* وانك محمد رسول ﷲ صلى ﷲ عليه وسلم ثم انها عاهــدت ﷲ فــى ســرها انهــا اذا اصــبحت تتصــ دق بجميــع مــا\nتملكه وتصنع مولدا للنبي صلى ﷲ عليه وسلم فرحة باسﻼمها* وشكرا للرؤيا التى راتها فى منامها* فلما اصبحت رأت\nزوﺟها قد هيأ الوليمة* وهو فى همة عظيمة* فتعجبت من امره وقالت له مالي اراك فى همة صالحة فقال لها مــن اﺟــل\nالذي اسلمت على يديه البارحة* فقالت له من كشف لك عن هذا السر المصون* ومن اطلعك عليه فقال لها الذي اســلمت\nودعا اليه فهو المشفع غدا فيمن يصلى ويسلم عليهͿبعدك على يديه صلى ﷲ عليه وسلم كما عرف با"}, {"type": "transliteration", "text": "Allahumma ṣalli wa sallim wa bārik 'alaih\nFa qālat innaka lanabiyyun karīm. Wa innaka la'alā khuluqin 'aẓīm ta'isa man khālafa\namraka wa khāba man jahila qadraka. Umdud yadaka fa ana asyhadu an lā ilāha illal-lāh.\nWa annaka muhammadun rasulullah ṣallal-lāhu 'alaihi wa sallama ṡumma annahā"}, {"type": "translation", "text": "'āhadatil-lāha fī sirrihā annahā iżā aṣbahat tataṣaddaqu bi jamī'i mā tamlikuhū wa taṣna'u maulidan lin-nabiyyi ṣallal-lāhu 'alaihi wa sallama farhatan bi –slāmiha. Wa syukran lir- ru'yal-latī ra'aṭā fī manāmiha. Falammā aṣbahat ra'at zaujahā qad hayya'al-walīmah. Wa huwa fī himmatin 'aẓīmah. Fa ta'ajjabat min amrihī wa qālat lahū mālī arāka fī himmatin ṣālihatin fa qāla lahā min ajlil-lażī aslamti 'alā yadaihil-bārihah. Fa qālat lahū man kasyafa laka 'an hażas-sirril-maṣūn. Wa man aṭla'aka 'alaihi fa qāla lahal-lażī aslamtu ba'daki 'alā yadaihi ṣallal-lāhu 'alaihi wa sallama kamā 'arrafa bil-lāhi wa da'ā ilaihi fahuwal-musyaffa'u gadan fīman yuṣallī wa yusallimu 'alaihi. Allahumma ṣalli wa sallim 'alā sayyidina muhammad Lotombilu dile lo ta Yahudi uwalio; tutu liotutu ito2lo nabi mai laba2 lotutu molanggata wau uda2a. Yio tutu liotutu ma tilala bolo meyalo tita lotita ta momotola parendando, wau ma yiloleta'olo bolo meyalo tita lotita ta motitihulude to u ilowaliyando, wau muhuli bo wuduwa lomai olu'undo alihu ma datio mai lowatia. Wau watia ma timihula saksi tuwota tutu liotutu diyalu Eya ngopohiya ta tubola tuhatuhata delo bo Allah ta'ala ta ohu'uwo lo zāti wājibul-wujūd mustahaqqul-'ibād khāliqul-ālam. Wau tutu liotutu ito Eya nabi Muhammad Rasulullah saw. Wau tomoomolilio ma'o yito dile lo ta Yahudi boito ma lonazari lomola ode Allah ta'ala tu'udu u ma ilo niati u todelomo hilalio mohutu mauludu lo Nabiyullah saw. Wau to'u ma dilu2modupa mola tio ma losadasadaqa lomota to ta hi'ambua mo'a'āmilala boito tu'udu u hepohutuwolio yito bo mauludu lo Nabi saw. Wau ma ohilawo tio tumuwota ode agama islamu, wau mosyukuru tio u tilohilopio. Yio tondohulo u ma dilu2modupa mola ma he'ondongalio ma'o lo ta bualio ta lola'ilio hemotonapata u pohindalio to ta hi'ambuwa mo'a'āmilala boito, wau todelomo 'e'eetilio ma'o laba2 lotutu uda2a. Wau ma lolinggolabulo dile lo ta Yahudi boito ma lo'ondo ma'o to ta lola'ilio ma hemotonapata moposadia lo u moali pohutu, wau pohuli lo mauludu debo odelo u mohutu tambati lo walimah. Yio ma lolinggolabulo hila lo tabua lo ta Yahudi boito karna ta lola'i ma todelomo huhutu mopio, wolo u ma yindu2lo ma'o dile lo ta Yahudi du'ola to ta lola'ilio uwalio, ma hebilohe'u mai yi'o botiye ma todelomo huhutu mopio. Bolo uwa ma'o lo ta lola'ilio saba2bu to owwoluwomu ohui tilumuwota ode agama islamu du'ola totalu lo Rasulullah saw. Yio oditolio lokhabari ma'o tabualio lo ta Yahudi boito uwalio, malo tatonu ta ma mai lomu'o rahasia tingga u donggolo u tutu'a todelomo hila'u botiya. Wau malo tatonu ta ma lohulohungguli olemu botiye. Bolo tameta'o lo ta lola'ilio uwalio, owwoluwo'u botiya ma lowali islamu wau bili'atilio lo Rasulullah, tomoomolilio ma'o lo utio Eya Rasulullah lomi'ati olemu. Debo odelo u ma lopo'ilalo mai Allah ta'ala lo potunulio wolo hidayalio du'ola olando dudulota, wau dulolo ito sama2 ma mohutu mauludu wolo u ma posyukurundo mola ode Allah ta'ala, du'ola to karunia ma laba2 lotutu karna nabi Muhammad boito ta mola mongohi syafa'ati to dudupo u kiamah olo ta yinawola lo u mohutu mopo'uda'a lo mauludu bolo meyalo tita lotita ta moṣalawati po'o2data du'ola olio."}, {"type": "arabic", "text": "صﻼة و تسليم وازكى تحية\nعلى المصطفى المختار خير البرية"}, {"type": "transliteration", "text": "ṣalātun wa taslīmun wa azkā tahiyyatin"}, {"type": "translation", "text": "'alal-muṣṭafāl-mukhtāri khairil-bariyyah ============================================================="}], "raw_line_count": 101}, {"id": 17, "name": "Sair Ketujuh Belas", "blocks": [{"type": "text", "text": "q. Sair ketujuh belas:"}, {"type": "arabic", "text": "حبيب يغارالبدر منحسن وﺟهه   * تحيرت اﻻفكار في وصف معناه *\nحبيب تجلى للقلوب مخاطبا     * فطابوا به شكرا وفى حسنه تاهوا *\nمليح حوى كل القلوب لحسنه    * فرحت وراح القلب من بعض اسراه *\nرضيت به مولى على كل حالة   * فقل لبعيد الدار دعنى واياه *\nيواصلنى طورا وطورا يصدني   * وها انا راض بالذى هو يهواه *\nفلوﻻه ما طاب الهوى لمتيم      * وﻻ استعذب الطرف المدامع لوﻻه *\nولوﻻه ما حن الحداة لحاﺟر     * وﻻ استنشق العشاق يوما خراماه *\nصﻼة وتسليم على خير مرسل   * محمد الداعي الى سبل اهداه *"}, {"type": "transliteration", "text": "habībun yagārul-badru min husni wajhihi; taharratil-afkāru fi waṣfi ma'nāhu;\nhabībun tajallā lilqulūbi mukhāṭiba; faṭābū bihi syukran wa fi husnihi tāhu; malīhun hawā\nkullal-qulūbi lihusnih; faruhtu warāhal-qalbu min ba'ḍi asrāh; raḍītu bihī maulan 'alā\nkulli hālah; faqul liba'īdid-dāri da'nī wa iyyāh; yuwāṣilunīṭauran wa ṭauran\nyaṣuddunī;wahā ana rāḍin bil-lażī huwa yahwāh; fa laulāhu māṭābal-hawā\nlimutayyam;wala-sta'zabaṭ-ṭarful-madāmi'u laulāh; wa laulāhu mā hannal-hudātu\nlihājir;wa la-stansyaqal-'usysyāqu yauman khurāmāh;ṣalātun wa taslīmun 'alā khairin\nmursal;muhammadini-ddā'ī ilā subulin ahdāh;"}, {"type": "translation", "text": "\"Bulan purnama berubah karena kebaikan wajah kekasih; pikiran-pikiran menjadi bingung dalam menggambarkan jati dirinya; kekasih dapat membesarkan jiwa orang-orang yang berbicara; mereka bersyukur dan bingung karena kebaikannya yang elok sudah terhimpun pada semua hati/jiwa; Sebagian perjalanan hidupnya membuat aku gembira dan lapang hati; Aku rela menjadi hamba /budak padanya atas segala hal; katakanlah kepada penduduk rumah yang jauh, tinggalkan dan jauhilah dia; akan sampai kepadaku satu keadaan dan itu yang menghalangiku hampir jatuh, dan aku rela terhadap apa yang meruntuhkannya; jika bukan karena keinginan yang baik bagi hamba, air mata tidak akan keluar; jika bukan karena dia, bunyi suara orang yang rindu tidak akan terbelah/pecah; salawat dan salam buat sebaik-baik rasul; Muhammad yang menyeru kepada jalan petunjuk\"."}, {"type": "arabic", "text": "ذكر نبي تم المولد , ذكر نبي تم المولد * محمد رسول ﷲ * محمد حبيب ﷲ * تم المولــد الشــريف بحمــد ﷲ بعونــه* تــم\nالمولد العظيم امين امين"}, {"type": "transliteration", "text": "żikru nabiyyi tammal-mauludu; żikru nabiyyi tammal-mauludu;muhammadun rasulullah;\nmuhammadun habībul-lāh;tammal-mauludusy-syarīfu bi hamdil-lāh bi 'aunihi;tammal-\nmauludul-'aẓīmu āmīn āmin;"}, {"type": "translation", "text": "\"Tamat zikir maulud Nabi; tamat zikir maulud Nabi; Muhammad Rasulullah; Muhammad kekasih Allah; tamat maulud yang mulia dengan pujian Allah dengan petunjuk-Nya; tamat maulud yang agung, Āmīn... Āmin\"."}], "raw_line_count": 38}, {"id": "doa", "name": "Doa Khatmul Dikili", "blocks": [{"type": "text", "text": "3. Doa:"}, {"type": "arabic", "text": "اللهم صل على محمد   يا رب صل عليه وسلم\nفى حب سيد نا محمد  نور لبدرالهدى متمم\nقلبي يحن الى محمد    ما زال من وﺟده متيم\nمالى حبيب سوى محمد   خير الرسول النبي المكرم\nشوق المحب الى محمد افناه ثم به تهيم\nفى الحشر شافعنا محمد منجى الخﻼئق من ﺟهنم\nميﻼد سيدنا محمد  ام القرى بلد معظم\nاحياالدﺟا زمنا محمد  موﻻه سلمه وكلم\nادعوك احمد يا محمد  يا سيد الرسل المقدم\nاشفع الى ﷲ يا محمد  يوم القيامة لى انعم\nارﺟو الشفاعة من محمد  لو كنت ارتكب المحرم\nمنجا وملجأنا محمد  يوم الهوان به تحشم\nوالنور ﺟاء به محمد  والحق بين ان تكلم\nاعﻼ السماء سما محمد ﺟبريل قال له تقدم\nوالجند حين غزا محمد   منهم مﻼئكة تسوم"}, {"type": "arabic", "text": "والدين اظهره محمد  والكفر ابطله فهدم\nصلى اﻻله على محمد  واﻻل كلهم وسلم\nوصلى ﷲ على محمد   وعلى صحبه وسلم"}, {"type": "transliteration", "text": "Allahumma ṣalli 'alā muhammad;   yā rabbi ṣalli 'alaihi wa sallim;\nFi hubbi sayyidinā muhammad;   nūrun li badril-hudā mutammam;\nQalbī yahinnu ilā muhammad;   māzāla min wujdihī mutayyam;\nMālī habībun siwā muhammad;  khairir-rasūlin-nabiyyil-mukarram;\nSyauqul-muhibbu ilā muhammad;  afnāhu ṡumma bihi tahayyam;\nFil-hasyri syāfi'unā muhammad;  munjil-khalāiqi min jahannam;\nMīlādu sayyidinā muhammad;  ummul-qurā baladun mu'aẓẓam;\nAhyad-dujā zamanan muhammad;  maulāhu sallamahū wa kallam;\nAd'ūka ahmadu yā muhammad;  yā sayyidir-rusulil-muqaddam;\nIsyfa' ilal-lāhi yā muhammad;  yaumal-qiyāmati lī una' 'am;\nArjusy-syafā'ata min muhammad;  lau kuntu artakibul-muharram;\nManjā wa malja'anā muhammad;  yaumal-hawāni bihi tahasysyam;\nWan-nūru jā'a bihi muhammad;  wal-haqqu bayyana an takallam;\nA'lās-samāi samā muhammad;  jibrīlu qāla lahu taqaddam;\nWal-jundu hīna gazā muhammad;  minhum malāikatu tasawwam;\nWad-dīnu aẓharahu muhammad;  wal-kufru abṭalahū fahaddam;\nṣallal-ilāhu 'alā muhammad;   wal-āli kullihim wa sallam;\nWa ṣallal-lāhu 'alā muhammad;  wa 'alāṣahbihī wa sallam;"}, {"type": "translation", "text": "\"Ya Allah curahkan salawat buat Muhammad; ya Tuhan! Curahkan salawat dan keselamatan kepadanya\" Kecintaan terhadap sayyidina Muhammad karena beliau memberikan petunjuk secara sempurna seperti cahaya bulan purnama. Hatiku senantiasa rindu kepada Muhammad karena keberadaannya yang yatim; Tidak ada kekasihku selain Muhammad sebaik-baik rasul dan nabi yang mulia; Kerinduan orang yang cinta kepada Muhammad bisa membinasakan dan membingungkan; Muhammad memberikan syafa'at kepada kita di padang Mahsyar dan menyelamatkan makhluk dari neraka jahannam; Kelahiran sayyidina Muhammad Ummul-Qura sebuah kota yang diagungkan; Kehidupan yang berat pada masa Muhammad semua pembesar menyelamatkan dan memperbincangkannya; Aku bermohon kepadamu yang terpuji wahai Muhammad, wahai penghulu para rasul yang terdahulu. Mintalah syafa'at kepada Allah wahai Muhammad berupa kenikmatan untukku pada hari kiamat; Aku mengharapkan syafa'at dari Muhammad jika sekiranya aku berbuat yang haram; Pada hari itu Muhammad yang menyertai dan menyelamatkan kami dari aib dan malu; Cahaya telah datang, dan telah menjelaskan kebenaran apa yang dikatakan oleh Muhammad; Ketinggian Muhammad lebih tinggi daripada langit, dan Jibril telah mengatakan lebih dahulu padanya. Ketika tentara mencari Muhammad, sebagian malaikat menjaganya; Muhammad telah menampakkan agamanya, dan orang kafir tidak menerimanya sehingga mereka binasa; Semoga Tuhan mencurahkan salawat buat Muhammad, dan keselamatan buat para keluarganya; Semoga Allah mencurahkan salawat buat Muhammad, dan keselamatan buat para sahabatnya."}, {"type": "arabic", "text": "اللهم صل وسلم وبارك عليه\nرب العــالمين*اللهم Ϳصدق ﷲ العلي العظيم* وبلغ رسوله الحبيب الكريم * ونحن علــى ذلــك مــن الشــاهدين* والحمــد\nصل وسلم على سيدنا محمد فى اﻻولين* وصل على سيدنا محمد فى اﻻخرين* وصل وسلم على سيدنا محمد فى النبيين\n* وصل  وسلم على سيدنا محمد فى كل وقت وحين* وصل وسلم على سيدنا محمد فــى المــﻺ اﻻعلــى الــى يــوم الــدين*\nالسﻼم عليك ايها النبي ورحمة ﷲ وبركاته* السﻼم علينا وعلى عبــاد ﷲ الصــالحين* اللهــم بلــغ روح ســيدنا محمــد منــا\nتحية وسﻼما* واﺟزه عنا افضل ما ﺟزيت نبيا عن امته* واته الوســيلة والفضــ يلة والشــرف والدرﺟــة العاليــة الرفيعــة*\nوابعثه المقام المحمود الذى وعدته يا ارحم الراحمين* اللهم اﺟعلنا واياهم ممن يســتوﺟب شــفاعته* ويرتجــى بــه مــن ﷲ\nرب العالمين* اللهم بحرمة هذا النبي الكريم* والــه واصــحابه الســالكين لنهجــه القــويم* اﺟعلنــا مــن Ϳرحمته* والحمد"}], "raw_line_count": 77}], "manuscripts": [{"code": "A", "owner": "Hartati Mopangga", "pages": 117, "size": "21×16 cm", "lines_per_page": "15 baris", "colophon": "Ditulis 15-6-1986, penyalin: A.D. Laya, Kel. Huangobotu, Kec. Kota Barat, Kotamadya Gorontalo", "paper": "Kertas buku tulis bergaris", "ink": "Hitam dan merah (merah untuk basmalah, salawat, dan jābu)", "script": "Arab Pegon (sebagian bersyakal, sebagian tidak)", "quality": "Tulisan kurang bagus dan kurang rapi, banyak pemenggalan kata tidak sesuai kaidah", "content": "Sair-sair, jābu, hikayat Nabi Muhammad, doa. Terjemahan bahasa Indonesia dan Gorontalo (huruf Arab Pegon)", "notes": "Banyak kesalahan penulisan ayat Al-Quran (contoh: QS. Al-Fath ayat 2–3, QS. At-Taubah ayat 128–129)", "is_base": false}, {"code": "B", "owner": "Hamu Ahmad", "pages": 121, "size": "15×10 cm", "lines_per_page": "9 baris", "colophon": "Tidak ada kolofon", "paper": "Kertas buatan Indonesia (dugaan era Orde Baru)", "ink": "Hitam dan merah", "script": "Arab Pegon", "quality": "Masih bisa dibaca, banyak pemenggalan kata tidak sesuai kaidah", "content": "Sair-sair, jābu, hikayat Nabi Muhammad, doa. Terjemahan hanya bahasa Gorontalo (tidak ada bahasa Indonesia)", "notes": "Banyak kesalahan penulisan ayat Al-Quran", "is_base": false}, {"code": "C", "owner": "KH. Naha Akadji", "pages": 119, "size": "19×13 cm", "lines_per_page": "Bervariasi (5–15 baris)", "colophon": "7 Rabi'ul Awwal 1415 H / 16 Agustus 1994 (ditulis sendiri oleh pemilik)", "paper": "Buku tulis dibagi dua (fotokopi)", "ink": "Tidak disebutkan secara khusus", "script": "Huruf Latin (terjemahan Indonesia) dan Arab Pegon (terjemahan Gorontalo)", "quality": "Cukup rapi dan jelas, tidak banyak kesalahan", "content": "Sair-sair, jābu (lebih sedikit), hikayat Nabi Muhammad, doa", "notes": "Memiliki iluminasi: Basmalah berbentuk gambar itik, salawat berbentuk pesawat terbang", "is_base": false}, {"code": "D", "owner": "Mustapa Taha", "pages": 188, "size": "20×14 cm", "lines_per_page": "Bervariasi (7–15 baris)", "colophon": "Dua kolofon: (1) huruf Latin — 1424 H/2003 M, Desa Bakti Pulubala; (2) huruf Arab Pegon — 1419 H/1999 M, Batu Layar", "paper": "Sair dan ayat Al-Quran = fotokopi dari sumber asli. Terjemahan dan jābu = tulisan tangan Arab Pegon", "ink": "Fotokopi dari sumber", "script": "Arab (fotokopi sumber asli) dan Arab Pegon (tulisan tangan untuk terjemahan dan jābu, bersyakal/bertanda baca)", "quality": "Fisik masih bagus, tulisan jelas, mudah dibaca. Jābu paling banyak dibanding naskah lain", "content": "Sair-sair, jābu (terbanyak), hikayat Nabi Muhammad, doa. Terjemahan bahasa Indonesia dan Gorontalo", "notes": "Dugaan penyalinan tahun 1999 M", "is_base": true, "base_rationale": ["Tulisannya jelas dan mudah dibaca", "Keadaan naskah masih baik dan utuh", "Sesuai dengan sumber dan fakta", "Isinya lengkap dan tidak menyimpang dari kebanyakan isi naskah lain"]}], "kearifan_lokal": [{"name": "Sisipan Jābu", "description": "Jābu adalah kata-kata atau kalimat puji-pujian terhadap Allah maupun Rasulullah, para sahabat, salawat, doa, syahadat, atau kalimat tayyibah yang disisipkan pada setiap sair. Merupakan ciptaan orang-orang tua dahulu atau penulis naskah. Dalam 17 sair terdapat 62 jābu."}, {"name": "Penulisan Huruf Arab Pegon", "description": "Naskah Dikili menggunakan huruf Arab Pegon (Arab Melayu) dengan adaptasi fonem: /ng/ = huruf ghain, /ny/ = huruf nun, /c/ = jim titik tiga (چ), /g/ = kaf. Keunikan: naskah Dikili tetap memakai harakat (syakal), termasuk untuk fonem /o/ dan /e/ yang dilambangkan dengan hamzah terbalik."}, {"name": "Penerjemahan Dwibahasa", "description": "Penerjemahan kisah-kisah Nabi Muhammad ke dalam bahasa Indonesia dan bahasa Gorontalo. Menariknya ada kisah yang hanya diterjemahkan ke bahasa Indonesia, dan ada yang hanya ke bahasa Gorontalo. Menggunakan kosakata lama yang sudah tidak dipahami generasi muda."}]};
    let currentSairId = null;

    function init() {
      document.getElementById('app-subtitle').innerHTML = 
        `Suntingan Teks berdasarkan <strong>${DATA.info.manuscript_base}</strong>`;
      
      renderSairSelector();
      renderInfo();
      renderKearifan();
      setupEvents();
      
      if (DATA.sairs.length > 0) {
        loadSair(DATA.sairs[0].id);
      }
    }

    function renderSairSelector() {
      const select = document.getElementById('sair-select');
      DATA.sairs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        select.appendChild(opt);
      });
    }

    function loadSair(id) {
      currentSairId = id;
      document.getElementById('sair-select').value = id;
      const sair = DATA.sairs.find(s => s.id.toString() === id.toString());
      if (!sair) return;

      let html = `<h3 style="font-size:18px; font-weight:800; margin-bottom:16px; color:var(--text); text-align:center;">${sair.name}</h3>`;
      
      sair.blocks.forEach(b => {
        // Clean up text
        let text = b.text.trim();
        // Remove trailing quotes if empty line
        if (text === '"' || text === "'") return;
        
        // Remove page numbers that might have slipped through parser
        text = text.replace(/^\d+\s*$/, '');
        if (!text) return;

        let cssClass = 'block-text';
        if (b.type === 'arabic') cssClass = 'block-arabic';
        if (b.type === 'transliteration') cssClass = 'block-transliteration';
        if (b.type === 'translation') cssClass = 'block-translation';
        if (b.type === 'footnote') cssClass = 'block-footnote';

        html += `<div class="content-block ${cssClass}">${text.replace(/\n/g, '<br>')}</div>`;
      });

      document.getElementById('naskah-content').innerHTML = html;
      window.scrollTo(0, 0);
    }

    function renderInfo() {
      let html = `
        <div class="card">
          <div class="card-title">Penyusun Edisi Kritis</div>
          <div class="card-content">
            <strong>${DATA.info.authors}</strong><br>
            ${DATA.info.institution} (${DATA.info.year})<br>
            <em>${DATA.info.source || "Kearifan Lokal dalam Naskah Dikili"}</em>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Naskah Landasan</div>
          <div class="card-content">${DATA.info.manuscript_base}</div>
        </div>
        <h3 style="margin: 20px 0 10px; font-size:16px;">Perbandingan Manuskrip</h3>
      `;

      DATA.manuscripts.forEach(m => {
        const isBase = m.is_base;
        html += `
          <div class="card" style="${isBase ? 'border-left: 3px solid var(--gold);' : ''}">
            <div class="card-title">Naskah ${m.code} ${isBase ? ' (Naskah Landasan)' : ''}</div>
            <div class="card-content">
              <strong>Pemilik:</strong> ${m.owner}<br>
              <strong>Fisik:</strong> ${m.pages} halaman, ${m.size}, ${m.lines_per_page}<br>
              <strong>Kolofon:</strong> ${m.colophon}<br>
              <strong>Kertas & Tinta:</strong> ${m.paper}, ${m.ink}<br>
              <strong>Aksara:</strong> ${m.script}<br>
              <strong>Isi:</strong> ${m.content}<br>
            </div>
            ${isBase && m.base_rationale ? `
              <div style="margin-top:10px; padding:10px; background:rgba(245,158,11,0.1); border-radius:6px; font-size:12px;">
                <strong>Alasan Pemilihan:</strong>
                <ul style="margin:4px 0 0 16px;">
                  ${m.base_rationale.map(r => `<li>${r}</li>`).join('')}
                </ul>
              </div>
            ` : ''}
          </div>
        `;
      });
      document.getElementById('info-content').innerHTML = html;
    }

    function renderKearifan() {
      let html = '';
      DATA.kearifan_lokal.forEach(k => {
        html += `
          <div class="card" style="border-left: 3px solid var(--primary);">
            <div class="card-title">${k.name}</div>
            <div class="card-content">${k.description}</div>
          </div>
        `;
      });
      document.getElementById('kearifan-content').innerHTML = html;
    }

    function setupEvents() {
      // Tabs
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
          window.scrollTo(0, 0);
        });
      });

      // Selector
      document.getElementById('sair-select').addEventListener('change', (e) => {
        loadSair(e.target.value);
      });

      // Fonts
      let arSize = 28;
      document.getElementById('btn-font-inc').addEventListener('click', () => {
        arSize = Math.min(arSize + 2, 44);
        document.documentElement.style.setProperty('--arabic-size', arSize + 'px');
      });
      document.getElementById('btn-font-dec').addEventListener('click', () => {
        arSize = Math.max(arSize - 2, 20);
        document.documentElement.style.setProperty('--arabic-size', arSize + 'px');
      });

      // Theme
      document.getElementById('btn-theme').addEventListener('click', () => {
        document.body.classList.toggle('light');
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
